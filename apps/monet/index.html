<title>Мой Моне</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../assets/ui.css">
<style>
html,body{height:100%}
body{overflow:hidden}
.z-app{height:100vh;height:100dvh;min-height:0;padding-left:16px;padding-right:16px;padding-bottom:calc(var(--safe-b) + 8px)}
.z-top{margin:0 -8px}
.easel{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:2px 0 14px}
.frame{position:relative;border-radius:5px;overflow:hidden;background:#efe6d6;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 2px 0 rgba(255,255,255,.05),0 30px 60px -22px rgba(0,0,0,.85),0 12px 24px -12px rgba(0,0,0,.6)}
.frame canvas{position:absolute;left:0;top:0;display:block}
#paint{touch-action:none}
#grain{pointer-events:none;mix-blend-mode:multiply;opacity:.55}
.sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.9;
  background:linear-gradient(112deg,rgba(255,255,255,0) 30%,rgba(255,244,214,.38) 47%,rgba(255,255,255,0) 63%);
  background-size:320% 100%;background-position:0 0;animation:sheen 16s ease-in-out infinite alternate}
@keyframes sheen{to{background-position:100% 0}}
.vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px rgba(60,40,20,.16),inset 0 0 0 1px rgba(255,255,255,.12)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(70% 60% at 50% 45%,rgba(255,238,190,.75),rgba(255,238,190,0) 70%);mix-blend-mode:screen}
.flash.go{animation:flash 1.6s var(--ease)}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:28px;pointer-events:none;color:#51463c;transition:opacity .5s}
.empty b{font:400 34px/1.05 var(--display);color:#3f352d}
.empty b i{font-style:italic}
.empty span{font-size:15px;line-height:1.5;max-width:17em;color:#5a4e44;text-wrap:balance}
.empty .z-btn{pointer-events:auto;margin-top:12px;background:#22312f;color:#f3ece0;box-shadow:0 10px 24px -10px rgba(20,30,28,.7)}
.empty.hide{opacity:0}.empty.hide .z-btn{pointer-events:none}
.busy{position:absolute;inset:0;display:none}.busy.on{display:block}
.dock{flex:none}
.pals{display:flex;justify-content:center;gap:4px;margin-bottom:2px}
.pal{width:48px;height:40px;display:grid;place-items:center}
.pal i{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);transition:transform .3s var(--ease),box-shadow .3s}
.pal[aria-pressed=true] i{transform:scale(1.14);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.dock .z-bar{margin:0 -6px;padding-top:4px}
.moods{display:none;justify-content:space-between;gap:0;margin:0 0 4px}
.moods.on{display:flex}
.md{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);color:var(--ink-2);font:400 10px/1 var(--text);letter-spacing:-.02em;white-space:nowrap}
.md i{width:22px;height:22px;border-radius:50%;transition:transform .3s var(--ease),box-shadow .3s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.md[aria-pressed=true]{color:var(--ink)}
.md[aria-pressed=true] i{transform:scale(1.12);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.dock .z-tool{font-size:11px;min-height:58px;gap:5px;position:relative}
.dock .z-tool.on{color:var(--ink);background:var(--surface-2)}
.dock .z-tool.on::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.dock .z-tool.on span{margin-bottom:6px}
.dock .z-tool svg{width:25px;height:25px}
.rows{display:flex;flex-direction:column;margin:6px 0 0}
.row{display:flex;align-items:center;gap:16px;min-height:62px;width:100%;padding:8px 2px;text-align:left;border-top:1px solid var(--line);color:var(--ink);font:500 16px/1.25 var(--text)}
.row:first-child{border-top:0}
.row:active{background:var(--surface)}
.row>svg{width:22px;height:22px;flex:none;color:var(--ink-2);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row small{display:block;margin-top:3px;font-weight:400;font-size:13px;line-height:1.35;color:var(--ink-2)}
.row.warn{color:var(--accent)}.row.warn>svg{color:var(--accent)}
.sh-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid button{aspect-ratio:3/4;border-radius:5px;overflow:hidden;background:#0f1817;box-shadow:0 0 0 1px var(--line),0 8px 18px -10px rgba(0,0,0,.8);transition:transform .2s var(--ease)}
.grid button:active{transform:scale(.97)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.none{color:var(--ink-2);font-size:15px;line-height:1.55;padding:6px 0 14px;max-width:26em}
.view img{width:100%;max-height:50vh;max-height:50dvh;object-fit:contain;border-radius:5px;background:#0f1817;display:block;box-shadow:0 14px 30px -14px rgba(0,0,0,.8)}
.view .date{color:var(--ink-2);font-size:14px;margin:12px 0 4px}
.namein{font:italic 500 26px/1.2 var(--display);margin:6px 0 4px}
.ghostline{margin-top:6px;text-align:center}
.z-toast{max-width:calc(100% - 32px);white-space:normal;text-align:center;bottom:calc(var(--safe-b) + 150px)}
@media (max-width:370px){.dock .z-tool{font-size:10.5px}}
@media (prefers-reduced-motion:reduce){.sheen{animation:none}}
</style>

<body>
<div class="z-app">
  <div class="z-top">
    <a class="z-icon" href="../../index.html" aria-label="Все приложения"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></a>

    <button class="z-icon" id="bUndo" aria-label="Отменить мазок" disabled><svg viewBox="0 0 24 24"><path d="M9 7L4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 010 10H12"/></svg></button>
    <button class="z-icon" id="bMenu" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4.5 8h15M4.5 12h15M4.5 16h15"/></svg></button>

<div class="z-sheet" id="shMenu" role="dialog" aria-label="Меню">

  <div class="rows">
    <button class="row" id="mGal"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 16l5-4.5 4 3.5 3-2.5 5 4"/><circle cx="15.5" cy="9" r="1.4"/></svg><span>Моя галерея<small id="mGalSub">Здесь живут сохранённые картины</small></span></button>
    <button class="row" id="mSave"><svg viewBox="0 0 24 24"><path d="M5 4.5h11l3 3v12H5z"/><path d="M8 4.5v5h7v-5M8 19.5v-6h8v6"/></svg><span>Сохранить в галерею<small>Останется в этом телефоне, до 20 картин</small></span></button>
    <button class="row" id="mShare"><svg viewBox="0 0 24 24"><path d="M12 15V4.5M8 8l4-3.5L16 8"/><path d="M5 12v7.5h14V12"/></svg><span>Отправить картинкой<small id="mShareSub">В сообщение или в фотографии</small></span></button>
    <button class="row" id="mSign"><svg viewBox="0 0 24 24"><path d="M4 18.5c3-1 4-8 6.5-8 2 0 .5 5 2.5 5 1.5 0 1.5-3 3.5-3 1 0 1 1.5 3.5 1.5"/></svg><span>Подписать<small>Как Моне — в нижнем углу</small></span></button>
    <button class="row" id="mPond"><svg viewBox="0 0 24 24"><path d="M3.5 14c2-2 4-2 6 0s4 2 6 0 3-1.5 5-.5"/><path d="M3.5 18.5c2-2 4-2 6 0s4 2 6 0 3-1.5 5-.5"/><path d="M12 11c-3 0-5-2-5-5 2 .5 4 2 5 5zm0 0c3 0 5-2 5-5-2 .5-4 2-5 5z"/></svg><span>Начать с пруда<small>Холст с водой, листьями и цветами</small></span></button>
    <button class="row warn" id="mClear"><svg viewBox="0 0 24 24"><path d="M6 7.5h12M9.5 7.5V5h5v2.5M7.5 7.5l.7 11.5h7.6l.7-11.5"/></svg><span>Чистый холст<small>Можно вернуть стрелкой «отменить»</small></span></button>
  </div>
</div>
<div class="z-sheet" id="shSign" role="dialog" aria-label="Подпись">
  <h2 class="z-h2">Подпись <i>художника</i></h2>
  <p class="z-lead" style="margin-bottom:16px">Напиши, как тебя подписать: имя и год встанут в нижний угол картины.</p>
  <input class="z-field namein" id="nameIn" maxlength="24" placeholder="Например: Наталья" autocomplete="off" aria-label="Имя для подписи">
  <button class="z-btn wide" id="sSignGo" style="margin-top:14px">Подписать картину</button>
  <div class="ghostline"><button class="z-btn quiet" data-close>Отмена</button></div>
</div>
<div class="z-sheet" id="shGal" role="dialog" aria-label="Галерея">
  <div class="sh-h"><h2 class="z-h2">Моя <i>галерея</i></h2><span class="z-cap z-num" id="galCount" style="color:var(--ink-2)"></span></div>
  <div id="galBody"></div>
</div>
<div class="z-sheet view" id="shView" role="dialog" aria-label="Картина">
  <img id="vImg" alt="Картина из галереи">
  <div class="date" id="vDate"></div>
  <div class="rows">
    <button class="row" id="vCont"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l1-4L16 5l3 3L8.5 18.5z"/><path d="M14 7l3 3"/></svg><span>Продолжить рисовать</span></button>
    <button class="row" id="vShare"><svg viewBox="0 0 24 24"><path d="M12 15V4.5M8 8l4-3.5L16 8"/><path d="M5 12v7.5h14V12"/></svg><span>Отправить картинкой</span></button>
    <button class="row warn" id="vDel"><svg viewBox="0 0 24 24"><path d="M6 7.5h12M9.5 7.5V5h5v2.5M7.5 7.5l.7 11.5h7.6l.7-11.5"/></svg><span id="vDelT">Убрать из галереи</span></button>
  </div>
</div>

<script>
(()=>{
'use strict';
const LS='kuv_monet_';
/* схема v1 (не менять): pal, brush, current(jpeg dataURL), name, gallery(JSON [id]), img_<id>(jpeg dataURL); новое: v2_seen, mood, v3_seen */
const store={get(k){try{return localStorage.getItem(LS+k)}catch(_){return null}},set(k,v){try{localStorage.setItem(LS+k,v);return true}catch(_){return false}},del(k){try{localStorage.removeItem(LS+k)}catch(_){}}};
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const paint=$('#paint'),grain=$('#grain'),frame=$('#frame'),easel=$('#easel');
const ctx=paint.getContext('2d');
let W=0,H=0,DPR=1,ar=null;
const TAU=Math.PI*2;
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(_){}};

/* ---------- палитры: [h,s,l] ---------- */
const PAL={
 morning:{name:'Утро',chip:['#d9c6e3','#efd9a2','#a9bfd6'],
  base:[[44,52,86],[268,24,76],[238,24,64]],
  water:[[250,30,72],[268,26,70],[205,30,72],[44,55,80],[182,22,66],[232,28,62],[290,18,74]],
  deep:[[240,26,50],[258,22,54],[200,26,48]],
  sky:[[46,72,86],[34,64,86],[280,32,86],[52,80,90]],
  refl:[[150,16,52],[200,20,56],[260,18,56]],
  leaf:[[95,30,56],[78,34,62],[140,22,48],[62,40,68],[110,26,46]],
  petal:[[345,62,80],[350,46,88],[332,42,74],[10,50,84]],white:[[40,45,95],[300,30,94]],center:[[46,88,64],[38,90,58]],
  willow:[[105,22,52],[82,28,60],[160,18,48],[52,38,68],[130,20,44]],
  light:[[44,94,76],[32,90,74],[52,96,82],[18,86,80]],fog:[262,26,88]},
 noon:{name:'Полдень',chip:['#3f7f8c','#7fae7a','#a9d3d8'],
  base:[[188,38,66],[196,42,46],[205,48,28]],
  water:[[195,46,46],[176,40,40],[210,40,52],[162,34,38],[222,34,60],[186,36,58],[200,30,34]],
  deep:[[205,50,24],[190,46,22],[220,40,30]],
  sky:[[194,44,80],[60,42,86],[180,30,84],[210,40,86]],
  refl:[[140,30,24],[160,30,20],[120,26,30]],
  leaf:[[108,36,42],[88,42,50],[140,34,30],[70,46,58],[120,30,36]],
  petal:[[345,66,78],[0,56,84],[332,46,70],[350,50,88]],white:[[50,30,96],[340,30,94]],center:[[48,92,60],[40,90,54]],
  willow:[[132,34,30],[100,34,40],[170,30,28],[80,40,52],[150,26,22]],
  light:[[46,95,72],[40,92,68],[52,96,80],[34,90,74]],fog:[190,26,84]},
 sunset:{name:'Закат',chip:['#e8935a','#8a5a9e','#e9c46a'],
  base:[[32,82,70],[340,40,56],[270,34,32]],
  water:[[275,34,46],[300,30,50],[20,70,62],[34,80,66],[252,30,40],[330,40,56],[12,60,56]],
  deep:[[265,36,28],[285,30,30],[240,30,26]],
  sky:[[32,92,72],[16,86,68],[46,92,78],[350,70,74]],
  refl:[[270,30,22],[250,26,26],[300,24,26]],
  leaf:[[80,30,42],[100,26,32],[42,46,46],[150,20,30],[60,34,38]],
  petal:[[345,72,74],[10,72,78],[330,52,68],[20,80,82]],white:[[36,72,90],[20,60,92]],center:[[44,96,60],[30,96,56]],
  willow:[[272,24,28],[100,22,30],[40,46,40],[300,20,30],[20,40,34]],
  light:[[36,100,70],[20,100,72],[50,100,80],[340,90,78]],fog:[24,44,80]},
 night:{name:'Ночь',chip:['#1d2d5c','#3b4f8a','#e8e0b8'],moon:true,
  base:[[222,42,32],[226,48,20],[232,56,11]],
  water:[[225,48,24],[214,44,30],[240,38,32],[200,40,26],[260,30,30],[210,48,38],[230,30,18]],
  deep:[[232,54,12],[220,50,14],[250,40,14]],
  sky:[[218,40,48],[200,36,52],[250,30,46]],
  refl:[[200,40,10],[220,40,8],[180,30,12]],
  leaf:[[150,28,26],[130,24,32],[172,30,20],[100,22,38],[190,24,28]],
  petal:[[340,40,72],[330,30,80],[0,30,86],[300,24,76]],white:[[220,30,90],[50,40,92]],center:[[48,70,66],[44,60,60]],
  willow:[[182,30,16],[160,24,24],[202,30,28],[140,20,20]],
  light:[[50,72,82],[46,60,90],[200,50,86],[55,80,88]],fog:[224,30,40]}
};
const PAL_KEYS=['morning','noon','sunset','night'];
let palKey=store.get('pal');if(!PAL[palKey])palKey='noon';
let P=PAL[palKey];

/* ---------- цвет ---------- */
function hsl2rgb(h,s,l){h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};
  return [f(0)*255,f(8)*255,f(4)*255]}
const rgbs=(r,g,b)=>'rgb('+(clamp(r,0,255)|0)+','+(clamp(g,0,255)|0)+','+(clamp(b,0,255)|0)+')';
const jit=(c,dh=7,ds=7,dl=6)=>[c[0]+R(-dh,dh),c[1]+R(-ds,ds),c[2]+R(-dl,dl)];
const sh=(c,dl,ds=0)=>[c[0],c[1]+ds,c[2]+dl];

/* ---------- карта красок на холсте (для смешения мазков), 1 ячейка = 3 px ---------- */
let mm=null,mw=0,mh=0,mixDirty=false;const MX=[0,0,0,0];
function mixInit(){mw=Math.ceil(W/3);mh=Math.ceil(H/3);mm=new Uint8ClampedArray(mw*mh*4);mixDirty=false}
function mixRebuild(){
  mixDirty=false;if(!mm)return;
  const c=document.createElement('canvas');c.width=mw;c.height=mh;const g=c.getContext('2d');
  g.drawImage(paint,0,0,mw,mh);const d=g.getImageData(0,0,mw,mh).data;
  for(let i=0;i<d.length;i+=4){
    const dr=Math.abs(d[i]-239)+Math.abs(d[i+1]-230)+Math.abs(d[i+2]-214);
    mm[i]=d[i];mm[i+1]=d[i+1];mm[i+2]=d[i+2];mm[i+3]=dr<36?0:255}
}
function mixAt(x,y){
  if(mixDirty)mixRebuild();
  const cx=(x/3)|0,cy=(y/3)|0;if(cx<0||cy<0||cx>=mw||cy>=mh)return null;
  const o=(cy*mw+cx)*4;if(mm[o+3]<24)return null;
  MX[0]=mm[o];MX[1]=mm[o+1];MX[2]=mm[o+2];MX[3]=mm[o+3]/255;return MX;
}
function mixWrite(x,y,l,co,si,t,rgb,al){
  const w=clamp(al*.65,.1,.9);const n=Math.max(1,Math.round(l*2/3));
  const q=t>3.5?[-t*.5,0,t*.5]:[0];
  for(let i=0;i<=n;i++){const s=-l+2*l*i/n;
    for(const qq of q){
      const px=x+co*s-si*qq,py=y+si*s+co*qq;const cx=(px/3)|0,cy=(py/3)|0;
      if(cx<0||cy<0||cx>=mw||cy>=mh)continue;
      const o=(cy*mw+cx)*4;
      if(mm[o+3]<24){mm[o]=rgb[0];mm[o+1]=rgb[1];mm[o+2]=rgb[2];mm[o+3]=255*w}
      else{mm[o]+=(rgb[0]-mm[o])*w;mm[o+1]+=(rgb[1]-mm[o+1])*w;mm[o+2]+=(rgb[2]-mm[o+2])*w;mm[o+3]=255-(255-mm[o+3])*(1-w)}
    }}
}

/* ---------- мазок: щетинки, густая краска, смешение ---------- */
function dab(x,y,L,T,a,c,al,streak){
  let rgb=hsl2rgb(c[0],c[1],c[2]);
  const co=Math.cos(a),si=Math.sin(a),l=L/2,t=T/2;
  let tail=null;
  if(mm){
    const m0=mixAt(x,y);if(m0){const k=.2*m0[3];rgb=[rgb[0]+(m0[0]-rgb[0])*k,rgb[1]+(m0[1]-rgb[1])*k,rgb[2]+(m0[2]-rgb[2])*k]}
    const m1=mixAt(x-co*l*.8,y-si*l*.8);if(m1)tail=[m1[0],m1[1],m1[2],m1[3]];
  }
  ctx.setTransform(DPR*co,DPR*si,-DPR*si,DPR*co,DPR*x,DPR*y);
  ctx.globalAlpha=al;ctx.fillStyle=rgbs(rgb[0],rgb[1],rgb[2]);
  const relief=streak!==false&&T>3.2;

    ctx.lineCap='round';

      if(dry)ctx.setLineDash([]);
    }
    ctx.lineWidth=Math.max(.6,T*.13);
    ctx.globalAlpha=al*.42;ctx.strokeStyle=rgbs(rgb[0]+26,rgb[1]+24,rgb[2]+20);
    ctx.beginPath();ctx.moveTo(-l*.7,-t*.5);ctx.lineTo(l*.78,-t*.62);ctx.stroke();

function glow(x,y,r,c,a,op){

function pad(x,y,r){
  const ry=r*R(.38,.48);
  const a0=Math.PI/2+R(-1.1,1.1),nw=R(.4,.52);
  const inNotch=(a,m)=>{const d=Math.abs(((a-a0)%(TAU)+Math.PI*3)%(TAU)-Math.PI);return d<nw+(m||0)};
  const k=K();
  for(let i=0;i<8;i++)dab(x+R(-.8,.8)*r,y+ry*R(.5,1.05),R(.35,.65)*r,R(.18,.28)*ry,R(-.05,.05),jit(pick(P.deep),5,5,4),R(.3,.5),false);
  const tint=Math.random()<.35,base=pick(P.leaf);
  ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.beginPath();
  ctx.ellipse(x,y,r*1.02,ry*1.02,0,a0+nw,a0-nw+TAU);
  ctx.lineTo(x+Math.cos(a0)*r*.04,y+Math.sin(a0)*ry*.04);ctx.closePath();ctx.clip();
  for(let i=0;i<Math.round(r*.9);i++){
    const yy=y+R(-1,1)*ry;dab(x+R(-1,1)*r,yy,R(.35,.6)*r,R(.25,.38)*ry,R(-.15,.15),jit(sh(base,-5),5,5,4),.95,false);
  }
  const rays=Math.round(16+r/2);
  for(let i=0;i<rays;i++){
    const a=i/rays*TAU+R(-.08,.08);
    const t1=R(.1,.3),t2=R(.8,1.05);
    const ang=Math.atan2(Math.sin(a)*ry,Math.cos(a)*r);
    const shade=-Math.sin(a)*.8-Math.cos(a)*.3;
    let c=jit(base,7,6,4);c[2]+=shade*11;
    const len=Math.hypot(Math.cos(a)*r,Math.sin(a)*ry)*(t2-t1);
    dab(x+Math.cos(a)*r*(t1+t2)/2,y+Math.sin(a)*ry*(t1+t2)/2,len,R(.17,.26)*ry,ang,c,R(.75,.92));
  }
  for(let i=0;i<9;i++){
    const a=i/9*TAU+R(-.1,.1);
    dab(x+Math.cos(a)*r*.5,y+Math.sin(a)*ry*.5,r*.7,Math.max(1,ry*.05),Math.atan2(Math.sin(a)*ry,Math.cos(a)*r),sh(base,-12),.35,false);
  }
  ctx.restore();ctx.setTransform(DPR,0,0,DPR,0,0);
  const rs=Math.round(TAU*r/(6*k));
  for(let i=0;i<rs;i++){
    const a=i/rs*TAU;
    if(inNotch(a,.12))continue;
    const top=Math.sin(a)<0;
    let c=top?jit(sh(base,14,4),6,6,4):jit(sh(base,-16,-4),6,6,4);
    if(tint&&!top&&Math.random()<.5)c=jit(pick(P.petal),6,6,-4);
    const tang=Math.atan2(Math.cos(a)*ry,-Math.sin(a)*r);
    dab(x+Math.cos(a)*r*.96,y+Math.sin(a)*ry*.96,R(.2,.3)*r,R(.08,.12)*ry*2,tang,c,R(.7,.9),false);
  }
  for(let t=.2;t<1.05;t+=.14){
    const w=Math.max(1.6,Math.hypot(Math.cos(a0)*r,Math.sin(a0)*ry)*Math.sin(nw)*t*1.1);
    dab(x+Math.cos(a0)*r*t,y+Math.sin(a0)*ry*t,w*1.5,Math.max(1.4,w*.55),R(-.08,.08),jit(sh(pick(P.deep),-4),4,4,3),.8,false);
  }
  for(const side of [-1,1]){const a=a0+side*nw;
    for(let t=.15;t<1;t+=.2)dab(x+Math.cos(a)*r*t,y+Math.sin(a)*ry*t,R(.12,.18)*r,Math.max(1,ry*.12),Math.atan2(Math.sin(a)*ry,Math.cos(a)*r),jit(sh(base,-20),4,4,3),.7,false)}
  for(let i=0;i<3;i++){
    const a=R(-2.6,-.6);
    dab(x+Math.cos(a)*r*R(.3,.7),y+Math.sin(a)*ry*R(.3,.7),R(.14,.24)*r,R(.1,.16)*ry,R(-.1,.1),jit(pick(P.sky),5,5,4),R(.3,.5),false);
  }
}

const PAPER='#efe6d6';
function blank(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);

function drawGrain(){
  const g=grain.getContext('2d');grain.width=paint.width;grain.height=paint.height;
  const T=256,tile=document.createElement('canvas');tile.width=tile.height=T;
  const tc=tile.getContext('2d'),id=tc.createImageData(T,T),d=id.data;
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const wx=(x%4<2)?1:0,wy=(y%4<2)?1:0;
    const weave=((wx^wy)?10:0)+((x%4===0)?6:0)+((y%4===0)?6:0);
    const v=255-weave-Math.random()*22-(Math.random()<.015?30:0);
    const i=(y*T+x)*4;d[i]=v;d[i+1]=v-2;d[i+2]=v-6;d[i+3]=255;
  }
  tc.putImageData(id,0,0);
  g.fillStyle=g.createPattern(tile,'repeat');g.fillRect(0,0,grain.width,grain.height);
  for(let i=0;i<14;i++){const x=Math.random()*grain.width,y=Math.random()*grain.height,r=R(.2,.5)*grain.width;
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(200,190,175,.12)');gr.addColorStop(1,'rgba(200,190,175,0)');g.fillStyle=gr;g.fillRect(0,0,grain.width,grain.height);}
}
function fit(force){
  const r=easel.getBoundingClientRect();
  const aw=Math.floor(r.width),ah=Math.floor(r.height-16);
  if(aw<20||ah<20)return;
  if(!force&&W&&document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(ar==null)ar=clamp(aw/ah,.62,1.3);
  let w=aw,h=w/ar;if(h>ah){h=ah;w=h*ar}
  w=Math.floor(w);h=Math.floor(h);
  if(!force&&w===W&&h===H)return;
  let old=null;
  if(W&&!force){old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;old.getContext('2d').drawImage(paint,0,0)}
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  W=w;H=h;
  frame.style.width=w+'px';frame.style.height=h+'px';
  for(const c of [paint,grain]){c.style.width=w+'px';c.style.height=h+'px'}
  paint.width=Math.round(w*DPR);paint.height=Math.round(h*DPR);
  mixInit();blank();
  if(old){ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(old,0,0,paint.width,paint.height);ctx.setTransform(DPR,0,0,DPR,0,0);mixDirty=true}
  drawGrain();
}
function drawFull(img){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.drawImage(img,0,0,paint.width,paint.height);ctx.setTransform(DPR,0,0,DPR,0,0);mixDirty=true;
}

/* ---------- отмена ---------- */
const undo=[];const MAXU=12;
function pushUndo(){
  const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;
  c.getContext('2d').drawImage(paint,0,0);undo.push({c,ar});
  if(undo.length>MAXU){const x=undo.shift();x.c.width=x.c.height=0}
  $('#bUndo').disabled=false;
}
function doUndo(){
  const e=undo.pop();if(!e)return;
  if(Math.abs(e.ar-ar)>.001){ar=e.ar;fit(true)}
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.drawImage(e.c,0,0,paint.width,paint.height);ctx.setTransform(DPR,0,0,DPR,0,0);mixDirty=true;
  e.c.width=e.c.height=0;$('#bUndo').disabled=!undo.length;scheduleSave();
  markTouched();
}

let stroke=null,busy=false,touched=store.get('current')!=null;
function pt(e){const r=paint.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function markTouched(){touched=true;$('#empty').classList.add('hide')}
paint.addEventListener('pointerdown',e=>{
  if(busy||stroke)return;e.preventDefault();
  try{paint.setPointerCapture(e.pointerId)}catch(_){}
  pushUndo();markTouched();
  const p=pt(e);stroke={id:e.pointerId,last:p,carry:0,dir:0};
  BR[brush].start(p,stroke);
});
paint.addEventListener('pointermove',e=>{
  if(!stroke||e.pointerId!==stroke.id)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e]))moveTo(pt(ev));
});
function moveTo(p){
  const b=BR[brush],sp=b.sp*K();
  let {last}=stroke;let dx=p.x-last.x,dy=p.y-last.y,d=Math.hypot(dx,dy);
  if(d<.5)return;
  stroke.dir=Math.atan2(dy,Math.abs(dx)+.001);
  let t=sp-stroke.carry;
  while(t<=d){const q={x:last.x+dx*t/d,y:last.y+dy*t/d};b.step(q,stroke);t+=sp}
  stroke.carry=d-(t-sp);stroke.last=p;
}
const endStroke=e=>{if(!stroke||e.pointerId!==stroke.id)return;stroke=null;scheduleSave()};
paint.addEventListener('pointerup',endStroke);paint.addEventListener('pointercancel',endStroke);

function snapshotURL(maxSide,q){
  const sc=Math.min(1,maxSide/Math.max(paint.width,paint.height));
  const c=document.createElement('canvas');c.width=Math.round(paint.width*sc);c.height=Math.round(paint.height*sc);

}

function makePond(){
  if(busy)return Promise.resolve();
  pushUndo();markTouched();busy=true;$('#busy').classList.add('on');
  const ops=[];const k=K();
  ops.push(()=>{
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const g=ctx.createLinearGradient(0,0,0,H);
    const b0=hsl2rgb(...P.base[0]),b1=hsl2rgb(...P.base[1]),b2=hsl2rgb(...P.base[2]);
    g.addColorStop(0,rgbs(...b0));g.addColorStop(.45,rgbs(...b1));g.addColorStop(1,rgbs(...b2));
    ctx.fillStyle=g;ctx.globalAlpha=1;ctx.fillRect(0,0,W,H);
    if(mm){mm.fill(0);mixDirty=true}
  });
  const big=Math.round(W*H/260);
  for(let i=0;i<big;i++)ops.push(()=>{const y=R(0,H);const s=persp(y);dab(R(-20,W+20),y,R(40,90)*s,R(10,20)*s,R(-.06,.06),jit(Math.random()<.5?pick(P.water):pick(P.deep),8,8,6),.28,false)});
  const cols=2+((Math.random()*3)|0);
  for(let c=0;c<cols;c++){
    const cx=R(.05,.95)*W,wd=R(.08,.18)*W,dark=Math.random()<.65;
    for(let i=0;i<Math.round(H*wd/120);i++)ops.push(()=>{const y=R(-10,H*R(.5,1));dab(cx+R(-wd,wd)*.5,y,R(18,40)*k,R(3,6)*k,Math.PI/2+R(-.1,.1),dark?jit(pick(P.refl)):jit(pick(P.sky),5,5,4),R(.25,.45),false)});
  }
  for(let c=0;c<3;c++){
    const cx=R(.1,.9)*W,cy=R(.05,.7)*H,rw=R(.15,.3)*W,rh=R(.04,.1)*H;
    for(let i=0;i<70;i++)ops.push(()=>{const y=cy+R(-rh,rh);const s=persp(y);dab(cx+R(-rw,rw),y,R(12,26)*s,R(3,5)*s,R(-.08,.08),jit(pick(P.sky),5,6,4),R(.5,.8))});
  }
  const n=Math.round(W*H/80);
  for(let i=0;i<n;i++)ops.push(()=>{const x=R(-10,W+10),y=R(-6,H+6);const s=persp(y);let r=Math.random(),c;
    if(r<.1)c=jit(pick(P.sky),5,6,5);else if(r<.22)c=jit(pick(P.deep));else c=jit(pick(P.water));
    dab(x,y,R(9,22)*s,R(3,5.2)*s,R(-.08,.08),c,R(.55,.85))});
  if(P.moon){
    const mx=R(.6,.75)*W,my=R(.12,.17)*H,mr=W*.07;
    ops.push(()=>glow(mx,my,mr*3.5,[48,70,80],.35,'screen'));
    for(let i=0;i<120;i++)ops.push(()=>{const a=R(0,TAU),rr=Math.sqrt(Math.random())*mr;dab(mx+Math.cos(a)*rr,my+Math.sin(a)*rr*.9,R(6,11)*k,R(2.4,3.6)*k,R(-.12,.12),jit([50,80,88],4,8,4),.95,false)});
    for(let i=0;i<18;i++)ops.push(()=>{const a=R(0,TAU);dab(mx+Math.cos(a)*mr*R(.95,1.2),my+Math.sin(a)*mr*.9*R(.95,1.2),R(5,9)*k,R(2,3)*k,R(-.1,.1),jit([48,60,74],4,6,4),.6,false)});
    for(let i=0;i<320;i++)ops.push(()=>{const t=Math.pow(Math.random(),1.3);const y=my+mr*1.1+t*H*.62;const wdt=mr*(.6+t*1.4);
      dab(mx+R(-1,1)*wdt*(Math.random()<.7?.5:1),y,R(8,20)*k*(1-t*.3),R(2.2,3.4)*k,R(-.05,.05),jit(t<.3?[50,85,84]:pick(P.light),5,6,4),R(.55,.95)*(1-t*.55),false)});
  }
  const clusters=[[R(.12,.4),R(.2,.3),3],[R(.55,.85),R(.44,.56),4],[R(.2,.5),R(.72,.86),5]];
  const pads=[];
  clusters.forEach(([cx,cy,m])=>{
    for(let i=0;i<m;i++){const y=cy*H+R(-.05,.05)*H;const x=cx*W+R(-.18,.18)*W*persp(y)/K();pads.push([x,y,R(13,28)*persp(y)])}
  });
  pads.sort((a,b)=>a[1]-b[1]).forEach(p=>ops.push(()=>pad(p[0],p[1],p[2])));
  const lx=R(.3,.7)*W;
  for(let i=0;i<40;i++)ops.push(()=>{lightDabs(lx+R(-.35,.35)*W,R(.1,.6)*H)});
  const fl=[];clusters.forEach((c,ci)=>{const own=pads.filter(p=>Math.abs(p[1]-c[1]*H)<H*.06);const pp=own.sort((a,b)=>b[2]-a[2])[0];if(pp&&(ci!==1||Math.random()<.7))fl.push(pp)});
  fl.forEach(p=>ops.push(()=>flower(p[0]+R(-.15,.15)*p[2],p[1]-p[2]*.08,p[2]*R(.85,1.05))));
  return new Promise(res=>{
    const fin=()=>{busy=false;$('#busy').classList.remove('on');scheduleSave();buzz(12);
      if(!RM){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}res()};
    if(RM||document.hidden){ops.forEach(f=>f());fin();return}
    let i=0;const per=Math.ceil(ops.length/44);
    (function tick(){const e=Math.min(ops.length,i+per);for(;i<e;i++)ops[i]();if(i<ops.length)requestAnimationFrame(tick);else fin()})();
  });
}

const SIGFONT='italic 500 %spx "Cormorant Garamond",Georgia,serif';
async function sign(name){
  name=(name||'').trim();if(!name)return;
  store.set('name',name);
  try{await document.fonts.load('italic 500 40px "Cormorant Garamond"','Аб')}catch(_){}
  pushUndo();markTouched();
  const fs=clamp(W*.088,24,52),text=name+' '+new Date().getFullYear();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.font=SIGFONT.replace('%s',fs);
  const tw=ctx.measureText(text).width;
  const x=W-tw-W*.05,y=H-H*.04;
  const sx=Math.max(0,Math.round(x*DPR)),sy=Math.max(0,Math.round((y-fs)*DPR));
  const d=ctx.getImageData(sx,sy,Math.max(1,Math.round(Math.min(tw,W-x)*DPR)),Math.max(1,Math.round(fs*1.1*DPR))).data;
  let L=0,n=0;for(let i=0;i<d.length;i+=16){L+=d[i]*.3+d[i+1]*.59+d[i+2]*.11;n++}L/=n;
  const ink=L>120?'#7a2a2e':'#f3e3cf',under=L>120?'rgba(255,240,225,.25)':'rgba(10,15,30,.35)';
  ctx.save();ctx.translate(x,y);ctx.rotate(-.04);ctx.textBaseline='alphabetic';
  ctx.fillStyle=under;ctx.fillText(text,1,1.5);
  ctx.fillStyle=ink;ctx.globalAlpha=.94;ctx.fillText(text,0,0);
  ctx.globalAlpha=.35;ctx.fillText(text,.6,-.3);
  ctx.restore();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;mixDirty=true;
  scheduleSave();toast('Подписано. Теперь это настоящая картина');buzz(10);
}

  const bg=m.chip||('conic-gradient('+PAL[palKey].chip[0]+' 0 40%,'+PAL[palKey].chip[1]+' 0 70%,'+PAL[palKey].chip[2]+' 0)');
  b.innerHTML='<i style="background:'+bg+'"></i><span>'+m.name+'</span>';
  b.onclick=()=>{mood=m.id;store.set('mood',m.id);syncUI();toast(m.id==='plain'?'Обычная кувшинка, в цвет картины':'Кувшинка «'+m.name.toLowerCase()+'»',1500);buzz(6)};mds.appendChild(b)});
const brs=$('#brushes');
Object.keys(BR).forEach(k=>{const b=document.createElement('button');b.className='z-tool';b.dataset.k=k;b.innerHTML=ICON[k]+'<span>'+BR[k].name+'</span>';
  b.onclick=()=>{brush=k;store.set('brush',k);syncUI();toast(BR[k].hint);buzz(6)};brs.appendChild(b)});
function syncUI(){
  mds.classList.toggle('on',brush==='lily');
  requestAnimationFrame(()=>{const d=document.querySelector('.dock');if(d)$('#toast').style.bottom='calc(var(--safe-b) + '+(d.offsetHeight+14)+'px)'});
  mds.querySelectorAll('.md').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.k===mood);
    if(b.dataset.k==='plain'){const c=PAL[palKey].chip;b.querySelector('i').style.background='conic-gradient('+c[0]+' 0 40%,'+c[1]+' 0 70%,'+c[2]+' 0)'}});
  pals.querySelectorAll('.pal').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===palKey));
  brs.querySelectorAll('.z-tool').forEach(b=>{const on=b.dataset.k===brush;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
}
$('#bUndo').onclick=doUndo;
$('#bMenu').onclick=()=>{const n=galIds().filter(id=>store.get('img_'+id)).length;$('#mGalSub').textContent=n?('Сохранено картин: '+n):'Здесь живут сохранённые картины';openSheet('#shMenu')};
$('#bPond').onclick=()=>makePond();
$('#mPond').onclick=()=>{closeSheet();makePond()};
$('#mSign').onclick=()=>{$('#nameIn').value=store.get('name')||'';openSheet('#shSign');setTimeout(()=>$('#nameIn').focus(),320)};
$('#sSignGo').onclick=()=>{const v=$('#nameIn').value;if(!v.trim()){$('#nameIn').focus();return}$('#nameIn').blur();closeSheet();sign(v)};
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#sSignGo').click()});
$('#mSave').onclick=()=>{if(saveToGallery()){closeSheet();toast('Картина в галерее');buzz(10)}};
$('#mShare').onclick=()=>{closeSheet();shareCanvas(composite())};
$('#mClear').onclick=()=>{pushUndo();blank();closeSheet();store.del('current');touched=false;$('#empty').classList.remove('hide');toast('Холст чист. Вернуть можно стрелкой сверху')};
$('#mGal').onclick=()=>{renderGallery();openSheet('#shGal')};
$('#vCont').onclick=async()=>{
  const u=store.get('img_'+viewId);if(!u)return;
  const im=await loadImage(u);pushUndo();
  const a=clamp(imgAr(im),.5,1.6);
  if(Math.abs(a-ar)>.02){ar=a;fit(true)}else blank();
  drawFull(im);markTouched();scheduleSave();closeSheet();
};
$('#vShare').onclick=async()=>{const im=await loadImage(store.get('img_'+viewId));const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);closeSheet();shareCanvas(c)};
$('#vDel').onclick=()=>{
  if(!delArm){delArm=1;$('#vDelT').textContent='Нажми ещё раз — картина исчезнет';setTimeout(()=>{if(delArm){delArm=0;$('#vDelT').textContent='Убрать из галереи'}},3500);return}
  store.del('img_'+viewId);setIds(galIds().filter(x=>x!==viewId));renderGallery();openSheet('#shGal');
};
if(!navigator.canShare)$('#mShareSub').textContent='Файл сохранится в загрузки';

/* ---------- запуск ---------- */
syncUI();
(async()=>{
  const cur=store.get('current');let im=null;
  if(cur){try{im=await loadImage(cur)}catch(_){im=null}}
  if(im)ar=clamp(imgAr(im),.5,1.6);
  fit(true);
  new ResizeObserver(()=>fit(false)).observe(easel);
  if(im){drawFull(im);$('#empty').classList.add('hide');touched=true}
  document.fonts&&document.fonts.load('italic 500 40px "Cormorant Garamond"','Аб').catch(()=>{});
  if(store.get('v2_seen')&&!store.get('v3_seen')){store.set('v3_seen','1');setTimeout(()=>toast('Новое: кувшинки настроения. Выбери кисть «Кувшинки»',4200),900)}
  if(!store.get('v2_seen')){store.set('v3_seen','1');
    store.set('v2_seen','1');
    const had=!!cur||galIds().length>0;
    setTimeout(()=>toast(had?'Ваши картины на месте. Кисти стали живее: краски смешиваются':'Веди пальцем по холсту — краски смешиваются сами',4200),900);
  }
})();
window.monet={moodFlower,setMood:k=>{mood=k;syncUI()},pad,flower,strand,waterDabs,lightDabs,fogDab,makePond,sign,doUndo,saveToGallery,galIds,composite,
  setBrush:k=>{brush=k;syncUI()},setPal:k=>{palKey=k;P=PAL[k];syncUI()},size:()=>({W,H,DPR,ar}),undoLen:()=>undo.length,blank,
  stroke:(pts)=>{const b=BR[brush];pushUndo();markTouched();stroke={id:-1,last:pts[0],carry:0,dir:0};b.start(pts[0],stroke);for(let i=1;i<pts.length;i++)moveTo(pts[i]);stroke=null;scheduleSave()}};
})();
</script>
</body>
</html>
