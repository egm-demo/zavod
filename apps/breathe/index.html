<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1a1c">
<title>Дыши с кувшинкой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#0e1a1c;--bg2:#13262a;--ink:#f6efe4;--muted:#a9bab3;--pink:#f0b6c4;--leaf:#7fae7a;--gold:#e9c46a;--line:rgba(246,239,228,.13);--card:rgba(246,239,228,.045)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:radial-gradient(120% 70% at 50% 38%,#163036 0%,#11232a 45%,var(--bg) 100%) fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{position:relative;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 4px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 20px);display:flex;flex-direction:column}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;font-size:14px;letter-spacing:.02em;align-self:flex-start}
.screen{display:flex;flex-direction:column;flex:1}
.screen[hidden]{display:none}
/* setup */
header.hd{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
header.hd svg{width:56px;height:56px;flex:none}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:36px;line-height:1;letter-spacing:.01em}
h1 i{color:var(--pink);font-style:italic}
.sub{color:var(--muted);font-size:15px;line-height:1.45;margin:8px 0 0}
.label{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:21px;color:var(--gold);margin:14px 0 6px 2px}
.modes{display:flex;flex-direction:column;gap:6px}
.mode{display:block;width:100%;text-align:left;padding:9px 14px 9px 42px;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative;min-height:56px;transition:border-color .25s,background .25s}
.mode::before{content:"";position:absolute;left:15px;top:13px;width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(246,239,228,.45)}
.mode[aria-checked=true]{border-color:rgba(240,182,196,.55);background:rgba(240,182,196,.07)}
.mode[aria-checked=true]::before{border-color:var(--pink);background:radial-gradient(circle,var(--pink) 0 4px,transparent 5px)}
.mname{font-size:18px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mpat{font-size:13px;font-weight:500;color:var(--gold);white-space:nowrap;letter-spacing:.04em}
.mnote{font-size:14px;line-height:1.35;color:var(--muted);margin-top:3px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:500}
.seg button[aria-checked=true]{border-color:rgba(240,182,196,.55);background:rgba(240,182,196,.1);color:var(--ink)}
.toggles{display:flex;gap:8px;margin-top:8px}
.tog{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:15px;text-align:left}
.sw{flex:none;width:40px;height:24px;border-radius:12px;background:rgba(246,239,228,.18);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .25s}
.tog[aria-checked=true] .sw{background:var(--leaf)}
.tog[aria-checked=true] .sw::after{transform:translateX(16px)}
.start{margin-top:14px;min-height:64px;width:100%;border-radius:32px;background:var(--pink);color:#2a1838;font-size:21px;font-weight:600;letter-spacing:.02em;box-shadow:0 10px 30px rgba(240,182,196,.18)}
.start:active{transform:scale(.985)}
.stats{text-align:center;color:var(--muted);font-size:13px;margin-top:10px;opacity:.85;min-height:18px}
.dock{position:sticky;bottom:0;margin:auto -20px 0;padding:0 20px calc(env(safe-area-inset-bottom) + 4px);background:linear-gradient(to bottom,rgba(14,26,28,0),var(--bg) 22px)}
.dock .start{margin-top:0}
.tog[aria-checked=false] .sw::after{background:#c9d3ce}
.mode::before{border-color:rgba(246,239,228,.6)}
.back{color:#c3d0ca}
/* session */
.sTop{text-align:center;color:#c3d0ca;font-size:15px;letter-spacing:.03em;min-height:20px}
.sTop b{font-weight:600;color:var(--ink)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#lily{width:min(94vw,50vh,460px);height:min(94vw,50vh,460px);display:block;overflow:visible}
.phase{text-align:center;padding-bottom:6px}
#pWord{font-family:'Cormorant Garamond',Georgia,serif;font-size:58px;font-weight:500;line-height:1.05;letter-spacing:.02em}
#pCount{font-size:44px;font-weight:500;color:var(--gold);margin-top:4px;font-variant-numeric:tabular-nums;min-height:50px}
#pHint{font-size:16px;color:#c3d0ca;margin-top:4px;min-height:21px}
.ctrl{display:flex;gap:8px;margin-top:16px}
.ctrl button{flex:1;min-height:52px;border-radius:26px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500}
.ctrl #stopBtn{color:var(--pink)}
/* end */
#end{align-items:center;text-align:center}
#end svg{width:150px;height:150px;margin-top:20px}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:46px;line-height:1.05;margin-top:10px}
#endSub{color:var(--muted);font-size:16px;line-height:1.5;margin-top:10px;max-width:24em}
.feel{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:26px}
.feel button{min-height:60px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:19px;font-weight:500}
.feel button[aria-pressed=true]{border-color:rgba(240,182,196,.6);background:rgba(240,182,196,.1)}
#after{width:100%;margin-top:18px}
#reply{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:22px;line-height:1.35;color:var(--ink);margin:4px 4px 18px}
.ghost{margin-top:10px;min-height:52px;width:100%;border-radius:26px;border:1px solid var(--line);font-size:17px;color:var(--muted)}
@media (min-height:900px){.label{margin-top:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
<a class="back" href="../../index.html">‹ все приложения</a>

<section id="setup" class="screen">
  <header class="hd">
    <svg id="miniLily" viewBox="0 0 400 400" aria-hidden="true"></svg>
    <h1>Дыши <i>с&nbsp;кувшинкой</i></h1>
  </header>
  <p class="sub">Цветок раскрывается — вдыхай. Закрывается — выдыхай. Больше ничего делать не нужно.</p>

  <div class="label" id="lblMode">Как дышим</div>
  <div class="modes" role="radiogroup" aria-labelledby="lblMode" id="modes"></div>

  <div class="label" id="lblDur">Сколько времени</div>
  <div class="seg" role="radiogroup" aria-labelledby="lblDur" id="durs">
    <button role="radio" data-min="1">1 мин</button>
    <button role="radio" data-min="3">3 мин</button>
    <button role="radio" data-min="5">5 мин</button>
  </div>

  <div class="toggles">
    <button class="tog" role="switch" id="sndTog" aria-checked="false"><span>Звук воды</span><span class="sw"></span></button>
    <button class="tog" role="switch" id="vibTog" aria-checked="false" hidden><span>Вибрация</span><span class="sw"></span></button>
  </div>

  <div class="dock"><button class="start" id="startBtn">Начать</button>
  <p class="stats" id="stats"></p></div>
</section>

<section id="session" class="screen" hidden>
  <div class="sTop"><b id="sMode"></b> · <span id="sLeft"></span></div>
  <div class="stage"><svg id="lily" viewBox="0 0 400 400" role="img" aria-label="Кувшинка"></svg></div>
  <div class="phase" aria-live="polite">
    <div id="pWord">приготовься</div>
    <div id="pCount">3</div>
    <div id="pHint">сядь удобно, плечи вниз</div>
  </div>
  <div class="ctrl">
    <button id="sndBtn">Звук: выкл</button>
    <button id="pauseBtn">Пауза</button>
    <button id="stopBtn">Закончить</button>
  </div>
</section>

<section id="end" class="screen" hidden>
  <svg id="endLily" viewBox="0 0 400 400" aria-hidden="true"></svg>
  <h2>Как сейчас?</h2>
  <p id="endSub"></p>
  <div class="feel" id="feel">
    <button data-feel="better" aria-pressed="false">Спокойнее</button>
    <button data-feel="same" aria-pressed="false">Так же</button>
    <button data-feel="worse" aria-pressed="false">Всё ещё неспокойно</button>
  </div>
  <div id="after" hidden>
    <p id="reply"></p>
    <button class="start" id="againBtn">Ещё раз</button>
    <button class="ghost" id="doneBtn">Готово</button>
  </div>
  <p class="stats" id="stats2"></p>
</section>
</div>

<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var KEY='kuv_breathe_';
var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- modes & phase engine ---------- */
var PH={
  'in':  {label:'вдох',     hint:'носом, спокойно'},
  'in2': {label:'ещё вдох', hint:'добери чуть-чуть воздуха'},
  'hold':{label:'задержка', hint:'не дыши, плечи мягкие'},
  'out': {label:'выдох',    hint:'медленно, через рот'},
  'rest':{label:'задержка', hint:'пауза, просто тишина'}
};
var MODES={
  calm:  {name:'Успокоиться', pat:'4 · 7 · 8', note:'Короткий вдох, долгая задержка и ещё более долгий выдох. Снимает тревогу.',
          phases:[{k:'in',d:4},{k:'hold',d:7},{k:'out',d:8}]},
  square:{name:'Квадрат', pat:'4 · 4 · 4 · 4', note:'Вдох, пауза, выдох, пауза — всё поровну. Выравнивает и собирает мысли.',
          phases:[{k:'in',d:4},{k:'hold',d:4},{k:'out',d:4},{k:'rest',d:4}]},
  sleep: {name:'Перед сном', pat:'4 · 6', note:'Выдох длиннее вдоха. Тело само замедляется, легче уснуть.',
          phases:[{k:'in',d:4},{k:'out',d:6}]},
  sigh:  {name:'Быстро собраться', pat:'2 вдоха · выдох', note:'Два вдоха подряд и длинный выдох. Помогает за минуту.',
          phases:[{k:'in',d:3,to:0.72},{k:'in2',d:1,from:0.72,to:1},{k:'out',d:6}]}
};
var PRE=3; // seconds of "приготовься"
// fill in openness from/to for each phase
Object.keys(MODES).forEach(function(id){
  var m=MODES[id],prev=0,len=0;
  m.phases.forEach(function(p){
    if(p.k==='in'){p.from=p.from!=null?p.from:0;p.to=p.to!=null?p.to:1;}
    else if(p.k==='in2'){}
    else if(p.k==='hold'){p.from=p.to=prev;}
    else if(p.k==='out'){p.from=prev;p.to=0;}
    else {p.from=p.to=0;}
    prev=p.to;len+=p.d;
  });
  m.cycle=len;
});
function plan(id,minutes){
  var m=MODES[id],cycles=Math.max(1,Math.round(minutes*60/m.cycle));
  return {cycles:cycles,total:cycles*m.cycle};
}
function ease(x){return 0.5-0.5*Math.cos(Math.PI*Math.max(0,Math.min(1,x)));}
function phaseAt(id,t){
  var m=MODES[id];
  if(t<0)return {k:'ready',idx:-1,cycle:-1,pt:PRE+t,dur:PRE,left:-t,open:0};
  var c=Math.floor(t/m.cycle),r=t-c*m.cycle,acc=0;
  for(var i=0;i<m.phases.length;i++){
    var p=m.phases[i];
    if(r<acc+p.d||i===m.phases.length-1){
      var pt=Math.min(r-acc,p.d),x=pt/p.d;
      return {k:p.k,idx:i,cycle:c,pt:pt,dur:p.d,left:p.d-pt,open:p.from+(p.to-p.from)*ease(x)};
    }
    acc+=p.d;
  }
}

/* ---------- storage ---------- */
function load(k,def){try{var v=localStorage.getItem(KEY+k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}
var settings=Object.assign({mode:'calm',min:3,sound:false,vib:false},load('settings',{}));
if(!MODES[settings.mode])settings.mode='calm';
if([1,3,5].indexOf(settings.min)<0)settings.min=3;
var history=load('history',[]);if(!Array.isArray(history))history=[];

function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function plural(n,a,b,c){var n10=n%10,n100=n%100;if(n10===1&&n100!==11)return a;if(n10>=2&&n10<=4&&(n100<12||n100>14))return b;return c;}
function streak(){
  var days={};history.forEach(function(h){days[h.day]=1;});
  var d=new Date(),n=0;
  if(!days[dayKey(d)])d.setDate(d.getDate()-1);
  while(days[dayKey(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function statsText(){
  if(!history.length)return '';
  var secs=history.reduce(function(s,h){return s+(h.sec||0);},0),mins=Math.max(1,Math.round(secs/60)),st=streak();
  var parts=[];
  if(st>0)parts.push(st+' '+plural(st,'день','дня','дней')+' подряд');
  parts.push('всего '+mins+' '+plural(mins,'минута','минуты','минут'));
  return parts.join(' · ');
}
function renderStats(){var t=statsText();$('stats').textContent=t;$('stats2').textContent=t;}

/* ---------- lily drawing ---------- */
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var a in attrs)e.setAttribute(a,attrs[a]);if(parent)parent.appendChild(e);return e;}
var lilyCount=0;
function makeLily(svg,opts){
  opts=opts||{};
  var id='l'+(lilyCount++);
  var defs=el('defs',{},svg);
  var g1=el('linearGradient',{id:id+'po',x1:'0',y1:'1',x2:'0',y2:'0'},defs);
  el('stop',{offset:'0','stop-color':'#f6efe4'},g1);el('stop',{offset:'.55','stop-color':'#f4d3d9'},g1);el('stop',{offset:'1','stop-color':'#e99fb2'},g1);
  var g2=el('linearGradient',{id:id+'pm',x1:'0',y1:'1',x2:'0',y2:'0'},defs);
  el('stop',{offset:'0','stop-color':'#fbf5ec'},g2);el('stop',{offset:'.6','stop-color':'#f6dde2'},g2);el('stop',{offset:'1','stop-color':'#f0b6c4'},g2);
  var g3=el('linearGradient',{id:id+'pi',x1:'0',y1:'1',x2:'0',y2:'0'},defs);
  el('stop',{offset:'0','stop-color':'#f3d58a'},g3);el('stop',{offset:'.35','stop-color':'#fbf3e6'},g3);el('stop',{offset:'1','stop-color':'#f7e2e6'},g3);
  var gl=el('radialGradient',{id:id+'gl'},defs);
  el('stop',{offset:'0','stop-color':'#f0b6c4','stop-opacity':'.38'},gl);el('stop',{offset:'.5','stop-color':'#f0b6c4','stop-opacity':'.1'},gl);el('stop',{offset:'1','stop-color':'#f0b6c4','stop-opacity':'0'},gl);
  var wg=el('radialGradient',{id:id+'w'},defs);
  el('stop',{offset:'0','stop-color':'#1d3d44','stop-opacity':'.9'},wg);el('stop',{offset:'1','stop-color':'#1d3d44','stop-opacity':'0'},wg);
  el('path',{id:id+'p',d:'M0 0C24 -24 22 -78 0 -100C-22 -78 -24 -24 0 0Z'},defs);

  if(!opts.mini)el('circle',{cx:200,cy:200,r:200,fill:'url(#'+id+'w)'},svg);
  // lily pads
  function pad(cx,cy,r,rot,fill){
    var gg=el('g',{transform:'translate('+cx+' '+cy+') rotate('+rot+')'},svg);
    var a=0.16;
    el('path',{d:'M0 0L'+(r*Math.cos(-Math.PI/2+a)).toFixed(1)+' '+(r*Math.sin(-Math.PI/2+a)).toFixed(1)+'A'+r+' '+r+' 0 1 1 '+(r*Math.cos(-Math.PI/2-a)).toFixed(1)+' '+(r*Math.sin(-Math.PI/2-a)).toFixed(1)+'Z',fill:fill},gg);
    for(var i=0;i<7;i++){var an=-Math.PI/2+0.6+i*0.86;el('line',{x1:0,y1:0,x2:(r*0.85*Math.cos(an)).toFixed(1),y2:(r*0.85*Math.sin(an)).toFixed(1),stroke:'rgba(14,26,28,.28)','stroke-width':1.2},gg);}
    return gg;
  }
  if(!opts.mini){pad(318,318,46,-30,'#4e7b55');pad(74,96,32,40,'#4a7451');pad(340,92,20,160,'#3f6847');}
  var ripples=el('g',{fill:'none'},svg);
  var big=pad(200,200,opts.mini?150:132,18,'#5f8f63');
  var glow=el('circle',{cx:200,cy:200,r:175,fill:'url(#'+id+'gl)',opacity:0},svg);
  var flower=el('g',{},svg);
  var layers=[
    {n:10,len:150,off:0,  grad:'po',min:.62,minW:.62,delay:0,  fan:.2},
    {n:9, len:118,off:18, grad:'pm',min:.74,minW:.6, delay:.1, fan:.15},
    {n:7, len:84, off:7,  grad:'pi',min:.85,minW:.6, delay:.2, fan:.1}
  ];
  layers.forEach(function(L){
    L.uses=[];
    var lg=el('g',{},flower);
    for(var i=0;i<L.n;i++){
      var u=el('use',{href:'#'+id+'p',fill:'url(#'+id+L.grad+')',stroke:'rgba(120,58,80,.28)','stroke-width':1},lg);
      L.uses.push(u);
    }
  });
  var center=el('circle',{cx:200,cy:200,r:14,fill:'#e9c46a'},flower);
  var dots=el('g',{fill:'#c9973c'},flower);
  for(var i=0;i<10;i++){var a2=i*Math.PI*2/10;el('circle',{cx:(200+Math.cos(a2)*7).toFixed(1),cy:(200+Math.sin(a2)*7).toFixed(1),r:1.8},dots);}
  var rings=[];
  function update(open,time){
    time=time||0;
    var sway=reduced?0:Math.sin(time*0.25)*3;
    flower.setAttribute('transform','rotate('+sway.toFixed(2)+' 200 200)');
    layers.forEach(function(L){
      var o=ease((open-L.delay)/(1-L.delay));
      var sy=(L.len/100)*(L.min+(1-L.min)*o);
      var sx=(L.len/150)*(L.minW+(1-L.minW)*o)*1.25;
      // closed: petals gather into an upright bud (narrow fan pointing up); open: full rosette
      var spread=L.fan+(1-L.fan)*o*o, base=L.off*o;
      for(var i=0;i<L.n;i++){
        var ang=base+(i-(L.n-1)/2)*(360/L.n)*spread;
        L.uses[i].setAttribute('transform','translate(200 200) rotate('+ang.toFixed(2)+') scale('+sx.toFixed(3)+' '+sy.toFixed(3)+')');
      }
    });
    var cr=3+15*open,co=ease((open-0.35)/0.65);
    flower.setAttribute('transform','rotate('+sway.toFixed(2)+' 200 200) translate(0 '+(38*(1-ease(open))).toFixed(1)+')');
    center.setAttribute('r',cr.toFixed(1));center.setAttribute('opacity',co.toFixed(3));dots.setAttribute('opacity',co.toFixed(3));
    dots.setAttribute('transform','translate(200 200) scale('+(cr/14).toFixed(3)+') translate(-200 -200)');
    glow.setAttribute('opacity',(0.25+0.75*open).toFixed(3));
    // ripples
    for(var j=rings.length-1;j>=0;j--){
      var R=rings[j],age=time-R.t0,life=5.5;
      if(age>life||age<0){R.el.remove();rings.splice(j,1);continue;}
      var k=age/life;
      R.el.setAttribute('r',(70+140*(1-Math.pow(1-k,2))).toFixed(1));
      R.el.setAttribute('stroke-opacity',(0.42*(1-k)*Math.min(1,age*3)).toFixed(3));
    }
  }
  function ripple(time){
    if(reduced)return;
    var c=el('circle',{cx:200,cy:200,r:70,stroke:'#cfe3dc','stroke-width':1.4,'stroke-opacity':0},ripples);
    rings.push({el:c,t0:time});
  }
  function clearRipples(){rings.forEach(function(R){R.el.remove();});rings=[];}
  return {update:update,ripple:ripple,clear:clearRipples,rings:rings};
}

/* ---------- audio ---------- */
var A=null;
function audioInit(){
  if(A)return A;
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  var ctx=new AC();
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.Q.value=0.6;
  var dg=ctx.createGain();dg.gain.value=0.05;lp.connect(dg);dg.connect(master);
  [[110,-5],[110,5],[164.81,-3],[220,4],[277.18,-6]].forEach(function(f,i){
    var o=ctx.createOscillator();o.type=i<3?'sawtooth':'triangle';o.frequency.value=f[0];o.detune.value=f[1];
    var g=ctx.createGain();g.gain.value=i<3?0.16:0.1;o.connect(g);g.connect(lp);o.start();
  });
  // brown noise for water
  var len=ctx.sampleRate*3,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}
  var ns=ctx.createBufferSource();ns.buffer=buf;ns.loop=true;
  var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=600;bp.Q.value=0.5;
  var ng=ctx.createGain();ng.gain.value=0.05;
  var lfo=ctx.createOscillator();lfo.frequency.value=0.13;var lfoG=ctx.createGain();lfoG.gain.value=200;lfo.connect(lfoG);lfoG.connect(bp.frequency);lfo.start();
  ns.connect(bp);bp.connect(ng);ng.connect(master);ns.start();
  A={ctx:ctx,master:master,lp:lp,dg:dg,ng:ng,on:false,lastSet:0};
  return A;
}
function audioOn(){
  var a=audioInit();if(!a)return;
  if(a.ctx.state==='suspended')a.ctx.resume();
  var t=a.ctx.currentTime;a.master.gain.cancelScheduledValues(t);a.master.gain.setTargetAtTime(0.55,t,0.8);a.on=true;
}
function audioOff(){
  if(!A||!A.on)return;
  var t=A.ctx.currentTime;A.master.gain.cancelScheduledValues(t);A.master.gain.setTargetAtTime(0,t,0.25);A.on=false;
  setTimeout(function(){if(A&&!A.on)A.ctx.suspend();},1200);
}
function audioFollow(open,k){
  if(!A||!A.on)return;
  var now=performance.now();if(now-A.lastSet<90)return;A.lastSet=now;
  var t=A.ctx.currentTime;
  A.lp.frequency.setTargetAtTime(300+750*open,t,0.25);
  A.dg.gain.setTargetAtTime(0.035+0.075*open,t,0.3);
  A.ng.gain.setTargetAtTime(k==='out'?0.09:0.045,t,0.6);
}

/* ---------- UI ---------- */
function $(id){return document.getElementById(id);}
var canVib='vibrate' in navigator;
if(canVib)$('vibTog').hidden=false;

var modesBox=$('modes');
Object.keys(MODES).forEach(function(id){
  var m=MODES[id],b=document.createElement('button');
  b.className='mode';b.setAttribute('role','radio');b.dataset.mode=id;
  b.innerHTML='<span class="mname"><span>'+m.name+'</span><span class="mpat">'+m.pat+'</span></span><span class="mnote">'+m.note+'</span>';
  b.addEventListener('click',function(){settings.mode=id;save('settings',settings);syncSetup();});
  modesBox.appendChild(b);
});
Array.prototype.forEach.call(document.querySelectorAll('#durs button'),function(b){
  b.addEventListener('click',function(){settings.min=+b.dataset.min;save('settings',settings);syncSetup();});
});
$('sndTog').addEventListener('click',function(){settings.sound=!settings.sound;save('settings',settings);syncSetup();});
$('vibTog').addEventListener('click',function(){settings.vib=!settings.vib;save('settings',settings);syncSetup();if(settings.vib)buzz([30]);});
function syncSetup(){
  Array.prototype.forEach.call(modesBox.children,function(b){b.setAttribute('aria-checked',String(b.dataset.mode===settings.mode));});
  Array.prototype.forEach.call(document.querySelectorAll('#durs button'),function(b){b.setAttribute('aria-checked',String(+b.dataset.min===settings.min));});
  $('sndTog').setAttribute('aria-checked',String(settings.sound));
  $('vibTog').setAttribute('aria-checked',String(settings.vib));
  $('sndBtn').textContent='Звук: '+(settings.sound?'вкл':'выкл');
}
function buzz(p){if(canVib&&settings.vib){try{navigator.vibrate(p);}catch(e){}}}
function show(id){['setup','session','end'].forEach(function(s){$(s).hidden=(s!==id);});window.scrollTo(0,0);}

var mini=makeLily($('miniLily'),{mini:true});mini.update(0.85,0);
var endL=makeLily($('endLily'),{mini:true});endL.update(1,0);
var lily=makeLily($('lily'));lily.update(0,0);

/* ---------- session state ---------- */
var S={running:false,paused:false,t:-PRE,wall:0,rate:1,mode:'calm',total:0,key:'',lastRipple:-99,raf:0,lastFrame:0,saved:null};
var wakeLock=null;
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function step(dt){
  // advance logical time by dt (seconds); returns current phase
  S.t+=dt*S.rate;S.wall+=dt;
  var ph=phaseAt(S.mode,Math.min(S.t,S.total-1e-6));
  var key=ph.k+':'+ph.cycle+':'+ph.idx;
  if(key!==S.key){
    S.key=key;S.trace&&S.trace.push({t:+S.t.toFixed(3),k:ph.k,cycle:ph.cycle});
    if(ph.k!=='ready'){
      buzz(ph.k==='out'?[60]:ph.k==='in'?[35]:ph.k==='in2'?[20,40,20]:[15]);
    }
    if(ph.k==='out'){lily.ripple(S.wall);S.lastRipple=S.wall;}
  }
  if(ph.k==='out'&&S.wall-S.lastRipple>1.6){lily.ripple(S.wall);S.lastRipple=S.wall;}
  return ph;
}
function render(ph){
  var amp=reduced?0.55:1;
  lily.update(ph.open*amp+(reduced?0.2:0),S.wall);
  if(ph.k==='ready'){
    $('pWord').textContent='приготовься';$('pHint').textContent='сядь удобно, плечи вниз';
  }else{
    $('pWord').textContent=PH[ph.k].label;$('pHint').textContent=PH[ph.k].hint;
  }
  $('pCount').textContent=String(Math.max(1,Math.ceil(ph.left-1e-6)));
  $('sLeft').textContent=S.paused?'пауза':('осталось '+fmt(S.total-Math.max(0,S.t)));
  audioFollow(ph.open,ph.k);
}
function frame(ts){
  if(!S.running)return;
  var dt=S.lastFrame?Math.min(0.25,(ts-S.lastFrame)/1000):0;S.lastFrame=ts;
  if(!S.paused){
    var ph=step(dt);render(ph);
    if(S.t>=S.total){finish(true);return;}
  }else{lily.update(phaseAt(S.mode,Math.max(-PRE,Math.min(S.t,S.total-1e-6))).open,S.wall);}
  S.raf=requestAnimationFrame(frame);
}
function start(){
  S.mode=settings.mode;var p=plan(S.mode,settings.min);S.total=p.total;
  S.t=-PRE;S.wall=0;S.key='';S.paused=false;S.running=true;S.lastFrame=0;S.saved=null;S.lastRipple=-99;
  lily.clear();
  $('sMode').textContent=MODES[S.mode].name;$('pauseBtn').textContent='Пауза';
  show('session');render(phaseAt(S.mode,-PRE));
  if(settings.sound)audioOn();
  if(navigator.wakeLock&&navigator.wakeLock.request){navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});}
  cancelAnimationFrame(S.raf);S.raf=requestAnimationFrame(frame);
}
function finish(){
  S.running=false;cancelAnimationFrame(S.raf);audioOff();
  if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}
  var sec=Math.round(Math.max(0,Math.min(S.t,S.total)));
  if(sec>=15){S.saved={day:dayKey(),ts:Date.now(),mode:S.mode,sec:sec,feel:null};history.push(S.saved);if(history.length>500)history=history.slice(-500);save('history',history);}
  var txt;
  if(sec<60)txt='Даже полминуты дыхания — уже пауза для себя.';
  else{var m=Math.round(sec/60);txt='Ты дышала '+m+' '+plural(m,'минуту','минуты','минут')+'. Прислушайся к себе.';}
  $('endSub').textContent=txt;
  Array.prototype.forEach.call(document.querySelectorAll('#feel button'),function(b){b.setAttribute('aria-pressed','false');});
  $('after').hidden=true;
  renderStats();show('end');
}
var REPLY={
  better:'Хорошо. Запомни это ощущение — к нему можно вернуться в любой момент.',
  same:'Так тоже бывает. Иногда тело успокаивается чуть позже, чем закончилось упражнение.',
  worse:'Ничего страшного. Попробуй ещё круг «Перед сном» — длинный выдох помогает лучше всего.'
};
Array.prototype.forEach.call(document.querySelectorAll('#feel button'),function(b){
  b.addEventListener('click',function(){
    Array.prototype.forEach.call(document.querySelectorAll('#feel button'),function(x){x.setAttribute('aria-pressed',String(x===b));});
    if(S.saved){S.saved.feel=b.dataset.feel;save('history',history);}
    $('reply').textContent=REPLY[b.dataset.feel];$('after').hidden=false;
  });
});
$('againBtn').addEventListener('click',start);
$('doneBtn').addEventListener('click',function(){renderStats();show('setup');});
$('startBtn').addEventListener('click',start);
$('stopBtn').addEventListener('click',function(){finish(false);});
$('pauseBtn').addEventListener('click',function(){
  S.paused=!S.paused;$('pauseBtn').textContent=S.paused?'Дальше':'Пауза';
  if(S.paused){$('pWord').textContent='пауза';$('pHint').textContent='нажми «Дальше», когда будешь готова';$('pCount').textContent='';$('sLeft').textContent='пауза';audioOff();}
  else if(settings.sound)audioOn();
});
$('sndBtn').addEventListener('click',function(){
  settings.sound=!settings.sound;save('settings',settings);syncSetup();
  if(settings.sound&&!S.paused)audioOn();else audioOff();
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S.running&&!S.paused){$('pauseBtn').click();}
});

syncSetup();renderStats();
(function idle(){ // gentle breathing of the mini lily on the start screen
  if(reduced)return;
  var t0=performance.now();
  (function loop(ts){if(!$('setup').hidden){var s=(ts-t0)/1000;mini.update(0.7+0.2*Math.sin(s*0.6),s);}requestAnimationFrame(loop);})(t0);
})();

window.BREATHE={MODES:MODES,PRE:PRE,plan:plan,phaseAt:phaseAt,state:S,step:step,render:render,start:start,finish:finish,
  setRate:function(r){S.rate=r;},statsText:statsText,streak:streak};
})();
</script>
</body>
</html>
