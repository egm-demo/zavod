<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1416">
<title>Дыши с кувшинкой</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/ui.css">
<style>
html,body{background:#081a1d}
body{background:radial-gradient(120% 64% at 50% 42%,#18383c 0%,#0f272b 46%,#09171a 100%) fixed}
#pond{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(90% 70% at 50% 46%,rgba(4,12,14,0) 40%,rgba(3,9,11,.62) 100%)}
.z-app{z-index:2}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none}
.stage{flex:1;min-height:150px}
.head{padding:0 2px}
.head .z-lead{min-height:46px;margin-top:8px}
.panel{padding-top:6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{min-height:58px;padding:10px 14px;border-radius:var(--r);background:var(--surface-2,rgba(243,236,224,.09));box-shadow:inset 0 0 0 1px rgba(243,236,224,.1);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:6px;
  transition:background .25s,transform .15s var(--ease),box-shadow .25s}
.mode:active{transform:scale(.97)}
.mode b{font:600 15px/1.1 var(--text);color:var(--ink)}
.mode span{font:500 12px/1 var(--text);letter-spacing:.06em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mode[aria-checked=true]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(239,179,193,.38)}
.mode[aria-checked=true] span{color:var(--accent)}
.note{margin:12px 2px;min-height:44px;color:var(--ink-2);font-size:14px;line-height:1.5;text-wrap:pretty}
.panel .z-btn{margin-top:12px;min-height:56px;font-size:17px}
.z-top .z-title{font-variant-numeric:tabular-nums}
.z-icon .off{display:none}
.z-icon.muted .on{display:none}.z-icon.muted .off{display:inline}
.phase{text-align:center;padding:4px 0 2px}
.phase .z-cap{display:block;min-height:12px;color:var(--ink-2)}
#pWord{font:400 56px/1.05 var(--display);letter-spacing:.01em;margin-top:8px;min-height:59px}
#pWord.swap{animation:swap .6s var(--ease) both}
@keyframes swap{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
#pCount{font:400 46px/1 var(--display);font-variant-numeric:tabular-nums;margin-top:8px;min-height:40px}
#pHint{font-size:15px;color:var(--ink-2);margin-top:8px;min-height:22px}
.endtxt{text-align:center;padding:0 4px}
#endSub{color:var(--ink-2);font-size:15px;line-height:1.5;margin:0 auto;max-width:24em;text-wrap:balance}
.endtxt .z-h2{margin:10px 0 0;font-size:34px}
.feel{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.feel[hidden],.endtxt [hidden],#after[hidden]{display:none}
.feel button{min-height:54px;border-radius:var(--r);background:var(--surface);font:500 17px/1 var(--text);transition:background .2s,transform .15s var(--ease)}
.feel button:active{transform:scale(.98);background:var(--surface-2)}
#after{margin-top:8px}
#reply{font:italic 400 24px/1.3 var(--display);margin:6px 6px 18px;text-wrap:balance;text-align:center}
.fine{text-align:center;color:var(--ink-2);font-size:13px;margin:10px 0 0;min-height:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.kpi{text-align:center;padding:14px 4px;border-radius:var(--r);background:var(--surface)}
.kpi b{display:block;font:400 34px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi .z-cap{display:block;margin-top:8px;letter-spacing:.08em}
.pondline{color:var(--ink-2);font-size:14px;line-height:1.5;margin:12px 2px 10px;text-wrap:pretty}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;text-align:left;font-size:16px}
.row[hidden]{display:none}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:rgba(243,236,224,.18);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#c9d3ce;transition:transform .25s var(--ease),background .25s}
.row[aria-checked=true] .sw{background:var(--leaf-2)}
.row[aria-checked=true] .sw::after{transform:translateX(18px);background:var(--ink)}
.sheet-cap{margin:22px 2px 6px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.hist li:last-child{border-bottom:1px solid var(--line)}
.hist li span:last-child{color:var(--ink);text-align:right}
.how{color:var(--ink-2);font-size:14px;line-height:1.55;margin:18px 2px 0;text-wrap:pretty}
.z-toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-14px);white-space:normal;text-align:center;max-width:calc(100% - 40px);width:max-content;line-height:1.4;border-radius:20px}
@media (max-height:700px){.z-h1{font-size:36px;margin-top:6px}.head .z-lead{display:none}.note{min-height:0;margin:8px 2px}#pWord{font-size:46px;min-height:48px}.mode{min-height:52px}}
</style>

</head>
<body>
<canvas id="pond" aria-hidden="true"></canvas>
<div class="vig" aria-hidden="true"></div>

<div class="z-app" id="app">
  <header class="z-top">
    <a class="z-icon" href="../../index.html" aria-label="Все приложения"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="z-title" id="topTitle"></div>
    <button class="z-icon" id="sndIcon" aria-label="Звук воды" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><g class="on"><path d="M15.5 9a4 4 0 010 6"/><path d="M18.2 6.5a8 8 0 010 11"/></g><g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
    <button class="z-icon" id="menuBtn" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h9"/></svg></button>
  </header>

  <section id="vSetup" class="view">
    <div class="head z-in">
      <h1 class="z-h1">Дыши <i>с&nbsp;кувшинкой</i></h1>
      <p class="z-lead" id="lead"></p>
    </div>
    <div class="stage"></div>
    <div class="panel z-in" style="animation-delay:.12s">
      <div class="modes" id="modes" role="radiogroup" aria-label="Как дышим"></div>
      <p class="note" id="modeNote"></p>
      <div class="z-seg" id="durs" role="radiogroup" aria-label="Сколько времени">
        <button role="radio" data-min="1">1 мин</button>
        <button role="radio" data-min="3">3 мин</button>
        <button role="radio" data-min="5">5 мин</button>
      </div>
      <button class="z-btn wide" id="startBtn">Начать</button>
    </div>
  </section>

  <section id="vSession" class="view" hidden>
    <div class="stage"></div>
    <div class="phase">
      <span class="z-cap" id="sMode"></span>
      <div id="pWord" aria-live="polite">приготовься</div>
      <div id="pCount" aria-hidden="true">3</div>
      <div id="pHint">сядь удобно, плечи вниз</div>
    </div>
    <div class="z-bar">
      <button class="z-tool" id="pauseBtn"><svg viewBox="0 0 24 24"><g id="icPause"><path d="M9 6v12M15 6v12"/></g><path id="icPlay" d="M9 6l9 6-9 6z" style="display:none"/></svg><span id="pauseLbl">Пауза</span></button>
      <button class="z-tool" id="stopBtn"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Закончить</span></button>
    </div>
  </section>

  <section id="vEnd" class="view" hidden>
    <div class="stage"></div>
    <div class="endtxt">
      <p id="endSub"></p>
      <h2 class="z-h2" id="endH">Как <i>сейчас</i>?</h2>
    </div>
    <div class="feel" id="feel">
      <button data-feel="better">Спокойнее</button>
      <button data-feel="same">Так же</button>
      <button data-feel="worse">Всё ещё неспокойно</button>
    </div>
    <div id="after" hidden>
      <p id="reply"></p>
      <button class="z-btn wide" id="againBtn">Ещё раз</button>
      <button class="z-btn quiet wide" id="doneBtn">Готово</button>
    </div>
    <p class="fine" id="stats2"></p>
  </section>
</div>

<div class="z-scrim" id="scrim"></div>
<aside class="z-sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Твоё дыхание" tabindex="-1">
  <h2 class="z-h2">Твоё <i>дыхание</i></h2>
  <div class="kpis">
    <div class="kpi"><b id="kStreak">0</b><span class="z-cap" id="kStreakL">дней подряд</span></div>
    <div class="kpi"><b id="kMin">0</b><span class="z-cap" id="kMinL">минут</span></div>
    <div class="kpi"><b id="kCnt">0</b><span class="z-cap" id="kCntL">раз</span></div>
  </div>
  <p class="pondline" id="pondLine"></p>
  <div class="z-list">
    <button class="row" role="switch" id="sndTog" aria-checked="false"><span>Звук воды</span><span class="sw"></span></button>
    <button class="row" role="switch" id="vibTog" aria-checked="false" hidden><span>Вибрация</span><span class="sw"></span></button>
  </div>
  <div class="z-cap sheet-cap">Последние разы</div>
  <ul class="hist" id="hist"></ul>
  <p class="how">Цветок раскрывается — вдыхай, закрывается — выдыхай. Выдох чуть длиннее вдоха: так тело успокаивается быстрее всего. Коснись воды — по ней пойдёт рябь.</p>
</aside>
<div class="z-toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var KEY='kuv_breathe_';
var reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function $(id){return document.getElementById(id);}

/* ---------- режимы и движок фаз (механика v1 без изменений) ---------- */
var PH={
  'in':  {label:'вдох',     hint:'носом, спокойно'},
  'in2': {label:'ещё вдох', hint:'добери чуть-чуть воздуха'},
  'hold':{label:'задержка', hint:'не дыши, плечи мягкие'},
  'out': {label:'выдох',    hint:'медленно, через рот'},
  'rest':{label:'задержка', hint:'пауза, просто тишина'}
};
var MODES={
  calm:  {name:'Успокоиться', pat:'4 · 7 · 8', note:'Короткий вдох, долгая задержка и ещё более долгий выдох. Снимает тревогу.',
          phases:[{k:'in',d:4},{k:'hold',d:7},{k:'out',d:8}]},
  square:{name:'Квадрат', pat:'4 · 4 · 4 · 4', note:'Вдох, пауза, выдох, пауза — всё поровну. Выравнивает и собирает мысли.',
          phases:[{k:'in',d:4},{k:'hold',d:4},{k:'out',d:4},{k:'rest',d:4}]},
  sleep: {name:'Перед сном', pat:'4 · 6', note:'Выдох длиннее вдоха. Тело само замедляется, легче уснуть.',
          phases:[{k:'in',d:4},{k:'out',d:6}]},
  sigh:  {name:'Быстро собраться', pat:'2 вдоха · выдох', note:'Два вдоха подряд и длинный выдох. Помогает за минуту.',
          phases:[{k:'in',d:3,to:0.72},{k:'in2',d:1,from:0.72,to:1},{k:'out',d:6}]}
};
var PRE=3;
Object.keys(MODES).forEach(function(id){
  var m=MODES[id],prev=0,len=0;
  m.phases.forEach(function(p){
    if(p.k==='in'){p.from=p.from!=null?p.from:0;p.to=p.to!=null?p.to:1;}
    else if(p.k==='in2'){}
    else if(p.k==='hold'){p.from=p.to=prev;}
    else if(p.k==='out'){p.from=prev;p.to=0;}
    else {p.from=p.to=0;}
    prev=p.to;len+=p.d;
  });
  m.cycle=len;
});
function plan(id,minutes){var m=MODES[id],cycles=Math.max(1,Math.round(minutes*60/m.cycle));return {cycles:cycles,total:cycles*m.cycle};}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function ease(x){return 0.5-0.5*Math.cos(Math.PI*clamp(x,0,1));}
function phaseAt(id,t){
  var m=MODES[id];
  if(t<0)return {k:'ready',idx:-1,cycle:-1,pt:PRE+t,dur:PRE,left:-t,open:0};
  var c=Math.floor(t/m.cycle),r=t-c*m.cycle,acc=0;
  for(var i=0;i<m.phases.length;i++){
    var p=m.phases[i];
    if(r<acc+p.d||i===m.phases.length-1){
      var pt=Math.min(r-acc,p.d),x=pt/p.d;
      return {k:p.k,idx:i,cycle:c,pt:pt,dur:p.d,left:p.d-pt,open:p.from+(p.to-p.from)*ease(x)};
    }
    acc+=p.d;
  }
}

/* ---------- хранилище: те же ключи и формат, что в v1 ---------- */
function load(k,def){try{var v=localStorage.getItem(KEY+k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}
var stored=load('settings',{});if(!stored||typeof stored!=='object'||Array.isArray(stored))stored={};
var settings=Object.assign({mode:'calm',min:3,sound:false,vib:false},stored);
if(!MODES[settings.mode])settings.mode='calm';
if([1,3,5].indexOf(settings.min)<0)settings.min=3;
settings.sound=!!settings.sound;settings.vib=!!settings.vib;
var history=load('history',[]);if(!Array.isArray(history))history=[];
history=history.filter(function(h){return h&&typeof h==='object';});

function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function plural(n,a,b,c){var n10=n%10,n100=n%100;if(n10===1&&n100!==11)return a;if(n10>=2&&n10<=4&&(n100<12||n100>14))return b;return c;}
function streak(){
  var days={};history.forEach(function(h){if(h.day)days[h.day]=1;});
  var d=new Date(),n=0;
  if(!days[dayKey(d)])d.setDate(d.getDate()-1);
  while(days[dayKey(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function daysCount(){var d={};history.forEach(function(h){if(h.day)d[h.day]=1;});return Object.keys(d).length;}
function totalMin(){var secs=history.reduce(function(s,h){return s+(+h.sec||0);},0);return history.length?Math.max(1,Math.round(secs/60)):0;}
function statsText(){
  if(!history.length)return '';
  var mins=totalMin(),st=streak(),parts=[];
  if(st>0)parts.push(st+' '+plural(st,'день','дня','дней')+' подряд');
  parts.push('всего '+mins+' '+plural(mins,'минута','минуты','минут'));
  return parts.join(' · ');
}
function renderStats(){
  var t=statsText();
  $('lead').textContent=t||'Цветок раскрывается — вдыхай. Закрывается — выдыхай. Больше ничего делать не нужно.';
  $('stats2').textContent=t;
}

/* ---------- сцена: пруд на canvas ---------- */
var cv=$('pond'),g=cv.getContext('2d');
var W=0,H=0,D=1,Q=1,SQ=0.56,CH=0.83;
var clock=0,vis=0.6,sceneMode='idle',flash=0,bloomAll=0;
var cam={x:0,y:0,S:96,tx:0,ty:0,tS:96,init:false,sy0:0,sh:400};
var SPR=null,GLOW={},CAUS=null,PADS=[],NFL=0,newFl=-1,newFlT=0;
var ripples=[],parts=[],FF=[],SP=[];
function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(2,Math.ceil(w));c.height=Math.max(2,Math.ceil(h));return c;}
function rnd(a){a=(a*9301+49297)%233280;return a/233280;}

var LAY=[
 {n:10,len:1.00,off:0, t0:76,t1:11,delay:0,  col:['#f4e6d8','#f4cdd7','#e48aa6'],wf:1.00},
 {n:9, len:.80, off:20,t0:82,t1:25,delay:.1, col:['#faf0e4','#f7d9e0','#ee9fb6'],wf:.98},
 {n:7, len:.56, off:8, t0:88,t1:47,delay:.2, col:['#f2cf78','#faeedb','#f6d8df'],wf:.94}
];
var JL=[],JT=[];
LAY.forEach(function(L,li){JL[li]=[];JT[li]=[];for(var i=0;i<L.n;i++){JL[li][i]=0.93+rnd(li*31+i*7+3)*.12;JT[li][i]=(rnd(li*17+i*13+5)-.5)*8;}});

function petalPath(c,L,w){c.beginPath();c.moveTo(0,0);c.bezierCurveTo(w*.95,-L*.14,w*1.12,-L*.6,0,-L);c.bezierCurveTo(-w*1.12,-L*.6,-w*.95,-L*.14,0,0);c.closePath();}
function petalSprite(L,cols,shadow){
  var w=L*.26,m=shadow?Math.ceil(L*.09):2,c=mk(L*.6+2*m,L+2*m),x=c.getContext('2d');
  x.translate(c.width/2,c.height-m);
  var out={c:c,ox:c.width/2,oy:c.height-m,L:L};
  if(shadow){
    if('filter' in x)x.filter='blur('+(L*.028).toFixed(1)+'px)';
    petalPath(x,L,w);x.fillStyle='rgba(60,14,40,.8)';x.fill();
    return out;
  }
  petalPath(x,L,w);
  var gr=x.createLinearGradient(0,0,0,-L);gr.addColorStop(0,cols[0]);gr.addColorStop(.5,cols[1]);gr.addColorStop(1,cols[2]);
  x.fillStyle=gr;x.fill();
  x.save();x.clip();
  var gl=x.createLinearGradient(-w*.85,0,w*.85,0);
  gl.addColorStop(0,'rgba(130,40,80,.26)');gl.addColorStop(.3,'rgba(255,255,255,0)');gl.addColorStop(.62,'rgba(255,255,255,.12)');gl.addColorStop(1,'rgba(130,40,80,.3)');
  x.fillStyle=gl;x.fillRect(-w*1.2,-L,w*2.4,L);
  var gb=x.createLinearGradient(0,0,0,-L*.42);gb.addColorStop(0,'rgba(120,56,56,.45)');gb.addColorStop(1,'rgba(120,56,56,0)');
  x.fillStyle=gb;x.fillRect(-w*1.2,-L*.42,w*2.4,L*.42);
  x.lineWidth=Math.max(.6,L*.005);x.strokeStyle='rgba(160,60,96,.22)';
  for(var k=-3;k<=3;k++){x.beginPath();x.moveTo(0,-L*.04);x.quadraticCurveTo(k*w*.3,-L*.5,k*w*.11,-L*.93);x.stroke();}
  x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=Math.max(1,L*.012);x.beginPath();x.moveTo(0,-L*.08);x.lineTo(0,-L*.8);x.stroke();
  x.restore();
  petalPath(x,L,w);x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=Math.max(.8,L*.006);x.stroke();
  return out;
}
function padSprite(r,tone){
  var m=2,c=mk(2*(r+m),2*(r+m)),x=c.getContext('2d'),o=r+m,a0=.2;
  function path(){x.beginPath();x.moveTo(o,o);x.arc(o,o,r,a0-.1,Math.PI*2-a0-.1);x.closePath();}
  path();
  var gr=x.createRadialGradient(o,o,0,o,o,r);
  gr.addColorStop(0,tone[0]);gr.addColorStop(.62,tone[1]);gr.addColorStop(1,tone[2]);
  x.fillStyle=gr;x.fill();
  x.save();x.clip();x.translate(o,o);
  x.lineWidth=Math.max(.7,r*.012);
  for(var i=0;i<16;i++){
    var an=a0+.15+i*(Math.PI*2-2*a0-.1)/16;
    x.strokeStyle='rgba(10,40,28,.34)';x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(Math.cos(an+.12)*r*.5,Math.sin(an+.12)*r*.5,Math.cos(an)*r*.98,Math.sin(an)*r*.98);x.stroke();
    x.strokeStyle='rgba(200,235,170,.12)';x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(Math.cos(an+.1)*r*.5,Math.sin(an+.1)*r*.5+r*.01,Math.cos(an-.03)*r*.98,Math.sin(an-.03)*r*.98);x.stroke();
  }
  for(var j=0;j<4;j++){

function pondText(){
  var n=daysCount();
  if(!n)return 'Пока в пруду только листья. Первый цветок распустится после первого дыхания.';
  var c=Math.min(n,SLOTS.length);
  return 'В пруду '+c+' '+plural(c,'цветок','цветка','цветков')+' — по одному на каждый день, когда ты дышала'+(n>SLOTS.length?' (всего таких дней: '+n+')':'')+'.';
}
function renderSheet(){
  var st=streak(),mins=totalMin(),cnt=history.length;
  $('kStreak').textContent=st;$('kStreakL').textContent=plural(st,'день подряд','дня подряд','дней подряд');
  $('kMin').textContent=mins;$('kMinL').textContent=plural(mins,'минута','минуты','минут');
  $('kCnt').textContent=cnt;$('kCntL').textContent=plural(cnt,'раз','раза','раз');
  $('pondLine').textContent=pondText();
  var ul=$('hist');ul.textContent='';
  var last=history.slice(-5).reverse();
  if(!last.length){var li0=document.createElement('li');li0.style.border='0';li0.textContent='Здесь появятся твои занятия.';ul.appendChild(li0);}
  last.forEach(function(h){
    var li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');
    var m=MODES[h.mode];a.textContent=fmtDay(h.day)+' · '+(m?m.name:'дыхание');
    var mm=Math.max(1,Math.round((+h.sec||0)/60));b.textContent=mm+' мин'+(HIST_FEEL[h.feel]?' · '+HIST_FEEL[h.feel]:'');
    li.appendChild(a);li.appendChild(b);ul.appendChild(li);
  });
}
function openSheet(){renderSheet();$('scrim').classList.add('on');$('sheet').classList.add('on');$('sheet').focus({preventScroll:true});}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on');}
$('menuBtn').addEventListener('click',openSheet);
$('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
var sy0=0;
$('sheet').addEventListener('touchstart',function(e){sy0=e.touches[0].clientY;},{passive:true});
$('sheet').addEventListener('touchend',function(e){if(e.changedTouches[0].clientY-sy0>90&&$('sheet').scrollTop<=0)closeSheet();},{passive:true});

/* ---------- сессия ---------- */
var S={running:false,paused:false,t:-PRE,wall:0,rate:1,mode:'calm',total:0,key:'',lastRipple:-99,saved:null};
var wakeLock=null,lastWord='';
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function step(dt){
  S.t+=dt*S.rate;S.wall+=dt;
  var ph=phaseAt(S.mode,Math.min(S.t,S.total-1e-6));
  var key=ph.k+':'+ph.cycle+':'+ph.idx;
  if(key!==S.key){
    S.key=key;
    if(ph.k!=='ready'){
      buzz(ph.k==='out'?[60]:ph.k==='in'?[35]:ph.k==='in2'?[20,40,20]:[15]);
      if(ph.k==='out'){ripple(cam.x,cam.y+cam.S*.5,cam.S*2.1);S.lastRipple=S.wall;drop(520);}
      if(ph.k==='in'&&ph.cycle>0)drop(760);
    }
  }
  if(ph.k==='out'&&S.wall-S.lastRipple>1.8){ripple(cam.x,cam.y+cam.S*.5,cam.S*(1.5+Math.random()*.8));S.lastRipple=S.wall;}
  return ph;
}
function render(ph){
  var amp=reduced?0.55:1;
  vis=ph.open*amp+(reduced?0.2:0);
  var label=ph.k==='ready'?'приготовься':PH[ph.k].label,hint=ph.k==='ready'?'сядь удобно, плечи вниз':PH[ph.k].hint;
  var w=$('pWord');
  if(label!==lastWord){lastWord=label;w.textContent=label;if(!reduced){w.classList.remove('swap');void w.offsetWidth;w.classList.add('swap');}}
  $('pHint').textContent=hint;
  $('pCount').textContent=String(Math.max(1,Math.ceil(ph.left-1e-6)));
  $('topTitle').textContent=S.paused?'пауза':fmt(S.total-Math.max(0,S.t));
  audioFollow(ph.open,ph.k);
}
function start(){
  closeSheet();
  S.mode=settings.mode;var p=plan(S.mode,settings.min);S.total=p.total;
  S.t=-PRE;S.wall=0;S.key='';S.paused=false;S.running=true;S.saved=null;S.lastRipple=-99;lastWord='';
  ripples.length=0;parts.length=0;flash=0;bloomAll=0;newFl=-1;
  $('sMode').textContent=MODES[S.mode].name+' · '+MODES[S.mode].pat;setPauseUi();
  show('vSession');render(phaseAt(S.mode,-PRE));
  buzz([8]);
  if(settings.sound)audioOn();
  if(navigator.wakeLock&&navigator.wakeLock.request){navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});}
}
function finish(){
  var was=S.running;
  S.running=false;audioOff();
  if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}
  var sec=Math.round(Math.max(0,Math.min(S.t,S.total)));
  var before=daysCount();
  if(sec>=15){S.saved={day:dayKey(),ts:Date.now(),mode:S.mode,sec:sec,feel:null};history.push(S.saved);if(history.length>500)history=history.slice(-500);save('history',history);}
  var after=daysCount();
  setFlowers();
  var txt;
  if(sec<60)txt='Даже короткая пауза — уже забота о себе.';
  else{var m=Math.round(sec/60);txt='Ты дышала '+m+' '+plural(m,'минуту','минуты','минут')+'. Прислушайся к себе.';}
  newFl=-1;
  if(after>before&&after<=SLOTS.length){newFl=after-1;newFlT=0;txt+=' В пруду распустился новый цветок.';}
  $('endSub').textContent=txt;
  $('after').hidden=true;$('feel').hidden=false;$('endH').hidden=false;
  renderStats();show('vEnd');
  vis=Math.max(vis,.7);bloomAll=1;flash=1;
  if(sec>=15||was){burst(cam.x,cam.y-cam.S*.2,46);ripple(cam.x,cam.y+cam.S*.5,cam.S*2.6);drop(880);buzz([20,50,20]);}
}
var REPLY={
  better:'Хорошо. Запомни это ощущение — к нему можно вернуться в любой момент.',
  same:'Так тоже бывает. Иногда тело успокаивается чуть позже, чем закончилось упражнение.',
  worse:'Ничего страшного. Попробуй ещё круг «Перед сном» — длинный выдох помогает лучше всего.'
};
Array.prototype.forEach.call(document.querySelectorAll('#feel button'),function(b){
  b.addEventListener('click',function(){
    if(S.saved){S.saved.feel=b.dataset.feel;save('history',history);}
    $('reply').textContent=REPLY[b.dataset.feel];
    $('feel').hidden=true;$('endH').hidden=true;$('after').hidden=false;
    buzz([10]);
  });
});
$('againBtn').addEventListener('click',start);
$('doneBtn').addEventListener('click',function(){renderStats();show('vSetup');});
$('startBtn').addEventListener('click',start);
$('stopBtn').addEventListener('click',function(){finish();});
function setPauseUi(){
  $('pauseLbl').textContent=S.paused?'Дальше':'Пауза';
  $('icPause').style.display=S.paused?'none':'';$('icPlay').style.display=S.paused?'':'none';
}
$('pauseBtn').addEventListener('click',function(){
  S.paused=!S.paused;setPauseUi();
  if(S.paused){lastWord='пауза';$('pWord').textContent='пауза';$('pHint').textContent='нажми «Дальше», когда будешь готова';$('pCount').textContent='';$('topTitle').textContent='пауза';audioOff();}
  else{lastWord='';if(settings.sound)audioOn();}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    if(S.running&&!S.paused)$('pauseBtn').click();
    cancelAnimationFrame(rafId);rafId=0;
  }else if(!rafId){last=0;rafId=requestAnimationFrame(tick);}
});
document.addEventListener('pointerdown',function(e){
  if(e.target.closest('button,a,.z-sheet,.panel,.feel,#after'))return;
  ripple(e.clientX,e.clientY,70+Math.random()*50);drop(600+Math.random()*200);buzz([6]);
});

/* ---------- главный цикл ---------- */
var rafId=0,last=0,ft=0,fn=0,fcount=0;
function tick(ts){
  rafId=requestAnimationFrame(tick);
  var dt=last?Math.min(.1,(ts-last)/1000):.016;last=ts;
  clock+=dt;
  if(S.running){
    if(!S.paused){var ph=step(dt);render(ph);if(S.t>=S.total)finish();}
  }else if(sceneMode==='end'){vis+=(1-vis)*(1-Math.exp(-dt*1.8));}
  else{
    var tgt=reduced?.6:.55+.2*Math.sin(clock*.5);
    vis+=(tgt-vis)*(1-Math.exp(-dt*2.5));
  }
  if(++fcount%20===0)layout(false);
  scene(dt);
  ft+=dt;fn++;
  if(fn>=90){
    if(!window.__noadapt&&ft/fn>.027&&Q>.6){Q=Math.max(.6,Q-.2);fit();}
    ft=0;fn=0;
  }
}
var rt=0;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(fit,120);});
window.addEventListener('orientationchange',function(){setTimeout(fit,250);});
if(window.ResizeObserver)new ResizeObserver(function(){layout(false);}).observe($('app'));

function setFlowers(){NFL=Math.min(daysCount(),SLOTS.length);}

initWorld();buildCaustics();
setFlowers();syncSetup();renderStats();
fit();
rafId=requestAnimationFrame(tick);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){layout(false);});
(function hello(){
  var seen=null;try{seen=localStorage.getItem(KEY+'v2_seen');}catch(e){}
  if(seen)return;
  setTimeout(function(){
    toast(history.length?'Пруд ожил. Все твои дни и минуты на месте.':'Коснись воды — по ней пойдёт рябь.',3600);
    try{localStorage.setItem(KEY+'v2_seen','1');}catch(e){}
  },1400);
})();

window.BREATHE={MODES:MODES,PRE:PRE,plan:plan,phaseAt:phaseAt,state:S,step:step,render:render,start:start,finish:finish,
  setRate:function(r){S.rate=r;},statsText:statsText,streak:streak,settings:settings,get history(){return history;}};
})();
</script>
</body>
