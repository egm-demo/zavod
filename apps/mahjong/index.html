<style>
html,body{height:100%}
body{overflow:hidden;touch-action:manipulation}
.z-app{height:100vh;height:100dvh;overflow:hidden}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.back{display:inline-grid;margin-right:44px}.lays::-webkit-scrollbar{display:none}
.z-icon.off{opacity:.45}
/* меню */
.lays{scrollbar-width:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;overflow:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.lay{display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:14px 14px 12px;border-radius:var(--r-l);background:var(--surface);transition:background .2s,transform .15s var(--ease)}
.lay:active{background:var(--surface-2);transform:scale(.98)}
.lay svg{width:100%;height:92px;display:block;margin-bottom:10px}
.lay b{font:500 22px/1.1 var(--display);color:var(--ink)}
.lay small{margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.lay.cont{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:var(--accent-soft)}
.lay.cont svg{width:84px;height:62px;margin:0;flex:none}
.lay.cont b{color:var(--accent)}
/* игра */
.meta{display:flex;justify-content:center;gap:16px;font-size:13.5px;color:var(--ink-2);min-height:22px;margin-top:2px}
.meta b{color:var(--ink);font-weight:600}
.boardarea{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px -8px 0}
.boardarea::before{content:"";position:absolute;inset:6% 0;border-radius:50%;pointer-events:none;
  background:radial-gradient(60% 50% at 50% 55%,rgba(79,160,168,.16),rgba(79,160,168,0) 70%);animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.55;transform:scale(.94)}to{opacity:1;transform:scale(1.04)}}
#bd{position:relative;flex:none}
.t{position:absolute;touch-action:manipulation;transition:transform .32s var(--ease)}
.t .s{position:absolute;inset:0;border-radius:8px;background:linear-gradient(165deg,#c8ba97 0%,#8e8160 100%);
  box-shadow:0 9px 14px -3px rgba(0,0,0,.7),-3px 0 5px -2px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.t .f{position:absolute;left:0;top:0;right:var(--e);bottom:var(--e);border-radius:7px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(150deg,#fffdf6 0%,#f5ecd6 58%,#e8dcbd 100%);
  box-shadow:inset 0 1.5px 0 #fff,inset 0 -2px 4px rgba(150,125,70,.28),inset 0 0 0 .6px rgba(110,90,50,.32);transition:box-shadow .3s,background .3s}
.t .f::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(60,84,86,.30),rgba(40,64,68,.40));opacity:0;transition:opacity .3s;pointer-events:none}
.t.blk svg{opacity:.8}.t svg{width:86%;height:auto;display:block;opacity:.94;filter:saturate(.82) drop-shadow(0 .7px 0 rgba(255,255,255,.85)) drop-shadow(0 -.5px 0 rgba(70,50,15,.22))}
.t.blk .f::after{opacity:1}
.t.free .f{box-shadow:inset 0 1.5px 0 #fff,inset 0 -2px 4px rgba(150,125,70,.28),inset 0 0 0 1px rgba(232,199,122,.9),0 0 6px 0 rgba(232,199,122,.3)}
.t.sel{transform:translate(-2px,-5px) scale(1.06)}
.t.sel .f{background:linear-gradient(150deg,#fffaf0,#fbe7ee 60%,#f2cfda);box-shadow:inset 0 1.5px 0 #fff,inset 0 0 0 2px var(--accent),0 0 18px 4px rgba(239,179,193,.7)}
.t.hint .f{animation:hint .9s ease-in-out infinite alternate}
@keyframes hint{from{box-shadow:inset 0 0 0 2px var(--accent),0 0 6px 1px rgba(239,179,193,.5)}to{box-shadow:inset 0 0 0 3px var(--accent),0 0 22px 7px rgba(239,179,193,.95)}}
.t.out{pointer-events:none;animation:vanish .6s var(--ease) forwards}
@keyframes vanish{0%{transform:translate(-2px,-5px) scale(1.06);opacity:1;filter:brightness(1)}35%{transform:translate(-2px,-9px) scale(1.12);opacity:1;filter:brightness(1.25)}100%{transform:translate(0,-18px) scale(.5);opacity:0;filter:brightness(1.4)}}
.t.hid{display:none}
.t.shake .f{animation:shake .26s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.t.pop{animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.spark{position:absolute;pointer-events:none;z-index:9000;width:14px;height:14px;margin:-7px 0 0 -7px}
.mtoast{position:absolute;left:50%;bottom:6px;transform:translate(-50%,10px);background:rgba(22,40,43,.94);box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 0 1px var(--line);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;max-width:94%;text-align:center;opacity:0;pointer-events:none;transition:all .35s var(--ease);z-index:9500}
.mtoast.on{opacity:1;transform:translate(-50%,0)}
.z-tool.pulse{color:var(--accent);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{background:transparent}to{background:var(--accent-soft)}}
/* победа */
.win{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;
  background:radial-gradient(90% 60% at 50% 45%,rgba(20,44,48,.9),rgba(8,16,18,.95))}
.win.on{display:flex}
.win>*{position:relative}
.win .z-h1{margin:0}
.win .z-lead{margin:12px auto 26px;max-width:22em}
.bl{position:absolute!important;opacity:0;transform:scale(.1) rotate(-30deg);animation:bloom 2.2s var(--ease) forwards}
@keyframes bloom{0%{opacity:0;transform:scale(.1) rotate(-30deg)}55%{opacity:.9}100%{opacity:.42;transform:scale(1) rotate(0)}}
.win .wt{opacity:0;animation:z-in .8s var(--ease) 1.1s forwards}
.sheet-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.sheet-row .z-seg{min-width:170px}
.sheet-btns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.t,.t.hint .f,.z-tool.pulse,.boardarea::before{transition:none;animation:none}.bl{animation:none;opacity:.42;transform:none}.win .wt{animation:none;opacity:1}}
</style>

      <button class="z-tool" id="bUndo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 6 6"/></svg>Назад</button>

      <button class="z-tool" id="bMenu"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Раскладки</button>
    </div>
  </div>
</div>

<div class="win" id="win">
  <div id="blooms"></div>
  <h1 class="z-h1">Пруд <i>затих</i></h1>
  <div class="wt"><p class="z-lead" id="winTxt"></p>
  <button class="z-btn" id="wAgain">Дальше</button><br><button class="z-btn quiet" id="wMenu" style="margin-top:8px">Другая раскладка</button></div>
</div>

<div class="z-scrim" id="scrim"></div>
<div class="z-sheet" id="sheet" role="dialog" aria-label="Меню">
  <h2 class="z-h2">Как <i>играть</i></h2>
  <p class="z-lead">Коснитесь свободной фишки, затем такой же. Свободные фишки светятся золотом, заблокированные притушены. Каждая раздача решаема.</p>
  <div class="sheet-row"><span>Время партии</span><div class="z-seg"><button id="tOn">Видно</button><button id="tOff">Скрыто</button></div></div>
  <div class="sheet-btns"><button class="z-btn ghost wide" id="shRestart">Начать эту раскладку заново</button></div>
</div>
<div class="z-toast" id="gtoast"></div>

<script>
/*LOGIC*/
const LAYOUTS=[
 {id:'lily',name:'Кувшинка',half:[
  "...111...","..11111..",".1121211.",".1111111.","111121111","111222111"],mirror:true},
 {id:'turtle',name:'Черепаха-мини',grid:[
  "....1....","...111...",".1122211.","111232111",".1123211.","111232111",".1122211.","1.11111.1","...111...","....1...."]},
 {id:'pyramid',name:'Пирамида',grid:[
  "....1....","...111...","..11111..",".1122211.",".1123211.","112333211",".1123211.",".1122211.","..11111..","...111...","....1...."]},
 {id:'bridge',name:'Мост',grid:[
  "111111111","122111221","111121111","...111...","...121...","...121...","...111...","111121111","122111221","111111111"]},
 {id:'moon',name:'Луна',grid:[
  ".121...1.","121...1..","121......","12.......","12.......","121...1..","121......","1221....1","11222211.",".122221.."]}
];
LAYOUTS.forEach(L=>{if(L.half){L.grid=L.half.concat(L.half.slice().reverse())}});
const NF=20;
function buildPositions(L){
  const pos=[];
  L.grid.forEach((row,r)=>{for(let c=0;c<row.length;c++){const ch=row[c];if(ch>='1'&&ch<='9'){for(let z=0;z<+ch;z++)pos.push({c,r,z})}}});
  if(pos.length%2){let mi=0;pos.forEach((p,i)=>{if(p.z>=pos[mi].z)mi=i});pos.splice(mi,1)}
  return pos;
}
const K=(c,r,z)=>z*10000+r*100+c;
function makeMap(pos){const m=new Map();pos.forEach((p,i)=>m.set(K(p.c,p.r,p.z),i));return m}
function isFree(pos,map,alive,i){
  const p=pos[i];
  const up=map.get(K(p.c,p.r,p.z+1));if(up!==undefined&&alive[up])return false;
  const l=map.get(K(p.c-1,p.r,p.z)),r=map.get(K(p.c+1,p.r,p.z));
  return !((l!==undefined&&alive[l])&&(r!==undefined&&alive[r]));
}
/* reverse placement: remove random free pairs from the full position set; the removal order is a valid solution */
function genPairs(pos,tries){
  tries=tries||600;const map=makeMap(pos);
  for(let t=0;t<tries;t++){
    const alive=pos.map(()=>true),order=[];let ok=true;
    for(let n=pos.length/2;n>0;n--){
      const free=[];for(let i=0;i<pos.length;i++)if(alive[i]&&isFree(pos,map,alive,i))free.push(i);
      if(free.length<2){ok=false;break}
      const a=free.splice(Math.floor(Math.random()*free.length),1)[0];
      const b=free[Math.floor(Math.random()*free.length)];
      alive[a]=alive[b]=false;order.push([a,b]);
    }
    if(ok)return order;
  }
  return null;
}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pairFaces(n){
  const out=[];let bag=[];
  while(out.length<n){if(!bag.length){bag=shuffleArr([...Array(NF).keys()])}out.push(bag.pop())}
  return shuffleArr(out);
}
function dealLayout(L){
  const pos=buildPositions(L);const order=genPairs(pos);
  if(!order)return null;
  const faces=pairFaces(order.length);
  const tiles=pos.map(p=>({c:p.c,r:p.r,z:p.z,face:0}));
  order.forEach((pr,k)=>{tiles[pr[0]].face=faces[k];tiles[pr[1]].face=faces[k]});
  return {tiles,solution:order};
}
function availPairs(tiles,map,alive){
  const by={};
  for(let i=0;i<tiles.length;i++)if(alive[i]&&isFree(tiles,map,alive,i))(by[tiles[i].face]=by[tiles[i].face]||[]).push(i);
  const res=[];
  for(const f in by){const a=by[f];for(let x=0;x<a.length;x++)for(let y=x+1;y<a.length;y++)res.push([a[x],a[y]])}
  return res;
}
/* reshuffle remaining tiles, keeping the deal solvable */
function reshuffle(tiles,alive){
  const idx=[];tiles.forEach((t,i)=>{if(alive[i])idx.push(i)});
  const sub=idx.map(i=>({c:tiles[i].c,r:tiles[i].r,z:tiles[i].z}));
  const order=genPairs(sub,800);if(!order)return null;
  const cnt={};idx.forEach(i=>cnt[tiles[i].face]=(cnt[tiles[i].face]||0)+1);
  const fl=[];for(const f in cnt)for(let k=0;k<cnt[f]/2;k++)fl.push(+f);
  shuffleArr(fl);
  const nf=idx.map(()=>0);
  order.forEach((pr,k)=>{nf[pr[0]]=fl[k];nf[pr[1]]=fl[k]});
  return {idx,faces:nf,solution:order.map(p=>[idx[p[0]],idx[p[1]]])};
}
/*ENDLOGIC*/

/* ---------- faces (гравировка на слоновой кости) ---------- */
const S='#35504a',W='#5a9db3';
function lily(a,b,c,v){let p='';
 for(let k=0;k<8;k++)p+=`<ellipse cx="20" cy="11.5" rx="3.9" ry="8" transform="rotate(${k*45} 20 20)" fill="${a}" stroke="${S}" stroke-width=".8"/><path d="M20 4.4V11" transform="rotate(${k*45} 20 20)" stroke="${v}" stroke-width=".6" opacity=".7"/>`;
 for(let k=0;k<8;k++)p+=`<ellipse cx="20" cy="14.2" rx="3" ry="5.4" transform="rotate(${k*45+22.5} 20 20)" fill="${b}" stroke="${S}" stroke-width=".6"/>`;
 for(let k=0;k<10;k++){const a2=k*36*Math.PI/180;p+=`<circle cx="${(20+Math.cos(a2)*4.6).toFixed(1)}" cy="${(20+Math.sin(a2)*4.6).toFixed(1)}" r=".9" fill="${c}"/>`}
 return p+`<circle cx="20" cy="20" r="2.4" fill="${c}" stroke="${S}" stroke-width=".7"/>`}
function moonBase(inner){return `<circle cx="20" cy="20" r="16" fill="#3a4a74" stroke="${S}" stroke-width="1"/><circle cx="20" cy="20" r="14" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width=".6"/><circle cx="11" cy="9" r=".9" fill="#f6efe4"/><circle cx="31" cy="30" r=".8" fill="#f6efe4"/><circle cx="30" cy="10" r=".7" fill="#f6efe4"/><circle cx="8" cy="26" r=".6" fill="#f6efe4"/>`+inner}
const FACES=[
 lily('#ee9db3','#fad0dc','#e8b040','#b9566f'),
 lily('#fffdf6','#ece1c6','#e8b040','#a99b78'),
 lily('#8a6bb8','#c1abe0','#f0c75a','#5a4380'),
 lily('#efc454','#f9e2a0','#c9702a','#a8741f'),
 /*pad*/`<path d="M20 22L27 9.9A14 14 0 1 1 15.2 8.8Z" fill="#78a870" stroke="${S}" stroke-width="1.2"/><g stroke="#3f6a47" stroke-width=".8" fill="none"><path d="M20 22L32 28M20 22L8 28M20 22L20 35M20 22L9 15M20 22L31 16M20 22L14 33M20 22L27 33"/></g><path d="M20 22L27 9.9" stroke="#e9f0d8" stroke-opacity=".5" stroke-width=".8"/><circle cx="29" cy="30" r="3" fill="#f0a3b8" stroke="${S}" stroke-width=".8"/><circle cx="29" cy="30" r="1" fill="#e8b040"/>`,
 /*frog*/`<ellipse cx="9" cy="30" rx="5" ry="3" fill="#82b560" stroke="${S}" stroke-width="1"/><ellipse cx="31" cy="30" rx="5" ry="3" fill="#82b560" stroke="${S}" stroke-width="1"/><ellipse cx="20" cy="25" rx="11" ry="8" fill="#8fbf62" stroke="${S}" stroke-width="1.2"/><ellipse cx="20" cy="19" rx="11" ry="7" fill="#9fcf70" stroke="${S}" stroke-width="1.2"/><ellipse cx="20" cy="28" rx="6" ry="3.6" fill="#e9f0c8" opacity=".75"/><g fill="#6f9f4a"><circle cx="14" cy="22" r="1.2"/><circle cx="26" cy="22" r="1.2"/><circle cx="20" cy="17" r="1"/></g><circle cx="13.5" cy="13" r="4.2" fill="#fffdf6" stroke="${S}" stroke-width="1"/><circle cx="26.5" cy="13" r="4.2" fill="#fffdf6" stroke="${S}" stroke-width="1"/><ellipse cx="14" cy="13.3" rx="1.2" ry="2.2" fill="#1d2b2a"/><ellipse cx="26" cy="13.3" rx="1.2" ry="2.2" fill="#1d2b2a"/><path d="M13 21q7 5 14 0" fill="none" stroke="${S}" stroke-width="1.2" stroke-linecap="round"/>`,
 /*dragonfly*/`<g fill="#bfe0ee" fill-opacity=".85" stroke="${S}" stroke-width=".9"><ellipse cx="10.5" cy="14" rx="9" ry="3.2" transform="rotate(-14 10.5 14)"/><ellipse cx="29.5" cy="14" rx="9" ry="3.2" transform="rotate(14 29.5 14)"/><ellipse cx="11.5" cy="20.5" rx="8" ry="2.8" transform="rotate(10 11.5 20.5)"/><ellipse cx="28.5" cy="20.5" rx="8" ry="2.8" transform="rotate(-10 28.5 20.5)"/></g><g stroke="#2d6f8a" stroke-width=".5" opacity=".6"><path d="M4 15l12-3M36 15l-12-3M5 21l12-1M35 21l-12-1"/></g><path d="M20 9v24" stroke="#2d6f8a" stroke-width="3.2" stroke-linecap="round"/><path d="M20 15v16" stroke="#8fd0d8" stroke-width=".9" stroke-dasharray="1.4 2"/><circle cx="20" cy="8" r="3" fill="#2d6f8a" stroke="${S}" stroke-width="1"/><circle cx="18.8" cy="7.2" r=".8" fill="#fff"/>`,
 /*koi*/`<path d="M27 20L37 11 34 20 37 29Z" fill="#f6b27a" stroke="${S}" stroke-width="1.1" stroke-linejoin="round"/><path d="M14 13l5-5 3 7zM14 27l5 5 3-7z" fill="#f6b27a" stroke="${S}" stroke-width="1" stroke-linejoin="round"/><ellipse cx="16.5" cy="20" rx="12.5" ry="7" fill="#fffaf0" stroke="${S}" stroke-width="1.2"/><path d="M10 14.5q6-3 12 .5q4 3 3 5q-9 4-15 0z" fill="#ee7a48"/><g fill="none" stroke="#c9bd9c" stroke-width=".6"><path d="M16 24q2-2 4 0M20 24q2-2 4 0M12 24q2-2 4 0"/></g><circle cx="8.5" cy="18.5" r="1.4" fill="#1d2b2a"/><circle cx="19" cy="24" r="2" fill="#ee7a48"/>`,
 /*crescent*/moonBase(`<path d="M24 8A13 13 0 1 0 24 32A14 14 0 0 1 24 8Z" fill="#f4dd97" transform="translate(1 0)"/>`),

/* ---------- state & storage (ключи v1 без изменений) ---------- */
const $=id=>document.getElementById(id);
const LS='kuv_mahjong_';
function lsGet(k,d){try{const v=localStorage.getItem(LS+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
let best=lsGet('best',{});if(!best||typeof best!=='object')best={};
let muted=!!lsGet('mute',false),timerOn=lsGet('timer',true)!==false;
let G=null;
const pl=n=>{const a=n%10,b=n%100;return n+(a===1&&b!==11?' фишка':a>=2&&a<=4&&(b<10||b>=20)?' фишки':' фишек')};
const plLeft=n=>{const a=n%10,b=n%100;return (a===1&&b!==11?'осталась ':'осталось ')+pl(n)};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const vib=n=>{if(!muted&&navigator.vibrate)try{navigator.vibrate(n)}catch(e){}};
const REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- sound ---------- */
let ac=null;
function tone(f,t0,dur,vol,type){
  if(muted||!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,ac.currentTime+t0);g.gain.linearRampToValueAtTime(vol,ac.currentTime+t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t0+dur);
  o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+dur+.05);
}
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
const sndSel=()=>tone(520,0,.12,.04,'triangle');
const sndMatch=()=>{tone(660,0,.5,.08);tone(990,.09,.6,.06);tone(1320,.18,.7,.03)};
const sndBad=()=>tone(180,0,.15,.04,'triangle');
const sndWin=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.22,1.2,.06));
function paintSound(){$('btnSound').classList.toggle('off',muted);$('sw').style.display=muted?'none':''}

/* ---------- toasts ---------- */
function gtoast(t,ms){const el=$('gtoast');el.textContent=t;el.classList.add('on');clearTimeout(gtoast.h);gtoast.h=setTimeout(()=>el.classList.remove('on'),ms||3200)}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),2400)}

/* ---------- menu ---------- */
function preview(L,uid){
  const rows=L.grid.length,cols=9,u=10;let s=`<svg viewBox="0 0 ${cols*u} ${rows*u*1.25}" preserveAspectRatio="xMidYMid meet">`;
  L.grid.forEach((row,r)=>{for(let c=0;c<row.length;c++){const h=+row[c];if(h>0){
    for(let z=0;z<h;z++)s+=`<rect x="${c*u+.8+(h-1-z)*-0.6}" y="${r*u*1.25+.8-(z)*0.9}" width="${u-1.6}" height="${u*1.25-1.6}" rx="2" fill="${z===h-1?'#f6efe4':'#bfb28f'}" fill-opacity="${z===h-1?(h>1?.95:.6):.55}"/>`}}});
  return s+'</svg>';
}
function saveGame(){
  if(!G||G.done)return;
  lsSet('v2_game',{id:G.L.id,t:G.t,faces:G.tiles.map(t=>t.face),alive:G.alive.map(a=>a?1:0),undo:G.undo,cells:G.tiles.map(t=>[t.c,t.r,t.z])});
}
function loadSaved(){
  const s=lsGet('v2_game',null);if(!s||!s.id||!Array.isArray(s.cells))return null;
  const L=LAYOUTS.find(l=>l.id===s.id);if(!L)return null;
  const pos=buildPositions(L);
  if(pos.length!==s.cells.length||pos.some((p,i)=>p.c!==s.cells[i][0]||p.r!==s.cells[i][1]||p.z!==s.cells[i][2]))return null;
  if(!s.alive.some(a=>a))return null;
  return {L,s};
}
function paintMenu(){
  const sv=loadSaved();
  let h='';
  if(sv){const left=sv.s.alive.filter(a=>a).length;h+=`<button class="lay cont" data-cont="1">${preview(sv.L)}<span><b>Продолжить</b><br><small>${sv.L.name} · ${plLeft(left)} · ${fmt(sv.s.t||0)}</small></span></button>`}
  h+=LAYOUTS.map(L=>{const n=buildPositions(L).length;const b=best[L.id];
    return `<button class="lay" data-id="${L.id}">${preview(L)}<b>${L.name}</b><small>${pl(n)}${b?' · лучшее '+fmt(b):''}</small></button>`}).join('');
  $('lays').innerHTML=h;
}
$('lays').addEventListener('click',e=>{const b=e.target.closest('.lay');if(!b)return;initAudio();if(b.dataset.cont)resume();else start(b.dataset.id)});

/* ---------- game ---------- */
function show(which){$('sMenu').classList.toggle('on',which==='menu');$('sGame').classList.toggle('on',which==='game');$('ttl').textContent=which==='game'?G.L.name:''}
function begin(L,tiles,alive,undo,t,solution){
  G={L,tiles,solution,map:makeMap(tiles),alive,sel:-1,undo,els:[],t,done:false,hintT:0};
  lsSet('last',L.id);
  $('win').classList.remove('on');show('game');
  render();clearInterval(G.timer);G.timer=setInterval(()=>{if(!G.done&&!document.hidden){G.t++;paintStats();if(G.t%5===0)saveGame()}},1000);
}
function start(id){
  const L=LAYOUTS.find(l=>l.id===id);
  const d=dealLayout(L);if(!d){gtoast('Не удалось раздать, попробуйте ещё раз');return}
  begin(L,d.tiles,d.tiles.map(()=>true),[],0,d.solution);saveGame();
}
function resume(){
  const sv=loadSaved();if(!sv){paintMenu();return}
  const tiles=sv.s.cells.map((c,i)=>({c:c[0],r:c[1],z:c[2],face:sv.s.faces[i]}));
  begin(sv.L,tiles,sv.s.alive.map(a=>!!a),sv.s.undo||[],sv.s.t||0,[]);
  update();if(!G.pairs.length&&G.left>0)toast('Ходов нет. Нажмите «Перемешать»');
}
function render(){
  const bd=$('bd'),ba=$('ba');bd.innerHTML='';G.els=[];
  const T=G.tiles;let minc=99,maxc=0,minr=99,maxr=0,mz=0;
  T.forEach(t=>{minc=Math.min(minc,t.c);maxc=Math.max(maxc,t.c);minr=Math.min(minr,t.r);maxr=Math.max(maxr,t.r);mz=Math.max(mz,t.z)});
  const cols=maxc-minc+1,rows=maxr-minr+1,AR=1.28,EF=.12;
  const aw=ba.clientWidth-8,ah=ba.clientHeight-8;
  const tw=Math.max(14,Math.min(64,aw/(cols+(mz+1)*EF),ah/(rows*AR+(mz+1)*EF)));
  const th=tw*AR,e=tw*EF;G.tw=tw;
  bd.style.width=(cols*tw+(mz+1)*e)+'px';bd.style.height=(rows*th+(mz+1)*e)+'px';
  T.forEach((t,i)=>{
    const d=document.createElement('div');d.className='t';d.dataset.i=i;
    d.style.cssText=`width:${tw}px;height:${th}px;left:${(t.c-minc)*tw+(mz-t.z)*e}px;top:${(t.r-minr)*th+(mz-t.z)*e}px;z-index:${t.z*1000+t.r*10+t.c};--e:${e}px`;
    d.innerHTML=`<div class="s"></div><div class="f"><svg viewBox="0 0 40 40"><use href="#f${t.face}"/></svg></div>`;
    if(!G.alive[i])d.classList.add('hid');
    bd.appendChild(d);G.els[i]=d;
  });
  update();
}
function update(){
  let left=0;
  G.tiles.forEach((t,i)=>{if(G.alive[i]){left++;const f=isFree(G.tiles,G.map,G.alive,i);const c=G.els[i].classList;c.toggle('blk',!f);c.toggle('free',f);c.toggle('sel',i===G.sel)}});
  G.left=left;G.pairs=availPairs(G.tiles,G.map,G.alive);
  paintStats();
  $('bUndo').disabled=!G.undo.length;
  $('bShuf').classList.toggle('pulse',left>0&&!G.pairs.length);
}
function paintStats(){
  $('cPairs').textContent=G.pairs.length;$('cLeft').textContent=G.left;
  $('tm').style.display=timerOn?'':'none';$('cTime').textContent=fmt(G.t);
  $('tOn').classList.toggle('on',timerOn);$('tOff').classList.toggle('on',!timerOn);
}
function clearHint(){G.els.forEach(el=>el.classList.remove('hint'))}
function sparks(el){
  if(REDUCED)return;
  const b=$('bd'),r=el.getBoundingClientRect(),br=b.getBoundingClientRect();
  const cx=r.left-br.left+r.width/2,cy=r.top-br.top+r.height/2;
  for(let k=0;k<7;k++){
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','spark');s.setAttribute('viewBox','0 0 40 40');
    s.style.left=cx+'px';s.style.top=cy+'px';
    s.innerHTML=k%2?'<path d="M20 2l3 15 15 3-15 3-3 15-3-15-15-3 15-3z" fill="#f6dc98"/>':'<ellipse cx="20" cy="12" rx="6" ry="12" fill="#f0a3b8" transform="rotate(20 20 20)"/>';
    b.appendChild(s);
    const a=Math.random()*Math.PI*2,d=r.width*(.6+Math.random()*.9);
    s.animate([{transform:'translate(0,0) scale(.3) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-r.width*.6}px) scale(${.8+Math.random()*.6}) rotate(${Math.random()*180-90}deg)`,opacity:0}],{duration:700+Math.random()*350,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}
function tap(i){
  if(G.done||!G.alive[i])return;initAudio();clearHint();
  const el=G.els[i];
  if(!isFree(G.tiles,G.map,G.alive,i)){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');sndBad();vib(4);return}
  if(G.sel===i){G.sel=-1;update();return}
  if(G.sel<0){G.sel=i;sndSel();vib(6);update();return}
  const j=G.sel;
  if(G.tiles[j].face===G.tiles[i].face){take(i,j)}
  else{G.sel=i;sndSel();update()}
}
function take(i,j){
  G.sel=-1;G.alive[i]=G.alive[j]=false;G.undo.push([i,j]);
  [i,j].forEach(k=>{const el=G.els[k];el.classList.remove('sel','free','blk');el.classList.add('out');sparks(el)});
  setTimeout(()=>{[i,j].forEach(k=>{if(!G.alive[k]){G.els[k].classList.add('hid');G.els[k].classList.remove('out')}})},620);
  sndMatch();vib(12);update();saveGame();
  if(G.left===0)win();
  else if(!G.pairs.length)toast('Ходов не осталось. Нажмите «Перемешать»');
}
function win(){
  G.done=true;clearInterval(G.timer);lsSet('v2_game',null);
  const id=G.L.id,prev=best[id];let msg='Все пары найдены.';
  msg+=' Время: '+fmt(G.t)+'.';
  if(!prev||G.t<prev){best[id]=G.t;lsSet('best',best);msg+=prev?' Это новый рекорд.':' Первый результат записан.'}else msg+=' Лучшее время: '+fmt(prev)+'.';
  $('winTxt').textContent=msg;
  let h='';
  for(let k=0;k<12;k++){const x=Math.random()*80+10,y=Math.random()*80+8,s=70+Math.random()*70;
    h+=`<svg class="bl" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;margin:-${s/2}px 0 0 -${s/2}px;animation-delay:${(k*.2).toFixed(2)}s"><use href="#bloomL"/></svg>`}
  $('blooms').innerHTML=h;setTimeout(()=>$('win').classList.add('on'),450);sndWin();vib([20,40,20]);paintMenu();
}
$('bd').addEventListener('click',e=>{const t=e.target.closest('.t');if(t&&G&&!t.classList.contains('hid'))tap(+t.dataset.i)});
$('bHint').onclick=()=>{
  if(!G||G.done)return;initAudio();clearHint();
  if(!G.pairs.length){toast('Ходов нет. Нажмите «Перемешать»');return}
  const p=G.pairs[Math.floor(Math.random()*G.pairs.length)];
  p.forEach(k=>G.els[k].classList.add('hint'));
  clearTimeout(G.hintT);G.hintT=setTimeout(clearHint,3000);
};
$('bUndo').onclick=()=>{
  if(!G||G.done||!G.undo.length)return;clearHint();
  const [i,j]=G.undo.pop();G.alive[i]=G.alive[j]=true;G.sel=-1;
  [i,j].forEach(k=>{const el=G.els[k];el.classList.remove('out','hid');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')});
  update();saveGame();
};
$('bShuf').onclick=()=>{
  if(!G||G.done)return;initAudio();clearHint();
  const r=reshuffle(G.tiles,G.alive);
  if(!r){toast('Перемешать не получилось, отмените ход назад');return}
  r.idx.forEach((ti,k)=>{G.tiles[ti].face=r.faces[k];G.els[ti].querySelector('use').setAttribute('href','#f'+r.faces[k])});
  G.sel=-1;update();saveGame();toast('Фишки перемешаны');
  G.els.forEach((el,i)=>{if(G.alive[i]){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}});
};
function toMenu(){if(G){clearInterval(G.timer);saveGame()}$('win').classList.remove('on');show('menu');paintMenu();closeSheet()}
$('bMenu').onclick=toMenu;$('wMenu').onclick=toMenu;
$('wAgain').onclick=()=>start(G.L.id);
$('btnSound').onclick=()=>{muted=!muted;lsSet('mute',muted);paintSound();if(!muted){initAudio();sndSel()}};
