<script>
/* ===== Лиза: процедурная отрисовка ===== */
const K={slate:'#5A5E65',shade:'#373A40',lite:'#7E828A',tail:'#383A40',white:'#F7F4ED',wsh:'#D3D1CC',ink:'#14161a',pink:'#8E5963',gold:'#F2C21B'};
const TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const E0={lid:.22,lidB:0,tilt:.09,lx:.7,ly:.05,pu:.15,open:0,sm:-.25,jag:0,fang:0,ear:.16,puff:0,cl:0,hp:1,blush:0,wh:0,hr:0,tongue:0,lick:0,lt:0,spiral:0,sp:0};
const EXP={
 judge:{},
 flat:{lid:.5,tilt:.02,lx:0,ly:0,pu:.1,sm:-.5,ear:.1},
 smug:{lid:.52,lidB:.14,tilt:-.04,lx:.4,ly:.1,pu:.2,sm:.8,ear:.05},
 meow:{lid:.04,tilt:-.1,lx:0,ly:0,pu:.55,open:.85,sm:0,ear:0,tongue:.5},
 meow2:{lid:.12,tilt:.05,lx:0,ly:-.1,pu:.5,open:.55,sm:0,ear:.05},
 swear:{lid:.5,tilt:.5,lx:0,ly:0,pu:-.3,open:.8,jag:1,fang:1,sm:-1,ear:.85,puff:1,wh:.8},
 hiss:{lid:.45,tilt:.55,lx:0,ly:0,pu:-.4,open:1,jag:0,fang:1,sm:0,ear:1,puff:1,wh:1},
 shock:{lid:-.02,tilt:0,lx:0,ly:0,pu:-.5,open:.35,sm:0,ear:.3,puff:.6,wh:.4},
 offend:{lid:.3,tilt:.08,lx:-.9,ly:-.4,pu:.1,open:0,sm:-1,ear:.35,hr:.12},
 want:{lid:.06,tilt:-.18,lx:.0,ly:-.1,pu:.7,open:.3,sm:.3,ear:0},
 lean:{lid:.52,tilt:-.1,lx:0,ly:.2,pu:.6,sm:.7,ear:.05,blush:.7,hr:-.14},
 dreamy:{lid:.6,tilt:-.12,lx:0,ly:0,pu:1.1,sm:.7,ear:.18,blush:.8},
 bliss:{lid:1,cl:1,hp:1,sm:1,ear:.2,blush:1,pu:.6},
 purr:{lid:1,cl:1,hp:.6,sm:1,ear:.15,blush:1},
 sleepy:{lid:1,cl:1,hp:-.4,sm:.2,ear:.3,blush:.3},
 stare:{lid:.15,tilt:.04,lx:0,ly:0,pu:.1,sm:-.2,ear:.1},
 wow:{lid:-.05,tilt:0,lx:0,ly:0,pu:1.1,open:.2,sm:.4,ear:0},
 crazy:{lid:-.02,tilt:-.2,lx:0,ly:0,pu:1.0,open:.7,sm:.6,ear:.6,wh:.6,tongue:.3}
};
function mkExp(name,extra){return Object.assign({},E0,EXP[name]||{},extra||{})}
function easeExp(cur,tgt,k){for(const key in tgt){if(typeof tgt[key]==='number')cur[key]=lerp(cur[key]??tgt[key],tgt[key],k)}return cur}

function hpath(c){
  c.beginPath();c.moveTo(0,-84);
  c.bezierCurveTo(40,-85,76,-68,92,-40);
  c.bezierCurveTo(104,-20,106,0,104,14);
  c.quadraticCurveTo(109,22,106,32);c.quadraticCurveTo(107,41,100,47);
  c.bezierCurveTo(88,70,56,84,0,84);
  c.bezierCurveTo(-56,84,-88,70,-100,46);
  c.quadraticCurveTo(-107,41,-106,32);c.quadraticCurveTo(-109,22,-104,14);
  c.bezierCurveTo(-106,0,-104,-20,-92,-40);
  c.bezierCurveTo(-76,-68,-40,-85,0,-84);c.closePath();
}
function drawEar(c,side,e){
  c.save();c.translate(side*60,-56);
  const rot=side*(.3+e.ear*.55);c.rotate(rot);c.scale(1.1,1.2*(1-e.ear*.2));
  const P=(k)=>{c.beginPath();c.moveTo(-40*k,16);c.bezierCurveTo(-38*k,-22,-18*k,-58,4*k,-84);c.quadraticCurveTo(10*k,-89,16*k,-83);c.bezierCurveTo(40*k,-56,52*k,-22,46*k,18);c.closePath()};
  P(1);let g=c.createLinearGradient(0,-100,0,14);g.addColorStop(0,'#2f333a');g.addColorStop(.6,K.slate);g.addColorStop(1,K.shade);c.fillStyle=g;c.fill();
  c.save();c.translate(3,-2);c.scale(.98,.9);
  c.beginPath();c.moveTo(-26,10);c.bezierCurveTo(-24,-20,-10,-48,4,-66);c.bezierCurveTo(22,-48,34,-20,32,10);c.closePath();
  g=c.createLinearGradient(0,-70,0,8);g.addColorStop(0,'#b7979b');g.addColorStop(1,'#6d5257');c.fillStyle=g;c.fill();c.strokeStyle='rgba(228,224,216,.42)';c.lineWidth=1.3;c.lineCap='round';for(let i=0;i<4;i++){c.beginPath();c.moveTo(side*(-16+i*4),8);c.quadraticCurveTo(side*(-12+i*5),-10,side*(-4+i*6),-22-i*3);c.stroke()}
  c.restore();c.restore();
}
function closedEye(c,side,e){
  c.save();c.lineCap='round';c.strokeStyle=K.ink;
  const k=-e.hp*20;
  c.lineWidth=5;c.beginPath();c.moveTo(-30,6);c.quadraticCurveTo(0,6+k*2,30,6);c.stroke();
  c.lineWidth=3;
  for(let i=0;i<3;i++){const t=.2+i*.3,x=lerp(-30,30,t),y=6+k*2*2*t*(1-t);c.beginPath();c.moveTo(x,y);c.lineTo(x+side*(-2+i*3),y+(e.hp>=0?-7:7));c.stroke();}
  c.restore();
}
function eyeDraw(c,side,e,blink){
  const cx=side*47,cy=-8,rx=36,ry=40;
  c.save();c.translate(cx,cy);
  if(e.cl>.6){closedEye(c,side,e);c.restore();return}
  
  c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);
  let g=c.createRadialGradient(-4,-8,3,0,0,ry+2);
  g.addColorStop(0,'#ECEA8E');g.addColorStop(.45,'#C9CB4C');g.addColorStop(.82,'#A0AC3A');g.addColorStop(1,'#54702A');
  c.fillStyle=g;c.fill();
  c.save();c.clip();
  // тонкие радужные лучики
  c.strokeStyle='rgba(70,92,20,.24)';c.lineWidth=1.4;
  for(let i=0;i<14;i++){const a=i/14*TAU;c.beginPath();c.moveTo(Math.cos(a)*18,Math.sin(a)*20);c.lineTo(Math.cos(a)*rx,Math.sin(a)*ry);c.stroke();}
  const pu=clamp(e.pu,-.7,1.2);
  const px=e.lx*10,py=e.ly*9;
  const prx=12+pu*13,pry=24+pu*11;
  if(e.spiral>.3){c.strokeStyle='#241a08';c.lineWidth=2.6;c.lineCap='round';c.beginPath();for(let a=0;a<TAU*3;a+=.2){const r=1.5+a*1.9,x=Math.cos(a+e.sp*side)*r*(side>0?1:-1),y=Math.sin(a+e.sp*side)*r;a?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
  else{c.beginPath();c.ellipse(px,py,Math.max(4,prx),Math.max(10,pry),0,0,TAU);c.fillStyle='#0b0c0f';c.fill();}
  // внутренняя тень от верхнего века
  g=c.createLinearGradient(0,-ry,0,-ry*.3);g.addColorStop(0,'rgba(20,16,6,.5)');g.addColorStop(1,'rgba(20,16,6,0)');c.fillStyle=g;c.fillRect(-rx,-ry,rx*2,ry*.7);
  c.fillStyle='rgba(255,255,255,.96)';
  c.beginPath();c.arc(-12+px*.35,-14+py*.3,7.8,0,TAU);c.fill();
  c.beginPath();c.arc(12+px*.2,12+py*.2,3.6,0,TAU);c.fill();
  // веки
  const L=Math.max(e.lid,blink,e.cl);
  if(L>.005||e.lidB>.005){
    const ly=-ry+clamp(L,0,1.05)*2*ry;
    c.save();c.rotate(-side*e.tilt);
    if(L>.005){
      g=c.createLinearGradient(0,-ry-40,0,ly);g.addColorStop(0,'#2b2f35');g.addColorStop(1,'#343941');
      c.fillStyle=g;c.fillRect(-80,-ry-80,160,ly+ry+80);
      c.strokeStyle=K.ink;c.lineWidth=2.4;c.lineCap='round';
      c.beginPath();c.moveTo(-60,ly);c.lineTo(60,ly);c.stroke();
    }
    if(e.lidB>.005){const by=ry-e.lidB*1.2*ry;c.fillStyle=K.slate;c.fillRect(-80,by,160,100);c.strokeStyle=K.ink;c.lineWidth=2.6;c.beginPath();c.moveTo(-60,by);c.lineTo(60,by);c.stroke();}
    c.restore();
  }
  c.restore();
  c.lineWidth=2.2;c.strokeStyle='rgba(15,16,20,.85)';c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);
  c.restore();
}
function drawMouth(c,e){
  c.save();c.lineCap='round';c.lineJoin='round';
  const nc='#2b2024';
  const o=e.open;
  c.strokeStyle=nc;c.lineWidth=2.6;
  c.beginPath();c.moveTo(0,33);c.lineTo(0,40);c.stroke();
  if(o<.06){
    const cy=46-e.sm*7,ct=51+e.sm*3;
    for(const s of[-1,1]){c.beginPath();c.moveTo(0,40);c.quadraticCurveTo(s*11,ct,s*26,cy);c.stroke();}
    if(e.sm>.5){c.lineWidth=1.8;for(const s of[-1,1]){c.beginPath();c.moveTo(s*26,cy);c.lineTo(s*30,cy-3);c.stroke();}}
  }else{
    const h=14+o*44,w=26+o*14;
    c.beginPath();c.moveTo(-w,41);c.quadraticCurveTo(-w*.5,37,0,41);c.quadraticCurveTo(w*.5,37,w,41);
    if(e.jag>.3){const n=5;for(let i=0;i<=n;i++){const x=w-(i/n)*2*w,y=41+h*.85+(i%2?-6:5);c.lineTo(x*.82,y);}}
    else{c.bezierCurveTo(w*.8,41+h*1.05,-w*.8,41+h*1.05,-w,41);}
    c.closePath();
    let g=c.createLinearGradient(0,41,0,41+h);g.addColorStop(0,'#3a1520');g.addColorStop(1,'#6b2634');c.fillStyle=g;c.fill();c.stroke();
    if(e.tongue>.05||o>.5){c.save();c.clip();c.beginPath();c.ellipse(0,41+h*.9,w*.55,h*.4,0,0,TAU);c.fillStyle='#E88D9F';c.fill();c.restore();}
    if(e.fang>.3){c.fillStyle='#fff';for(const s of[-1,1]){c.beginPath();c.moveTo(s*w*.55-4,41);c.lineTo(s*w*.55+4,41);c.lineTo(s*w*.55,41+10+o*4);c.closePath();c.fill();}}
  }
  if(e.lick>.02){c.fillStyle='#E88D9F';c.strokeStyle='rgba(60,20,30,.6)';c.lineWidth=1.6;c.beginPath();const ty=48+e.lick*16;c.ellipse(Math.sin(e.lt)*7,ty,10,6+e.lick*10,0,0,TAU);c.fill();c.stroke();c.strokeStyle='rgba(150,60,80,.5)';c.beginPath();c.moveTo(Math.sin(e.lt)*7,ty-4);c.lineTo(Math.sin(e.lt)*7,ty+6+e.lick*6);c.stroke();}
  c.restore();
}
function drawNose(c){
  c.beginPath();c.moveTo(-10,20);c.quadraticCurveTo(0,17,10,20);c.quadraticCurveTo(10,28,0,34);c.quadraticCurveTo(-10,28,-10,20);
  const g=c.createLinearGradient(0,18,0,34);g.addColorStop(0,'#7A6168');g.addColorStop(1,'#3B2C31');
  c.fillStyle=g;c.fill();c.strokeStyle='rgba(30,16,20,.6)';c.lineWidth=1.4;c.stroke();
  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(-3,22,3.4,1.8,-.2,0,TAU);c.fill();
}
function drawWhiskers(c,e,mirrorBlur){
  c.save();c.lineCap='round';
  const sp=e.wh;
  for(const s of[-1,1]){
    for(let i=0;i<3;i++){
      const x0=s*31,y0=41+i*4.5;
      const ex=s*(124+i*8+sp*16),ey=52+i*17-sp*12+(i-1)*sp*9;
      const cx=s*78,cy=y0+3+i*5-sp*4;
      c.strokeStyle='rgba(12,14,18,.28)';c.lineWidth=3;
      c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(cx,cy,ex,ey);c.stroke();
      c.strokeStyle='rgba(252,250,244,.95)';c.lineWidth=1.7;
      c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(cx,cy,ex,ey);c.stroke();
    }
    c.strokeStyle='rgba(252,250,244,.8)';c.lineWidth=1.5;
    for(let i=0;i<2;i++){c.beginPath();c.moveTo(s*(96+i*2),-26-i*8);c.quadraticCurveTo(s*(112+i*5),-40-i*9,s*(128+i*8),-38-i*10-sp*8);c.stroke();}
  }
  c.restore();
}
function drawHead(c,e,blink){
  blink=blink||0;
  c.save();c.rotate(e.hr||0);
  const pf=1+(e.puff||0)*.07;c.scale(pf,pf);
  drawEar(c,1,e);drawEar(c,-1,e);
  hpath(c);
  let g=c.createRadialGradient(0,-18,8,0,0,128);
  g.addColorStop(0,'#6B6F77');g.addColorStop(.55,K.slate);g.addColorStop(1,K.shade);
  c.fillStyle=g;c.fill();
  c.save();hpath(c);c.clip();
  // мягкий блик на лбу и шерстинки

const Liza={
  cur:mkExp('judge'),tgt:mkExp('judge'),base:'judge',hold:0,bt:2.4,bp:-1,look:null,
  reset(base){this.base=base||'judge';this.cur=mkExp(this.base);this.tgt=mkExp(this.base);this.hold=0;this.look=null;this.bp=-1;this.bt=rnd(1.5,3)},
  set(name,hold,extra,baseToo){this.tgt=mkExp(name,extra);if(baseToo)this.base=name;this.hold=hold||0;if(!hold)this.holdOn=false;else this.holdOn=true},
  update(dt){
    if(this.holdOn){this.hold-=dt;if(this.hold<=0){this.holdOn=false;this.tgt=mkExp(this.base)}}
    easeExp(this.cur,this.tgt,1-Math.exp(-dt*(REDUCED?30:13)));
    this.bt-=dt;if(this.bt<0&&this.bp<0){this.bp=0}
    if(this.bp>=0){this.bp+=dt;if(this.bp>.2){this.bp=-1;this.bt=rnd(2.2,5)}}
  },
  e(){const e=Object.assign({},this.cur);if(this.look){e.lx=this.look.x;e.ly=this.look.y}return e},
  blink(){return this.bp>=0?Math.sin(Math.PI*this.bp/.2):0}
};

    this.list=this.list.filter(p=>p.t<p.max)},

/* ---------- пузыри ---------- */
function wrapText(c,text,maxW){const words=text.split(' '),lines=[];let l='';for(const w of words){const t=l?l+' '+w:w;if(c.measureText(t).width>maxW&&l){lines.push(l);l=w}else l=t}if(l)lines.push(l);return lines}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
/* ax,ay — куда указывает хвостик; box над точкой */
function bubble(c,text,ax,ay,o){
  o=o||{};const kind=o.kind||'say',maxW=o.w||210,fs=o.fs||15;
  c.save();c.font=(kind==='swear'?'800 ':'600 ')+(kind==='swear'?fs+2:fs)+'px Manrope,system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';
  const lines=wrapText(c,text,maxW-24),lh=(kind==='swear'?fs+7:fs+5);
  let tw=0;lines.forEach(l=>tw=Math.max(tw,c.measureText(l).width));
  const w=tw+28,h=lines.length*lh+18;
  let x=ax-w/2;x=clamp(x,8,SW-w-8);let y=(o.below?ay+16:ay-h-16);y=clamp(y,(o.minY||6)+(kind==='swear'?14:0),SH-h-6);
  const cx=x+w/2,cy=y+h/2;
  if(kind==='swear'){
    const sh=REDUCED?0:Math.sin(T*50)*1.4;c.translate(sh,0);
    c.beginPath();const n=16,rx=w/2+12,ry=h/2+10;for(let i=0;i<n*2;i++){const a=i/(n*2)*TAU,k=i%2?.82:1.08;const px=cx+Math.cos(a)*rx*k,py=cy+Math.sin(a)*ry*k;i?c.lineTo(px,py):c.moveTo(px,py)}c.closePath();
    c.fillStyle='#fff3e4';c.fill();c.lineWidth=3;c.strokeStyle='#c0341d';c.lineJoin='round';c.stroke();c.fillStyle='#8f1f10';
  }else{
    c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=14;c.shadowOffsetY=4;
    rrect(c,x,y,w,h,16);c.fillStyle='#fbf3e6';c.fill();c.shadowColor='transparent';
    // хвостик
    const tx=clamp(ax,x+18,x+w-18);c.beginPath();if(o.below){c.moveTo(tx-9,y+1);c.lineTo(ax,ay+3);c.lineTo(tx+9,y+1)}else{c.moveTo(tx-9,y+h-1);c.lineTo(clamp(ax,x+6,x+w-6),y+h+13);c.lineTo(tx+9,y+h-1)}c.closePath();c.fill();
    c.fillStyle='#2b1f1c';
  }
  lines.forEach((l,i)=>c.fillText(l,cx,y+9+lh*(i+.5)+1));
  c.restore();return {x,y,w,h};
}

function endGame(g,score,label,th,lines,extra){
  const stars=score>=th[2]?3:score>=th[1]?2:score>=th[0]?1:0;
  const newBest=score>S.best[g.id];if(newBest)S.best[g.id]=score;
  S.stars[g.id]=Math.max(S.stars[g.id],stars);S.plays++;
  const gain=4+stars*5+(newBest&&score>0?3:0);S.mood=Math.min(100,S.mood+gain);saveS();
  g.state='done';ui.ctl(null);
  g.res={stars,score,label,newBest,gain,lineText:(lines[stars]||'')+(extra?' '+extra:'')};
  setTimeout(()=>{if(scene===g){ui.result(g.res);sChime(stars>=2);}},900);
}

}

function paintSeek(x,i,F,u){const R=SEEK[i];paintWall(x,F,R.wall[0],R.wall[1],R.floor[0],R.floor[1]);x.save();x.translate(0,F);x.scale(u,u);R.paint(x);x.restore();vign(x)}
Games.seek=baseGame({id:'seek',name:'Найди Лизу',title:'Найди <i>Лизу</i>',desc:'Она спит где-то в квартире',
  rule:'Лиза уснула где-то в квартире. Листай комнаты кнопками внизу и ищи серый калачик с белым кончиком хвоста. Нашла — нажми на неё. Время идёт!',
  F(){return Math.round(SH*.56)},u(){return SW/360},
  init(){this.rd=0;this.sc=0;this.room=0;this.phase='';this.found=0;this.msg='';this.msgT=0;this.used=[];this.sl=0;this.cat=null;this.rt=0;this.max=1;this.pen=0;this.zt=0;this.dx=null;this.swp=0},
  begin(){ui.ctl([{k:'l',t:'← Комната'},{k:'r',t:'Комната →'}],k=>this.turn(k==='l'?-1:1));this.round()},
  round(){this.rd++;if(this.rd>6){this.rd=6;this.finish();return}
    let all=[];SEEK.forEach((R,ri)=>R.spots.forEach((s,si)=>all.push({ri,si,s})));all=all.filter(a=>!this.used.includes(a.ri+'_'+a.si));
    let pool=this.rd<=2?all.filter(a=>a.s.easy):all.filter(a=>!a.s.easy);if(!pool.length)pool=all;
    const far=pool.filter(a=>a.ri!==this.room);if(this.rd>1&&far.length)pool=far;
    const a=pick(pool);this.used.push(a.ri+'_'+a.si);this.cat=Object.assign({room:a.ri},a.s);this.max=this.rt=Math.max(14,26-this.rd*2);this.phase='look';this.msg='';this.msgT=0;this.zt=0},
  finish(){this.state='ending';this.phase='end';endGame(this,this.sc,'очков',[50,85,115],['Лиза выспалась. Ты — нет.','Нашла, но не всех. То есть не все разы.','Хороший нюх на спящих кошек.','От тебя не спрячешься. Лиза подаёт жалобу.'],'Найдена: '+this.found+' из 6.')},
  turn(d){if(this.state!=='play'||this.phase!=='look')return;this.room=(this.room+d+3)%3;this.sl=1;sPop(1.1);vib(6)},
  scr(){const u=this.u(),F=this.F(),q=this.cat;return[q.x*u,F+(q.y-46*q.s)*u]},
  tap(px,py){if(this.state!=='play'||this.phase!=='look')return;const u=this.u(),F=this.F(),lx=px/u,ly=(py-F)/u,q=this.cat;
    if(q.room===this.room&&Math.abs(lx-q.x)<Math.max(36,112*q.s)&&ly>q.y-112*q.s-14&&ly<q.y+16){
      const pts=10+Math.ceil(this.rt);this.sc+=pts;this.found++;this.phase='found';this.pt=0;const p=this.scr();FX.text(p[0],Math.max(TOP+70,p[1]-60),'+'+pts,'#ffe27a',20);FX.star(p[0],p[1],'#ffe27a');for(let i=0;i<4;i++)FX.heart(p[0]+rnd(-24,24),p[1]-20,10);
      this.msg=pick(['Мя?! Я только уснула.','Нашла. Довольна? Я — нет.','Я не пряталась. Я спала. Это разное.','Ещё пять минут. Или часов.','Разбудила. Теперь корми.','Ты ходишь как слон. Я всё слышала.']);sMeow(2,1,.5);vib(22);return}
    if(this.pen<=0)for(const d of SEEK[this.room].decoys)if(Math.hypot(lx-d.x,ly-d.y)<d.r){this.rt=Math.max(.5,this.rt-3);this.pen=1;this.msg=d.msg+' −3 с';this.msgT=1.7;this.mx=px;this.my=py;sThump();vib(8);return}},
  down(x,y){this.dx=x;this.dy=y;this.swp=0},
  move(x,y){if(this.dx!=null&&!this.swp&&Math.abs(x-this.dx)>64){this.swp=1;this.turn(x<this.dx?1:-1)}},
  up(){if(this.dx!=null&&!this.swp)this.tap(this.dx,this.dy);this.dx=null},
  update(dt){
    this.sl=Math.max(0,this.sl-dt*4.5);this.msgT=Math.max(0,this.msgT-dt);this.pen=Math.max(0,this.pen-dt);
    if(this.state!=='play')return;
    if(this.phase==='look'){this.rt-=dt;
      if(this.rt<=0){this.phase='lost';this.pt=0;if(this.room!==this.cat.room){this.room=this.cat.room;this.sl=1}this.msg='Спала '+this.cat.where+'. Так и не нашли.';sGrumble()}
      else if(this.room===this.cat.room&&this.rt<this.max*.5){this.zt-=dt;if(this.zt<=0){this.zt=1.1;const p=this.scr();FX.z(p[0]-10,p[1]-14)}}}
    else if(this.phase==='found'){this.pt+=dt;if(this.pt>1.9)this.round()}
    else if(this.phase==='lost'){this.pt+=dt;if(this.pt>2.6)this.round()}
  },
  draw(c){
    if(this.state==='intro'||!this.cat){c.drawImage(roomCache('seek0',x=>paintSeek(x,0,this.F(),this.u())),0,0,SW,SH);return}
    const F=this.F(),u=this.u(),q=this.cat,r=this.room;c.drawImage(roomCache('seek'+r,x=>paintSeek(x,r,F,u)),0,0,SW,SH);
    if(q.room===r){c.save();c.translate(0,F);c.scale(u,u);c.save();c.translate(q.x,q.y);c.scale(q.f?-q.s:q.s,q.s);drawLizaSleep(c,{awake:this.phase==='found',ph:q.x});c.restore();
      if(q.cover&&this.phase!=='found')q.cover(c);c.restore();

    for(let i=0;i<3;i++){c.fillStyle=i===r?'#efb3c1':'rgba(243,236,224,.3)';c.beginPath();c.arc(SW/2+(i-1)*12,TOP+38,3,0,TAU);c.fill()}
    if(this.phase==='look'){let h='';if(this.rd===1&&this.rt>this.max-5)h='листай комнаты кнопками внизу';else if(this.rt<this.max*.45)h=this.room===q.room?'храп где-то совсем рядом…':'храп слышен со стороны '+SEEK[q.room].gen;
      if(h){c.font='italic 500 20px Cormorant Garamond,serif';c.fillStyle='rgba(243,236,224,.95)';c.shadowBlur=8;c.fillText(h,SW/2,SH-96)}}
    c.restore();
    if(this.phase==='look'&&this.msgT>0)bubble(c,this.msg,this.mx,this.my-10,{w:230,fs:14,minY:TOP+48});
    if(this.phase==='found'||this.phase==='lost'){const p=this.scr();bubble(c,this.msg,p[0],p[1]-50*Math.max(.8,q.s*2.4),{w:236,fs:14,minY:TOP+48})}
  }
});

function resize(){
  const r=stage.getBoundingClientRect();SW=Math.max(280,Math.round(r.width));SH=Math.max(360,Math.round(r.height));
  DPR=Math.min(3,Math.max(1,window.devicePixelRatio||1));
  cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);cv.style.width=SW+'px';cv.style.height=SH+'px';bgCache={};
  {const hb=document.getElementById("snd");TOP=hb?Math.round(hb.getBoundingClientRect().bottom)+8:60;}
}
let last=0,running=true,raf=0;
function frame(ts){
  raf=0;if(!running)return;
  const dt=Math.min(.05,(ts-last)/1000||0.016);last=ts;T+=dt;
  Liza.update(dt);FX.update(dt);
  if(scene&&scene.update)scene.update(dt);
  c.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0;if(shk>0&&!REDUCED){sx=rnd(-shk,shk);sy=rnd(-shk,shk);shk=Math.max(0,shk-dt*38)}else shk=0;
  c.save();c.translate(sx,sy);
  c.clearRect(-20,-20,SW+40,SH+40);
  if(scene&&scene.draw)scene.draw(c);
  c.restore();
  raf=requestAnimationFrame(frame);
}
function startLoop(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running){startLoop();if(scene===Back)Back.resume()}else{purrOff()}});

cv.addEventListener('pointermove',e=>{const p=pt(e);scene&&scene.move&&scene.move(p.x,p.y)});
const upH=e=>{scene&&scene.up&&scene.up()};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);cv.addEventListener('lostpointercapture',upH);
