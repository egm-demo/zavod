<style>
html,body{height:100%}
.z-app{height:100vh;height:100dvh;min-height:0;padding-bottom:calc(var(--safe-b) + 16px)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:4px 0 14px}
.head .z-h1{margin:0;font-size:46px}
.head .meta{margin-top:8px;min-height:13px;font-variant-numeric:tabular-nums}
.head .nav{display:flex;gap:2px;margin-right:-10px;padding-bottom:2px}
.head .nav .z-icon[disabled]{opacity:.28;pointer-events:none}
.pondbox{position:relative;flex:1;min-height:340px;border-radius:30px;overflow:hidden;background:#0c1719;touch-action:pan-y;
  box-shadow:0 24px 50px -22px rgba(0,0,0,.7),inset 0 0 0 1px rgba(243,236,224,.05)}
#pond{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;transition:opacity .35s var(--ease)}
#pond.fade{opacity:0}
.hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 36px;text-align:center;pointer-events:none;transition:opacity .6s}
.hint b{display:block;font:400 30px/1.1 var(--display);color:var(--ink);text-shadow:0 2px 18px rgba(5,12,14,.9);text-wrap:balance}
.hint b i{color:var(--accent)}
.hint span{display:block;margin-top:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2);text-shadow:0 1px 10px rgba(5,12,14,.95);text-wrap:pretty}
.hint.off{opacity:0}
.card{position:absolute;left:12px;right:12px;bottom:12px;padding:16px 18px 8px;border-radius:22px;background:rgba(14,27,30,.82);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(14px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card .row{display:flex;align-items:center;gap:12px;padding-right:44px}
.card .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 14px currentColor}
.card .date{font:500 23px/1.1 var(--display);color:var(--ink)}
.card .mood{margin-top:3px;font-size:13.5px;color:var(--ink-2)}
.card .note{margin:10px 0 0;font-size:15.5px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;max-height:7.5em;overflow:auto}
.card .note.empty{color:var(--ink-2);font-style:italic}
.card .x{position:absolute;top:6px;right:6px}
.card .acts{display:flex;justify-content:flex-end;gap:2px;margin:4px -8px 0}
.card .acts .z-btn{font-size:14px;min-height:44px}
.card .acts .warn{color:#e8a3ab}
.dock{padding-top:14px}
.sh-title{margin:0}
.sh-date{margin:6px 0 16px;color:var(--ink-2);font-size:14.5px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood-b{display:flex;flex-direction:column;align-items:center;gap:0;min-height:98px;padding:8px 4px 10px;border-radius:20px;background:var(--surface);
  color:var(--ink-2);font:500 14px/1 var(--text);transition:background .25s,color .25s,transform .2s var(--ease),box-shadow .25s}
.mood-b canvas{width:64px;height:64px;display:block;margin-bottom:2px}
.mood-b[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px rgba(239,179,193,.55)}
.mood-b:active{transform:scale(.96)}
.nl{display:flex;justify-content:space-between;margin:18px 2px 8px}
#note{min-height:84px}
.status{min-height:20px;margin:8px 0 0;font-size:14px;color:var(--ink-2);text-align:center}
.sheet-act{margin-top:12px}
.sum p{margin:0 0 10px;font-size:15.5px;line-height:1.55;color:var(--ink);text-wrap:pretty}
.sum p.soft{color:var(--ink-2);font-size:14.5px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:14px 0 12px;background:var(--surface-2);gap:2px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink-2);margin-bottom:14px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.foot{margin:20px 0 0;color:var(--ink-2);font-size:13.5px;line-height:1.5}
.z-toast{bottom:calc(var(--safe-b) + 92px);background:rgb(22,40,43);white-space:normal;text-align:center;max-width:calc(100% - 40px);width:max-content;border-radius:20px;line-height:1.4;text-wrap:balance}
</style>

  <header class="z-top">

<div class="z-scrim" id="scrim"></div>
<div class="z-sheet" id="shMark" role="dialog" aria-modal="true" aria-labelledby="ptitle">

  <div class="moods" id="moods"></div>
  <div class="nl"><label class="z-cap" for="note">Пара слов для себя — по желанию</label><span class="z-cap z-num" id="count">0 / 200</span></div>
  <textarea class="z-field" id="note" maxlength="200" placeholder="Например: долго гуляла у воды"></textarea>
  <div class="status" id="status" aria-live="polite"></div>
  <button class="z-btn wide sheet-act" id="save" type="button" disabled>Опустить в пруд</button>
</div>
<div class="z-sheet" id="shMenu" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <h2 class="z-h2" id="mtitle">Взгляд <i>со стороны</i></h2>
  <div class="sum" id="sumbody" style="margin-top:14px"></div>
  <p class="foot">Записи хранятся только на этом телефоне. Один день — одна кувшинка: светлые распускаются, грустные остаются бутоном.</p>
</div>
<div class="z-toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
var KEY='kuv_pond_entries';          // формат v1: {"YYYY-MM-DD":{m:moodId,n:note,t:timestamp}} — не менять
var KEY_MUTE='kuv_pond_v2_mute', KEY_SEEN='kuv_pond_v2_seen';
var MOODS=[
  {id:'light',  label:'Светло',   word:'светло',   color:'#f0b6c4'},
  {id:'calm',   label:'Спокойно', word:'спокойно', color:'#f1e8d8'},
  {id:'tired',  label:'Устала',   word:'устала',   color:'#d9b98c'},
  {id:'anxious',label:'Тревожно', word:'тревожно', color:'#a98bd0'},
  {id:'sad',    label:'Грустно',  word:'грустно',  color:'#86a9c6'},
  {id:'angry',  label:'Сержусь',  word:'сержусь',  color:'#b8414f'}
];
var MOOD={}; MOODS.forEach(function(m){MOOD[m.id]=m;});
var CFG={
  light:  {c1:'#fff0f4',c2:'#d9648a',open:1,   n:11,ni:8, L:17.5,w:5.4, core:'#ecc46a', glow:'rgba(240,182,196,.42)'},
  calm:   {c1:'#fffbf3',c2:'#b9ad95',open:.74, n:9, ni:6, L:15,  w:6.2, core:'#e6c470', glow:'rgba(246,239,228,.22)'},
  tired:  {c1:'#f2dcbb',c2:'#85644a',open:.36, n:7, ni:3, L:14.5,w:5.8, core:'#c2a05a', tilt:.75, sepal:true},
  anxious:{c1:'#e0d4f6',c2:'#58389a',open:.68, n:10,ni:6, L:15.5,w:4.2, core:'#d8bf6a', glow:'rgba(169,139,208,.24)'},
  sad:    {c1:'#d8e6f1',c2:'#4f7396',open:.07, n:6, ni:0, L:15,  w:5.6, sepal:true},
  angry:  {c1:'#e8737f',c2:'#52101c',open:.95, n:11,ni:7, L:16.5,w:3.9, core:'#f0a840', sharp:true, glow:'rgba(184,65,79,.3)'}
};
var MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var TAU=Math.PI*2;

function $(id){return document.getElementById(id);}
function pad2(n){return (n<10?'0':'')+n;}
function keyOf(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayKey(){return keyOf(new Date());}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function plural(n,a,b,c){var m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<12||m100>14))return b;return c;}
function nowT(){return performance.now()/1000;}
function easeOut(x){return 1-Math.pow(1-x,3);}
function easeBack(x){var c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}

function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');return (o&&typeof o==='object'&&!Array.isArray(o))?o:{};}catch(e){return {};}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(entries));}catch(e){}}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var entries=load();
var muted=lsGet(KEY_MUTE)==='1';

// ---------- звук (WebAudio, только после касания) ----------
var AC=null;
function audio(){
  if(muted)return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,t0,dur,vol,type,f2){
  var a=audio();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime+t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+dur);
  g.gain.setValueAtTime(0.0001,a.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol,a.currentTime+t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);
  o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.05);
}
function sndDrop(){tone(820,0,0.22,0.05,'sine',380);tone(1240,0.02,0.12,0.015,'sine',700);}
function sndBloom(){[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,i*0.11,1.6,0.04,'sine');tone(f*2,i*0.11,0.9,0.008,'sine');});}
function sndSoft(){tone(330,0,0.5,0.03,'sine',250);}
function buzz(n){if(!muted&&navigator.vibrate)try{navigator.vibrate(n||8);}catch(e){}}
function syncSnd(){
  var b=$('snd');
  b.innerHTML=muted?'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>'
    :'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></svg>';
  b.setAttribute('aria-label',muted?'Включить звук':'Выключить звук');
  b.classList.toggle('on',!muted);
}
$('snd').addEventListener('click',function(){muted=!muted;lsSet(KEY_MUTE,muted?'1':'0');syncSnd();if(!muted){sndDrop();}});

function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}

var now0=new Date();
var view={y:now0.getFullYear(),m:now0.getMonth()};
var selMood=null, born={}, openKey=null, delArm=false;

var cv=$('pond'),ctx=cv.getContext('2d'),box=$('pondbox');
var W=0,H=0,DPR=1,bg=null,raf=0;
var slots=[],stars=[],flies=[],ripples=[],parts=[],sprites={},cache=[];

function resize(){
  var w=box.clientWidth,h=box.clientHeight;
  if(w<100||h<100)return;
  DPR=Math.min(window.devicePixelRatio||1,3);
  W=w;H=h;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
  sprites={};
  buildLayout();buildStatic();
}
function buildLayout(){
  var r=rng(hashStr('pond-'+view.y+'-'+view.m));
  var pts=[],mx=0.14,my0=0.14,my1=0.88;
  for(var i=0;i<31;i++){
    var best=null,bs=-1;
    for(var k=0;k<160;k++){
      var x=mx+(1-2*mx)*r(),y=my0+(my1-my0)*r();
      var md=Math.hypot((x-0.78)*W,(y-0.16)*H*1.3);
      var sc=1e9;
      for(var j=0;j<pts.length;j++){var d=Math.hypot((x-pts[j].x)*W,(y-pts[j].y)*H*1.6);if(d<sc)sc=d;}
      if(md<60)sc=Math.min(sc,md*0.8);
      if(pts.length===0)sc=md+r()*30;
      if(sc>bs){bs=sc;best={x:x,y:y};}
    }
    best.rot=r()*TAU;best.ph=r()*TAU;best.v=Math.floor(r()*6);
    pts.push(best);
  }
  var base=Math.min(1.7,Math.max(1.3,W/260));
  slots=pts.map(function(p){return {x:p.x,y:p.y,s:(0.82+0.28*((p.y-my0)/(my1-my0)))*base,rot:p.rot,ph:p.ph,v:p.v};});
}

function hexRgb(h){var n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){var A=hexRgb(a),B=hexRgb(b);return 'rgb('+[0,1,2].map(function(i){return Math.round(A[i]+(B[i]-A[i])*t);}).join(',')+')';}

function petal(c,a,L,w,spread,lift,cfg,back,ys){
  var R=L*(0.22+0.78*spread);
  var bx=Math.cos(a)*1.4,by=Math.sin(a)*0.7;
  var tx=Math.cos(a)*R,ty=Math.sin(a)*R*ys-L*(1-spread)*0.95-lift;
  var dx=tx-bx,dy=ty-by,ln=Math.hypot(dx,dy)||1,px=-dy/ln,py=dx/ln;
  var sh=cfg.sharp;
  var w1=w*1.15,w2=w*(sh?0.55:0.95),km=sh?0.55:0.78;
  c.beginPath();
  c.moveTo(bx,by);
  c.bezierCurveTo(bx+dx*0.2+px*w1,by+dy*0.2+py*w1,bx+dx*km+px*w2,by+dy*km+py*w2,tx,ty);
  c.bezierCurveTo(bx+dx*km-px*w2,by+dy*km-py*w2,bx+dx*0.2-px*w1,by+dy*0.2-py*w1,bx,by);
  c.closePath();
  var g=c.createLinearGradient(bx,by,tx,ty);
  g.addColorStop(0,cfg.c2);g.addColorStop(0.5,mix(cfg.c2,cfg.c1,0.72));g.addColorStop(1,cfg.c1);
  c.fillStyle=g;c.fill();
  if(back){c.fillStyle='rgba(8,18,22,.3)';c.fill();}
  c.lineWidth=0.4;c.strokeStyle='rgba(20,8,24,.28)';c.stroke();
  c.beginPath();c.moveTo(bx+dx*0.12,by+dy*0.12);c.lineTo(bx+dx*0.86,by+dy*0.86);
  c.strokeStyle='rgba(255,255,255,'+(back?0.06:0.2)+')';c.lineWidth=0.5;c.stroke();
  if(!back){
    c.beginPath();c.moveTo(bx+dx*0.3+px*w*0.45,by+dy*0.3+py*w*0.45);
    c.quadraticCurveTo(bx+dx*0.62+px*w*0.62,by+dy*0.62+py*w*0.62,bx+dx*0.9+px*w*0.12,by+dy*0.9+py*w*0.12);
    c.strokeStyle='rgba(255,255,255,.14)';c.lineWidth=0.7;c.stroke();
  }
}
function drawLilyUnit(c,mood){
  var cfg=CFG[mood],i;
  if(cfg.tilt){c.translate(3,3);c.rotate(cfg.tilt);}
  if(cfg.glow){
    var gg=c.createRadialGradient(0,-3,1,0,-3,cfg.L*1.9);
    gg.addColorStop(0,cfg.glow);gg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=gg;c.beginPath();c.arc(0,-3,cfg.L*1.9,0,TAU);c.fill();
  }
  c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(0.8,1.8,cfg.L*0.8,cfg.L*0.32,0,0,TAU);c.fill();
  var ys=0.48;
  if(cfg.sepal){
    var sc={c1:'#86b680',c2:'#2b4d33'};
    [0.4,2.0,3.6,5.2].forEach(function(a){petal(c,a,cfg.L*0.64,3.6,0.55,0,sc,Math.sin(a)<0,ys);});
  }
  var outer=[];
  for(i=0;i<cfg.n;i++)outer.push(i*TAU/cfg.n+0.2);
  outer.sort(function(a,b){return Math.sin(a)-Math.sin(b);});
  outer.forEach(function(a){
    var droop=cfg.tilt&&Math.sin(a)>0?-2:0;
    petal(c,a,cfg.L,cfg.w,cfg.open,droop,cfg,Math.sin(a)<0,ys);
  });
  if(cfg.ni){
    var mid=[];for(i=0;i<cfg.ni;i++)mid.push(i*TAU/cfg.ni+0.55);
    mid.sort(function(a,b){return Math.sin(a)-Math.sin(b);});
    mid.forEach(function(a){petal(c,a,cfg.L*0.78,cfg.w*0.92,cfg.open*0.58,1.8,cfg,Math.sin(a)<0,ys);});
    var inn=[];for(i=0;i<5;i++)inn.push(i*TAU/5+0.2);
    inn.sort(function(a,b){return Math.sin(a)-Math.sin(b);});
    inn.forEach(function(a){petal(c,a,cfg.L*0.5,cfg.w*0.7,cfg.open*0.3,3.4,cfg,Math.sin(a)<0,ys);});
  }
  if(cfg.core&&cfg.open>0.3){
    var cg=c.createRadialGradient(0,-3,0.3,0,-3,4.6);

function frame(ms){
  raf=0;
  if(document.hidden||!bg)return;
  var t=ms/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(bg,0,0,W,H);
  var i;
  for(i=0;i<stars.length;i++){
    var st=stars[i],a=st.a*(reduce?1:(0.6+0.4*Math.sin(t*1.3+st.p)));
    ctx.fillStyle='rgba(230,236,240,'+a.toFixed(3)+')';
    ctx.beginPath();ctx.arc(st.x*W,st.y*H,st.sz*0.6,0,TAU);ctx.fill();
  }
  var mxp=W*0.78,myp=H*0.15,mr=Math.min(W,H)*0.07;
  for(var k=0;k<7;k++){
    var ty=myp+mr*1.6+k*mr*0.85,tw=mr*(1.7-k*0.2);
    var o2=reduce?0:Math.sin(t*0.9+k*1.3)*mr*0.3;
    var ga=(0.24-k*0.03)*(reduce?1:(0.7+0.3*Math.sin(t*1.7+k*2.1)));
    var gl=ctx.createLinearGradient(mxp-tw/2+o2,0,mxp+tw/2+o2,0);
    gl.addColorStop(0,'rgba(246,239,228,0)');gl.addColorStop(0.5,'rgba(246,239,228,'+Math.max(0,ga).toFixed(3)+')');gl.addColorStop(1,'rgba(246,239,228,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.ellipse(mxp+o2,ty,tw/2,1.2,0,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation='lighter';

    ctx.strokeStyle='rgba(150,200,205,'+(0.03+0.018*Math.sin(l*1.7+t*0.5)).toFixed(3)+')';
    ctx.beginPath();ctx.moveTo(0,ly);
    var stp=Math.max(10,W/10);
    for(var xx=0;xx<=W+stp;xx+=stp)ctx.lineTo(xx,ly+Math.sin(xx*0.025+l*1.3+t*0.45)*2.4+Math.sin(xx*0.06-t*0.3+l)*1.1);
    ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';

  var items=monthEntries();
  cache=[];
  var tk=todayKey();
  var list=items.map(function(it){return {day:it.day,key:it.key,mood:it.e.m};});
  if(isCurView()&&!entries[tk])list.push({day:new Date().getDate(),key:null,mood:null});
  list.sort(function(a,b){return slots[a.day-1].y-slots[b.day-1].y;});

      ctx.globalAlpha=0.7;ctx.drawImage(pd0.c,p.x-pd0.ox,p.y-pd0.oy,pd0.w,pd0.w);ctx.globalAlpha=1;
      var br=reduce?0.5:(0.5+0.5*Math.sin(t*1.6));

      ctx.beginPath();ctx.ellipse(p.x,p.y,(30+4*br)*p.s,(14+2*br)*p.s,0,0,TAU);ctx.stroke();
      var gl2=ctx.createRadialGradient(p.x,p.y-4*p.s,0,p.x,p.y-4*p.s,16*p.s);
      gl2.addColorStop(0,'rgba(239,179,193,'+(0.2+0.2*br).toFixed(3)+')');gl2.addColorStop(1,'rgba(239,179,193,0)');
      ctx.fillStyle=gl2;ctx.beginPath();ctx.arc(p.x,p.y-4*p.s,16*p.s,0,TAU);ctx.fill();

      var lr=lastRip[it.key]||0;

    ctx.beginPath();ctx.ellipse(p.x+2,p.y+4,25*p.s*grow,11*p.s*grow,0,0,TAU);ctx.fill();
    var pd=sprite('pad',Math.floor(sl.rot/0.785),p.s,sl.v);
    ctx.globalAlpha=Math.min(1,raw*1.5);
    ctx.drawImage(pd.c,p.x-pd.ox*grow,p.y-pd.oy*grow,pd.w*grow,pd.w*grow);
    var fl=sprite('lily',it.mood,p.s);

    ctx.globalAlpha=Math.min(1,raw*1.3);

var down=null;

  if(!down)return;
  var dx=ev.clientX-down.x,dy=ev.clientY-down.y;down=null;
  if(Math.abs(dx)>60&&Math.abs(dy)<45){
    if(dx>0&&!$('prev').disabled)step(-1);
    else if(dx<0&&!$('next').disabled)step(1);
    return;
  }
  if(Math.abs(dx)>12||Math.abs(dy)>12)return;
  var rc=cv.getBoundingClientRect(),x=ev.clientX-rc.left,y=ev.clientY-rc.top;
  var best=null,bd=1e9;
  for(var i=0;i<cache.length;i++){
    var c=cache[i],d=Math.hypot(x-c.x,(y-c.y+6)*1.6);
    if(d<Math.max(34*c.s,30)&&d<bd){bd=d;best=c;}
  }
  addRipple(best?best.x:x,best?best.y:y,best?50*best.s:42,0.42);
  buzz(6);
  if(best&&best.key){sndDrop();showCard(best.key);}

  else{sndSoft();hideCard();}
});

    renderAll(true);bloomAll();
    cv.classList.remove('fade');
  },reduce?0:180);
}
function bloomAll(){
  var t=nowT(),items=monthEntries().sort(function(a,b){return a.day-b.day;});
  items.forEach(function(it,i){born[it.key]=t+0.1+i*0.07;});
}
$('prev').addEventListener('click',function(){step(-1);});
$('next').addEventListener('click',function(){step(1);});

var LINES={
  light:'Чаще всего было светло. Похоже, рядом было что-то, что держало на плаву, — это стоит запомнить.',
  calm:'Больше всего было спокойных дней. Тихая вода — тоже хорошая погода.',
  tired:'Чаще всего встречалась усталость. Видимо, месяц был нагруженным, и отдых здесь — не каприз, а часть дела.',
  anxious:'Чаще всего было тревожно. Вода в этом месяце была неспокойной — это не про вас, это про волны вокруг.',
  sad:'Грусти было немало. Ей тоже есть место в пруду: бутоны иногда раскрываются позже.',
  angry:'Чаще всего было сердито. Значит, что-то задевало по-настоящему — это бывает важной подсказкой.'
};
var SECOND={light:'светлых дней',calm:'спокойных дней',tired:'усталости',anxious:'тревоги',sad:'грусти',angry:'сердитых дней'};
var HEAVY={tired:1,anxious:1,sad:1,angry:1};
function renderSummary(items){
  var el=$('sumbody');el.innerHTML='';
  function p(txt,cls){var e=document.createElement('p');e.textContent=txt;if(cls)e.className=cls;el.appendChild(e);}
  var cur=new Date(),isCur=isCurView();
  var lab=MONTHS[view.m]+(view.y!==cur.getFullYear()?' '+view.y:'');
  if(!items.length){
    p(isCur?'Когда на воде появится несколько кувшинок, здесь будет короткий взгляд со стороны: каких дней в месяце было больше.':'В этом месяце пруд отдыхал.','soft');
    return;
  }
  var cnt={};MOODS.forEach(function(m){cnt[m.id]=0;});
  items.forEach(function(i){cnt[i.e.m]++;});
  var bar=document.createElement('div');bar.className='bar';
  var leg=document.createElement('div');leg.className='legend';
  MOODS.forEach(function(m){
    if(!cnt[m.id])return;
    var s=document.createElement('span');s.style.width=(cnt[m.id]/items.length*100)+'%';s.style.background=m.color;bar.appendChild(s);
    var l=document.createElement('span');var ii=document.createElement('i');ii.style.background=m.color;l.appendChild(ii);
    l.appendChild(document.createTextNode(m.word+' — '+cnt[m.id]));leg.appendChild(l);
  });
  var days=isCur?cur.getDate():new Date(view.y,view.m+1,0).getDate(),n=items.length;
  p(lab.charAt(0).toUpperCase()+lab.slice(1)+': на воде '+n+' '+plural(n,'кувшинка','кувшинки','кувшинок')+' из '+days+' '+plural(days,'дня','дней','дней')+(isCur?' этого месяца.':'.'),'soft');
  el.appendChild(bar);el.appendChild(leg);
  if(n<3){p('Пока цветов немного — картина сложится чуть позже. Каждая отметка уже что-то говорит.');return;}
  var order=MOODS.slice().sort(function(a,b){return cnt[b.id]-cnt[a.id];});
  var top=order[0],sec=order[1],third=order[2];
  var clear=cnt[top.id]>=cnt[sec.id]+2||(cnt[top.id]>cnt[sec.id]&&cnt[top.id]/n>=0.4);
  if(!clear){
    var tied=order.filter(function(m){return cnt[m.id]>0&&cnt[m.id]>=cnt[top.id]-1;});
    if(tied.length>=4)p('Месяц получился очень разным: были и светлые дни, и непростые, примерно поровну. Так бывает у живой воды.');
    else p('Месяц получился разным: примерно поровну было '+tied.map(function(m){return SECOND[m.id];}).join(tied.length>2?', ':' и ').replace(/, ([^,]*)$/,' и $1')+'.');
  }else{
    p(LINES[top.id]);
    if(cnt[sec.id]>=2&&cnt[sec.id]>cnt[third.id])p('На втором месте — '+SECOND[sec.id]+'.','soft');
  }
  if(n>=6){
    var sorted=items.slice().sort(function(a,b){return a.day-b.day;});
    var h=Math.floor(n/2),a1=0,a2=0;
    sorted.forEach(function(it,i){if(HEAVY[it.e.m]){if(i<h)a1++;else a2++;}});
    var r1=a1/h,r2=a2/(n-h);
    if(r2-r1>0.25)p('Ко второй половине месяца стало тяжелее. Может быть, стоит оставить себе немного тишины.','soft');
    else if(r1-r2>0.25)p('Ко второй половине месяца вода стала светлее.','soft');
    else p('От начала к концу месяца погода на воде почти не менялась.','soft');
  }
}

function renderAll(relayout){
  var cur=new Date();
  var name=MONTHS[view.m];name=name.charAt(0).toUpperCase()+name.slice(1);
  $('mlabel').innerHTML=name+(view.y!==cur.getFullYear()?' <i>'+view.y+'</i>':'');
  $('next').disabled=cmp(view,{y:cur.getFullYear(),m:cur.getMonth()})>=0;
  $('prev').disabled=cmp(view,minMonth())<=0;
  if(relayout)buildLayout();
  var items=monthEntries(),isCur=isCurView(),n=items.length;
  $('meta').textContent=n?(n+' '+plural(n,'кувшинка','кувшинки','кувшинок')):(isCur?'на воде пока тихо':'пруд отдыхал');
  var hint=$('hint'),hasAny=Object.keys(entries).length>0;
  if(!n&&isCur){
    hint.innerHTML=hasAny?'<b>В этом месяце <i>ещё тихо</i></b><span>Коснитесь светлого круга на воде — и появится первая кувшинка месяца.</span>'
      :'<b>Пруд <i>ждёт</i> первый цветок</b><span>Коснитесь светлого круга на воде и отметьте, как прошёл день. Светлые дни распускаются, грустные остаются бутоном.</span>';
    hint.style.top='38%';hint.classList.remove('off');
  }else if(!n){
    hint.innerHTML='<b>Здесь пруд <i>отдыхал</i></b>';hint.style.top='50%';hint.classList.remove('off');
  }else hint.classList.add('off');
  var mk=$('mark'),has=!!entries[todayKey()];
  if(isCur){mk.textContent=has?'Изменить сегодняшний цветок':'Как прошёл день?';mk.className='z-btn wide'+(has?' ghost':'');}
  else{mk.textContent='К этому месяцу';mk.className='z-btn wide ghost';}
  syncPicker();
  kick();
}

buildMoods();syncSnd();
var te0=entries[todayKey()];if(te0){selMood=te0.m;$('note').value=te0.n||'';}
var rz;
function rs(){clearTimeout(rz);rz=setTimeout(function(){resize();kick();},80);}
window.addEventListener('resize',rs);
if(window.ResizeObserver)new ResizeObserver(rs).observe(box);
resize();renderAll();kick();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(rs);
if(!lsGet(KEY_SEEN)){
  lsSet(KEY_SEEN,'1');
  if(Object.keys(entries).length)setTimeout(function(){toast('Пруд стал живее. Коснитесь любого цветка.');},1400);
}
})();
</script>
