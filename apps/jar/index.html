<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b161a">
<title>Банка светлячков</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../assets/ui.css">
<style>
html,body{height:100%}
body{overflow:hidden;background:#07110e}
#scene,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#scene{z-index:0}
#fx{z-index:30;pointer-events:none}
.z-app{position:relative;z-index:1;height:100vh;height:100dvh;min-height:0}
.z-top{position:relative;z-index:2}
.z-top .z-title{position:absolute;left:100px;right:100px;text-align:center;top:50%;transform:translateY(-50%);pointer-events:none;font:500 15px/1.2 var(--text);color:var(--ink);font-variant-numeric:tabular-nums}
#soundBtn{margin-left:auto}
.z-sheet *,.paper *,.z-sheet,.paper{font-variant-numeric:lining-nums}
#jarSlot{flex:1 1 auto;min-height:200px;position:relative;margin-bottom:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;outline-offset:-6px}
#hint{position:absolute;left:0;right:0;top:4px;text-align:center;font:italic 400 22px/1.25 var(--display);color:var(--ink);
  text-shadow:0 2px 18px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity 1.2s var(--ease);text-wrap:balance;padding:0 10px;white-space:pre-line}
#hint.on{opacity:.95}

.composer{position:relative;z-index:2;flex:none;padding-top:6px}
.composer::before{content:"";position:absolute;left:-20px;right:-20px;top:-30px;bottom:-30px;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,17,14,0),rgba(7,17,14,.72) 38%,rgba(7,17,14,.88))}
#promptLine{display:block;font:italic 400 24px/1.2 var(--display);color:var(--ink);margin:0 0 10px;min-height:28px;transition:opacity .25s;text-wrap:balance}
.compose{display:flex;gap:8px;align-items:flex-end}
#note{flex:1;min-width:0;height:52px;max-height:104px;padding:14px 16px;overflow-y:auto;background:rgba(243,236,224,.06);line-height:1.4}
#addBtn{flex:none;padding:0 20px}
.acts{display:flex;justify-content:space-between;gap:6px;margin-top:6px}
.acts{gap:8px}
.acts .z-btn{white-space:nowrap}
@media (max-width:380px){.acts .z-btn.quiet{font-size:13px;padding:0 6px;gap:6px}}
.acts .z-btn.quiet{flex:1;min-height:46px;font:500 14px/1 var(--text);color:var(--ink);padding:0 10px;background:rgba(243,236,224,.06);border-radius:999px}
.acts .z-btn.quiet.main{background:rgba(232,199,122,.12)}
.acts .z-btn.quiet svg{width:18px;height:18px}
.acts .dotg{width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow);flex:none}
.shake-note{text-align:center;font-size:12px;color:var(--ink-3);margin:2px 0 0}

.card-wrap{position:fixed;inset:0;z-index:52;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 20px);opacity:0;pointer-events:none;transition:opacity .35s}
.card-wrap.on{opacity:1;pointer-events:auto}
.paper{position:relative;width:min(340px,100%);padding:26px 24px 20px;border-radius:12px;color:#2a2320;
  background:linear-gradient(172deg,#fbf5e8 0%,#f1e6d0 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -1px 0 rgba(120,90,60,.12) inset,0 24px 60px rgba(0,0,0,.55),0 0 90px rgba(233,199,122,.28);
  transform:translateY(30px) scale(.9);opacity:0;transition:transform .7s var(--ease),opacity .5s}
.card-wrap.on .paper{transform:none;opacity:1}
.paper .pq{font:italic 500 17px/1.3 var(--display);color:#6b5a4c;margin:0 0 10px;text-wrap:balance}
.paper .pdate{font:600 11px/1.2 var(--text);letter-spacing:.14em;text-transform:uppercase;color:#8a6a2a;margin:0 0 12px}
.paper .ptitle{font:500 26px/1.1 var(--display);color:#2a1838;margin:0 0 8px}
.paper .ptext{font:500 27px/1.22 var(--display);margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:42vh;overflow:auto;text-wrap:pretty}
.paper .pfrom{font:italic 500 20px/1.2 var(--display);text-align:right;color:#5b3f7a;margin-top:12px;min-height:4px}
.card-btns{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:22px;
  opacity:0;transform:translateY(10px);transition:all .6s var(--ease) .25s}
.card-wrap.on .card-btns{opacity:1;transform:none}
.card-btns .z-btn.quiet{color:var(--ink-2)}
.halo{position:absolute;left:50%;top:50%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(233,199,122,.35),rgba(233,199,122,0));opacity:0;transform:scale(.4);z-index:-1}
.card-wrap.on .halo{animation:halo 1.6s var(--ease) both}
@keyframes halo{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:.7;transform:scale(1.15)}}

.z-sheet h2{font:400 30px/1.1 var(--display);margin:0 0 4px}
.z-sheet h2 i{font-style:italic;color:var(--accent)}
.sheet-lead{color:var(--ink-2);font-size:14px;line-height:1.5;margin:0 0 14px;text-wrap:pretty}
.stats{display:flex;gap:22px;margin:12px 0 4px}
.stats div{display:flex;flex-direction:column;gap:4px}
.stats b{font:400 34px/1 var(--display);font-variant-numeric:tabular-nums}
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-head{margin-top:14px}
.cal-head span{text-align:center;padding:6px 0}
.cal-box{max-height:230px;overflow-y:auto;overflow-x:hidden;margin:0 -6px;padding:0 6px;scrollbar-width:none}
.cal-box::-webkit-scrollbar{display:none}
.cal .mon{grid-column:1/-1;padding:12px 2px 4px}
.cal-d{height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);
  font:500 15px/1 var(--text);font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.cal-d.has{color:var(--ink)}
.cal-d.sel{background:var(--surface-2);color:var(--ink)}
.cal-d.today{color:var(--accent)}
.cal-d.void{visibility:hidden;pointer-events:none}
.cal-d .dts{display:flex;gap:2px;height:5px;align-items:center}
.cal-d .dts i{width:4px;height:4px;border-radius:50%;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.cal-d .dts b{font:600 9px/1 var(--text);color:var(--glow)}
.daybox{margin-top:14px;padding-top:6px;border-top:1px solid var(--line);min-height:70px}
.daybox h3{font:500 22px/1.2 var(--display);margin:6px 0 2px}
.daylist{list-style:none;margin:0;padding:0}
.daylist li{padding:12px 0;border-top:1px solid var(--line);font:500 21px/1.25 var(--display);white-space:pre-wrap;overflow-wrap:anywhere}
.daylist li:first-child{border-top:0}
.daylist li small{display:block;font:400 12px/1.4 var(--text);color:var(--ink-2);margin-top:3px}
.daylist .none{font:400 14px/1.5 var(--text);color:var(--ink-2)}
.sheet-acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.counter{font-size:12px;color:var(--ink-3);text-align:right;margin:4px 2px 0;font-variant-numeric:tabular-nums}
#giftText{height:104px;display:block}
#giftFrom{margin-top:8px}
#linkBox{display:none;margin-top:16px}
#linkBox.show{display:block}
#linkOut{font-size:13px;color:var(--ink-2)}
.row2{display:flex;gap:8px;margin-top:10px}
.row2>*{flex:1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.z-toast{max-width:calc(100% - 32px);white-space:normal;text-align:center;width:max-content}
@media (max-height:700px){#promptLine{font-size:20px;margin-bottom:8px}}
</style>

</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="z-app" id="app">
  <header class="z-top">
    <a class="z-icon" href="../../index.html" aria-label="Все приложения"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></a>
    <div class="z-title" id="title">Банка светлячков</div>
    <button class="z-icon" id="soundBtn" aria-label="Звук"></button>
    <button class="z-icon" id="menuBtn" aria-label="Дни и записки"><svg viewBox="0 0 24 24"><rect x="4.5" y="5.5" width="15" height="14" rx="3"/><path d="M4.5 10h15M9 3.8v3.4M15 3.8v3.4"/></svg></button>
  </header>

  <div id="jarSlot" role="button" tabindex="0" aria-label="Банка. Нажми, чтобы достать светлячка"><div id="hint"></div></div>

  <section class="composer">
    <label for="note" id="promptLine">Что хорошего было сегодня?</label>
    <div class="compose">
      <textarea class="z-field" id="note" maxlength="280" rows="1" placeholder="Что-то маленькое…"></textarea>
      <button class="z-btn" id="addBtn">В банку</button>
    </div>
    <div class="acts">
      <button class="z-btn quiet" id="hintBtn"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 0 1 12-4.9L19 9M19 4v5h-5M19 12a7 7 0 0 1-12 4.9L5 15M5 20v-5h5"/></svg>Другой вопрос</button>
      <button class="z-btn quiet main" id="pullBtn"><span class="dotg"></span>Достать светлячка</button>
    </div>
    <p class="shake-note" id="shakeNote" hidden>Можно просто встряхнуть телефон</p>
  </section>
</div>

<div class="z-scrim" id="scrim"></div>

<div class="card-wrap" id="card" role="dialog" aria-modal="true" aria-label="Записка">
  <div class="paper" id="paper">
    <div class="halo"></div>
    <h2 class="ptitle" id="cTitle" hidden></h2>
    <p class="pq" id="cQ" hidden></p>
    <div class="pdate" id="cDate"></div>
    <p class="ptext" id="cText"></p>
    <div class="pfrom" id="cFrom"></div>
  </div>
  <div class="card-btns">
    <button class="z-btn" id="cMain">Вернуть в банку</button>
    <button class="z-btn quiet" id="cSub">Отпустить насовсем</button>
  </div>
</div>

<div class="z-sheet" id="menuSheet" role="dialog" aria-modal="true" aria-label="Дни и записки">
  <h2>Твои <i>светлячки</i></h2>
  <div class="stats" id="stats"></div>
  <div class="cal-head z-cap" id="calHead"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
  <div class="cal-box" id="calBox"><div class="cal" id="cal"></div></div>
  <div class="daybox" id="dayBox"></div>
  <div class="sheet-acts">
    <button class="z-btn ghost wide" id="giftBtn">Записка для мамы</button>
    <button class="z-btn quiet wide" id="shakeBtn" hidden>Включить встряхивание телефона</button>
  </div>
</div>

<div class="z-sheet" id="giftSheet" role="dialog" aria-modal="true" aria-label="Записка для мамы">
  <h2>Записка <i>для мамы</i></h2>
  <p class="sheet-lead">Напиши тёплые слова и отправь ссылку. Когда мама её откроет, к ней прилетит светлячок с твоей запиской, и она сможет положить его в свою банку.</p>
  <label class="vh" for="giftText">Текст записки</label>
  <textarea class="z-field" id="giftText" maxlength="200" placeholder="Например: спасибо, что ты всегда меня слушаешь"></textarea>
  <div class="counter" id="giftCount">0 / 200</div>
  <label class="vh" for="giftFrom">Подпись</label>
  <input class="z-field" id="giftFrom" maxlength="30" placeholder="Подпись, например: твой сын" autocomplete="off">
  <div class="sheet-acts"><button class="z-btn wide" id="makeLink">Сделать ссылку</button></div>
  <div id="linkBox">
    <label class="vh" for="linkOut">Ссылка</label>
    <input class="z-field" id="linkOut" readonly>
    <div class="row2">
      <button class="z-btn ghost" id="copyLink">Скопировать</button>
      <button class="z-btn ghost" id="shareLink">Поделиться</button>
    </div>
  </div>
  <div class="sheet-acts"><button class="z-btn quiet wide" id="giftClose">Закрыть</button></div>
</div>

<div class="z-toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const LS = 'kuv_jar_';
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- storage (ключи и формат как в v1) ---------- */
function load(k, d){ try{ const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(LS + k, JSON.stringify(v)); }catch(e){} }
function pad(n){ return String(n).padStart(2,'0'); }
function dkey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
const todayKey = () => dkey(new Date());
function parseKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
let notes = load('notes', []);
if (!Array.isArray(notes)) notes = [];
notes = notes.filter(n => n && typeof n === 'object' && typeof n.text === 'string');
notes.forEach(n => {
  if (!n.id) n.id = 'm' + Math.random().toString(36).slice(2, 9);
  if (!n.ts) n.ts = Date.now();
  if (!/^\d{4}-\d\d-\d\d$/.test(n.date || '')) n.date = dkey(new Date(+n.ts));
});
let accepted = load('gifts', []); if (!Array.isArray(accepted)) accepted = [];
let soundOn = load('sound', true);
let recent = load('recent', []); if (!Array.isArray(recent)) recent = [];
const seen = load('v2_seen', false);

/* ---------- даты и слова ---------- */
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function human(k){
  const d = parseKey(k), now = new Date();
  const diff = Math.round((parseKey(todayKey()) - d) / 864e5);
  let s = d.getDate() + ' ' + MONTHS[d.getMonth()];
  if (d.getFullYear() !== now.getFullYear()) s += ' ' + d.getFullYear();
  if (diff === 0) return 'сегодня, ' + s;
  if (diff === 1) return 'вчера, ' + s;
  return s;
}
function plural(n, a, b, c){ const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b; return c; }

const PROMPTS = [
'Что сегодня было вкусным?','Кто сегодня улыбнулся тебе?','Какой звук сегодня был приятным?',
'Что сегодня получилось, пусть даже немного?','Где сегодня было красиво?','Что тебя сегодня рассмешило?',
'Какой момент сегодня хотелось бы задержать?','За что ты можешь себя сегодня похвалить?',
'Что сегодня было тёплым: чай, погода, слова?','Кто сегодня тебе написал или позвонил?',
'Что ты сегодня узнала нового?','Какой цвет сегодня попался на глаза?','Что сегодня было мягким и уютным?',
'Какая мысль сегодня порадовала?','Что сегодня приятно пахло?','Что сегодня случилось без спешки?',
'Кому ты сегодня помогла?','Что сегодня прошло лучше, чем ты думала?','Какая мелочь дома сегодня порадовала?',
'Что красивого было сегодня в небе?','Какую музыку сегодня было приятно слышать?','Что сегодня было в первый раз?',
'Какой разговор сегодня был хорошим?','Какая минута сегодня была спокойной?','Что ты сегодня сделала только для себя?',
'Какое растение или животное тебе сегодня встретилось?','Что смешного сегодня сказали близкие?',
'Какое дело ты сегодня закончила?','Что ты сегодня разрешила себе отложить?','Что тебя сегодня удивило?',
'Какой момент дня был самым тихим?','Что ты сегодня увидела из окна?','Чем было приятно сегодня заниматься руками?',
'Какое слово или фраза сегодня запомнились?','Что сегодня было немного похоже на весну?','Кого ты сегодня вспомнила с теплом?',
'Что красивого было по дороге?','Как ты сегодня позаботилась о себе?','Что сегодня оказалось проще, чем казалось?',
'Чего приятного ты ждёшь завтра?'
];
const DEFAULT_PROMPT = 'Что хорошего было сегодня?';
let currentPrompt = DEFAULT_PROMPT;
let promptBag = [];

/* ---------- звук: колокольчики с мягкой «комнатой», только после касания ---------- */
let actx = null, master = null, verb = null, userActed = false;
addEventListener('pointerdown', () => { userActed = true; }, {capture:true});
addEventListener('keydown', () => { userActed = true; }, {capture:true});
function audio(){
  if (!soundOn || !userActed) return null;
  try{
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      actx = new AC();
      const comp = actx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
      master = actx.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(actx.destination);
      const len = Math.floor(actx.sampleRate * 2.4), buf = actx.createBuffer(2, len, actx.sampleRate);
      for (let ch = 0; ch < 2; ch++){ const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 3.2); }
      verb = actx.createConvolver(); verb.buffer = buf;
      const wet = actx.createGain(); wet.gain.value = .5; verb.connect(wet); wet.connect(master);
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function bell(f, t, vol, dur){
  [[1, 1, dur], [2.76, .22, dur*.45], [5.4, .07, dur*.2]].forEach(([m, a, d]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f * m;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol * a, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master); g.connect(verb); o.start(t); o.stop(t + d + .05);
  });
}
function chime(kind){
  if (!audio()) return;
  const sets = { in:[784,988,1175,1568], out:[1568,1175,988,784], gift:[659,880,988,1319,1760], soft:[880,1320], tap:[1175] };
  const fr = sets[kind] || sets.soft, t0 = actx.currentTime + 0.02;
  fr.forEach((f, i) => bell(f, t0 + i * 0.11, kind === 'tap' ? .035 : .06, 1.9));
}
function vib(ms){ if (soundOn) try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>';
function renderSound(){ const b = $('soundBtn'); b.innerHTML = soundOn ? ICON_ON : ICON_OFF; b.setAttribute('aria-label', soundOn ? 'Выключить звук' : 'Включить звук'); }
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; save('sound', soundOn); renderSound(); if (soundOn){ userActed = true; chime('soft'); } });

let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3000); }

/* ---------- canvas ---------- */
const sc = $('scene'), sctx = sc.getContext('2d');
const fx = $('fx'), fctx = fx.getContext('2d');
let W = 0, H = 0, DPR = 1;
let jar = null, bg = null;
let stars = [], reeds = [], blades = [], wild = [], ripples = [], mists = [], sparkles = [];
let wob = 0, wobV = 0;

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function spriteCanvas(size, stops){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), h = size/2, r = g.createRadialGradient(h,h,0,h,h,h);
  stops.forEach(([o, col]) => r.addColorStop(o, col)); g.fillStyle = r; g.fillRect(0,0,size,size); return c;
}
const glow = spriteCanvas(96, [[0,'rgba(255,248,205,1)'],[.08,'rgba(252,232,158,.95)'],[.2,'rgba(240,205,110,.42)'],[.5,'rgba(233,196,106,.1)'],[1,'rgba(233,196,106,0)']]);
const mistSp = spriteCanvas(128, [[0,'rgba(170,200,205,.55)'],[.5,'rgba(120,160,170,.18)'],[1,'rgba(120,160,170,0)']]);

function layout(){
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  for (const c of [sc, fx]){ c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  const s = $('jarSlot').getBoundingClientRect();
  let h = Math.min(s.height * 0.94, 540);
  let w = h * 0.72;
  if (w > s.width * 0.84){ w = s.width * 0.84; h = w / 0.72; }
  const x = s.left + (s.width - w) / 2, y = s.bottom - h - Math.max(4, s.height * 0.02);
  jar = { x, y, w, h, cx: x + w/2, m: w * 0.29,
    neck: y + h*0.12, shoulder: y + h*0.25, bottom: y + h, r: w*0.17,
    inner: { x: x + w*0.1, y: y + h*0.3, w: w*0.8, h: h*0.62 },
    mouth: { x: x + w/2, y: y + h*0.02 }, slot: s };
  buildBg(); initWild(); initMist();
}

function jarPath(c, inset){
  const j = jar, i = inset || 0, x = j.x + i, w = j.w - i*2, cx = j.cx, m = j.m - i*0.4, top = j.y + j.h*0.03, xr = x + w, b = j.bottom - i, r = j.r;
  c.beginPath();
  c.moveTo(cx - m, top);
  c.lineTo(cx - m, j.neck);
  c.bezierCurveTo(cx - m, j.shoulder - j.h*0.06, x, j.shoulder - j.h*0.06, x, j.shoulder + j.h*0.04);
  c.lineTo(x, b - r);
  c.quadraticCurveTo(x, b, x + r, b);
  c.lineTo(xr - r, b);
  c.quadraticCurveTo(xr, b, xr, b - r);
  c.lineTo(xr, j.shoulder + j.h*0.04);
  c.bezierCurveTo(xr, j.shoulder - j.h*0.06, cx + m, j.shoulder - j.h*0.06, cx + m, j.neck);
  c.lineTo(cx + m, top);
  c.closePath();
}
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* ---------- статичный фон ---------- */
function buildBg(){
  bg = document.createElement('canvas'); bg.width = sc.width; bg.height = sc.height;
  const g = bg.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  const rnd = mulberry(11), j = jar;
  const hz = j.y + j.h * 0.44, pb = j.bottom - j.h * 0.1;
  j.hz = hz; j.pb = pb;
  let gr = g.createLinearGradient(0,0,0,hz);
  gr.addColorStop(0,'#04080d'); gr.addColorStop(.45,'#0a1820'); gr.addColorStop(.8,'#14292f'); gr.addColorStop(1,'#1d3a3d');
  g.fillStyle = gr; g.fillRect(0,0,W,hz+2);
  const mx = W*0.8, my = Math.max(j.slot.top + 70, hz - j.h*0.5), mr = Math.min(22, W*0.055);
  j.moon = {x:mx, y:my, r:mr};
  gr = g.createRadialGradient(mx,my,0,mx,my,mr*9);
  gr.addColorStop(0,'rgba(240,232,214,.22)'); gr.addColorStop(.35,'rgba(200,210,205,.07)'); gr.addColorStop(1,'rgba(200,210,205,0)');
  g.fillStyle = gr; g.fillRect(mx-mr*9,my-mr*9,mr*18,mr*18);
  gr = g.createLinearGradient(0,hz-j.h*0.28,0,hz);
  gr.addColorStop(0,'rgba(58,40,80,0)'); gr.addColorStop(1,'rgba(58,40,80,.38)');
  g.fillStyle = gr; g.fillRect(0,hz-j.h*0.28,W,j.h*0.28);
  gr = g.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);
  gr.addColorStop(0,'#fbf4e2'); gr.addColorStop(1,'#d9cfb6');
  g.fillStyle = gr; g.beginPath(); g.arc(mx,my,mr,0,7); g.fill();
  g.fillStyle = 'rgba(150,140,118,.22)';
  [[-.35,-.25,.28],[.3,.2,.22],[-.05,.45,.16],[.38,-.38,.14],[-.4,.28,.12]].forEach(([a,b2,r]) => { g.beginPath(); g.arc(mx+a*mr,my+b2*mr,r*mr,0,7); g.fill(); });
  stars = [];
  for (let i = 0; i < 90; i++){ const y = Math.pow(rnd(),1.3) * (hz - 30); const x = rnd()*W; if (y < 60 || (y < j.slot.top + 70 && x > W*.06 && x < W*.94)) continue; stars.push({x, y, r: rnd()*1.0 + .3, ph: rnd()*6, sp: .5 + rnd()*1.6}); }
  const forest = (base, amp, col, spikes, seed) => {
    const r2 = mulberry(seed); g.fillStyle = col; g.beginPath(); g.moveTo(0, hz);
    for (let x = 0; x <= W + 8; x += 5){
      let y = hz - base - Math.abs(Math.sin(x*0.013 + seed))*amp - Math.sin(x*0.05 + seed*2)*3;
      if (spikes && r2() < .32) y -= 4 + r2()*10;
      g.lineTo(x, y);
    }
    g.lineTo(W, hz); g.closePath(); g.fill();
  };
  forest(14, 26, '#0e2127', true, 3);
  forest(7, 16, '#08161b', true, 8);
  gr = g.createLinearGradient(0,hz,0,pb+16);
  gr.addColorStop(0,'#1c3a40'); gr.addColorStop(.35,'#112a30'); gr.addColorStop(1,'#08171b');
  g.fillStyle = gr; g.fillRect(0,hz,W,pb-hz+16);
  g.save(); g.beginPath(); g.rect(0,hz,W,(pb-hz)); g.clip();
  g.globalAlpha = .5; g.translate(0, hz*2); g.scale(1,-1);
  g.fillStyle = '#050e12';
  g.beginPath(); g.moveTo(0,hz);
  { const r2 = mulberry(8); for (let x = 0; x <= W + 8; x += 5){ g.lineTo(x, hz - 7 - Math.abs(Math.sin(x*0.013 + 8))*16 - Math.sin(x*0.05 + 16)*3 - (r2() < .32 ? 4 + r2()*10 : 0)); } }
  g.lineTo(W,hz); g.closePath(); g.fill(); g.restore();
  g.lineCap = 'round';
  for (let i = 0; i < 40; i++){
    const t = Math.pow(rnd(), .9), y = hz + 4 + (pb-hz-8) * t, x = rnd()*W, l = (6 + rnd()*50) * (.4 + t); if (x + l > j.x - 4 && x < j.x + j.w + 4) continue;
    g.strokeStyle = `rgba(190,215,215,${.03 + .05*t*rnd()})`; g.lineWidth = .8 + t*.8;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y); g.stroke();
  }
  const spots = [[.08,.5,1.1],[.22,.84,1.2],[.9,.55,1],[.78,.88,1.25],[.66,.36,.65],[.34,.3,.62],[.5,.18,.45],[.95,.82,1]];
  spots.forEach(([fxp, fyp, s], i) => {
    const x = W*fxp, y = hz + (pb-hz)*fyp;
    if (Math.abs(x - j.cx) < j.w*0.5 && fyp > .55) return;
    lily(g, x, y, (7 + 17*fyp) * s, i % 2 === 0, rnd);
  });
  gr = g.createLinearGradient(0,pb-6,0,H);
  gr.addColorStop(0,'#142a22'); gr.addColorStop(.12,'#0d1f19'); gr.addColorStop(1,'#050d0a');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(0,pb+8);
  for (let x = 0; x <= W; x += 16) g.quadraticCurveTo(x+8, pb - 3 + rnd()*7, x+16, pb + 2 + rnd()*6);
  g.lineTo(W,H); g.lineTo(0,H); g.closePath(); g.fill();
  for (let i = 0; i < W/1.8; i++){
    const x = rnd()*W, y = pb + rnd()*Math.min(70, H - pb) + 2, hgt = 8 + rnd()*24;
    g.strokeStyle = ['#1b4332','#14352a','#0f2a20','#245a3d'][Math.floor(rnd()*4)]; g.lineWidth = .9 + rnd()*.8;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x + (rnd()-.5)*6, y - hgt*0.6, x + (rnd()-.5)*12, y - hgt); g.stroke();
  }
  for (let i = 0; i < 14; i++){
    const x = rnd()*W, y = pb + 14 + rnd()*Math.max(20, Math.min(70, H - pb - 20)), r = 2 + rnd()*4;
    gr = g.createRadialGradient(x-r*.3,y-r*.4,0,x,y,r*1.2); gr.addColorStop(0,'#3b4a45'); gr.addColorStop(1,'#101a18');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x,y,r*1.3,r*.8,0,0,7); g.fill();
  }
  reeds = [];
  [[0.0, 0.2], [0.82, 1.0]].forEach(([a,b2]) => { for (let i = 0; i < 8; i++){ reeds.push({ x: W*(a + (b2-a)*rnd()), base: pb + 12 + rnd()*26,
    h: j.h*(0.3 + rnd()*0.42), ph: rnd()*6, head: rnd() < .55, lean: (rnd()-.5)*0.25, w: 1.6 + rnd()*1.2 }); } });
  reeds = reeds.filter(r => r.x < j.x - 8 || r.x > j.x + j.w + 8);
  reeds.sort((p, q) => p.base - q.base);
  blades = [];
  for (let i = 0; i < 30; i++){ const x = j.x - j.w*0.2 + rnd()*j.w*1.4;
    blades.push({ x, base: j.bottom + 3 + rnd()*12, h: 10 + rnd()*26, ph: rnd()*6, lean: (rnd()-.5)*12 }); }
  sparkles = [];
  for (let i = 0; i < 16; i++) sparkles.push({ x: rnd()*W, y: hz + 6 + rnd()*(pb-hz-14), ph: rnd()*6, sp: .6 + rnd()*1.4 });
}

function lily(g, x, y, s, flower, rnd){
  const notch = rnd()*6.28;
  g.save(); g.translate(x,y);
  g.fillStyle = 'rgba(2,8,10,.45)'; g.beginPath(); g.ellipse(2, s*.1, s*1.08, s*.42, 0, 0, 7); g.fill();
  g.scale(1, .36);
  let gr = g.createRadialGradient(-s*.2,-s*.25,s*.05,0,0,s);
  gr.addColorStop(0,'#4d8657'); gr.addColorStop(.6,'#2f5c3c'); gr.addColorStop(1,'#1f4230');
  g.fillStyle = gr; g.beginPath(); g.moveTo(0,0); g.arc(0,0,s, notch + .26, notch + 6.02); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(150,200,140,.22)'; g.lineWidth = 1.2; g.stroke();
  g.strokeStyle = 'rgba(190,230,170,.16)'; g.lineWidth = .8;
  for (let k = 0; k < 11; k++){ const a = notch + .5 + k*(5.2/10); g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(a)*s*.94, Math.sin(a)*s*.94); g.stroke(); }
  g.restore();
  if (flower){
    g.save(); g.translate(x + s*0.08, y - s*0.1);
    const p = s*.5;
    for (let ring = 0; ring < 2; ring++){
      const n = ring ? 7 : 9, len = p*(ring ? .68 : 1), wd = p*(ring ? .2 : .24);
      for (let k = 0; k < n; k++){
        const a = (k - (n-1)/2) * (ring ? .5 : .4) + (ring ? .2 : 0);
        g.save(); g.rotate(a);
        gr = g.createLinearGradient(0,0,0,-len);
        gr.addColorStop(0, ring ? '#e08aa3' : '#e99bb2'); gr.addColorStop(1, ring ? '#fbe3ea' : '#f7d2dc');
        g.fillStyle = gr;
        g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(wd*1.3, -len*.45, 0, -len); g.quadraticCurveTo(-wd*1.3, -len*.45, 0, 0); g.fill();
        g.restore();
      }
    }
    gr = g.createRadialGradient(0,-p*.12,0,0,-p*.12,p*.26); gr.addColorStop(0,'#fff0b8'); gr.addColorStop(1,'rgba(232,199,122,.9)');
    g.fillStyle = gr; g.beginPath(); g.arc(0,-p*.12,p*.2,0,7); g.fill();
    g.restore();
  }
}

/* ---------- светлячки в банке ---------- */
const sprites = new Map();
const hidden = new Set();
function mkSprite(u, v){
  return { u: u ?? (0.1 + Math.random()*0.8), v: v ?? (0.1 + Math.random()*0.8), vu: 0, vv: 0, ang: Math.random()*6.28,
    rate: 0.16 + Math.random()*0.4, ph: Math.random(), size: 0.85 + Math.random()*0.35, dir: 0 };
}
function syncSprites(){
  const ids = new Set(notes.map(n => n.id));
  for (const id of sprites.keys()) if (!ids.has(id)) sprites.delete(id);
  for (const n of notes) if (!sprites.has(n.id) && !hidden.has(n.id)) sprites.set(n.id, mkSprite());
}
function spritePx(s){ const i = jar.inner; return { x: i.x + s.u*i.w, y: i.y + s.v*i.h }; }
function blink(s, t){
  const p = (t * s.rate + s.ph) % 1;
  const f = p < 0.26 ? Math.pow(Math.sin(p / 0.26 * Math.PI), 1.6) : 0;
  return 0.28 + 0.72 * f;
}
function stepSprites(dt){
  const sp = reduce ? 0.25 : 1, iw = jar.inner.w, ih = jar.inner.h;
  for (const s of sprites.values()){
    s.ang += (Math.random() - .5) * 0.5 * dt;
    s.vu += Math.cos(s.ang) * 0.00012 * dt * sp * (200/iw);
    s.vv += Math.sin(s.ang) * 0.00012 * dt * sp * (200/ih) - 0.000015 * dt;
    if (s.u < .06) s.vu += .0006*dt; if (s.u > .94) s.vu -= .0006*dt;
    if (s.v < .05) s.vv += .0006*dt; if (s.v > .95) s.vv -= .0006*dt;
    s.vu *= Math.pow(0.95, dt); s.vv *= Math.pow(0.95, dt);
    const mx = 0.004 * sp;
    s.vu = Math.max(-mx, Math.min(mx, s.vu)); s.vv = Math.max(-mx, Math.min(mx, s.vv));
    s.u = Math.max(0, Math.min(1, s.u + s.vu*dt)); s.v = Math.max(0, Math.min(1, s.v + s.vv*dt));
    s.dir = Math.atan2(s.vv, s.vu);
  }
}
function initWild(){
  wild = [];
  for (let i = 0; i < 7; i++) wild.push({ x: Math.random()*W, y: jar.hz - 30 + Math.random()*(H - jar.hz), ang: Math.random()*6.28,
    rate: .14 + Math.random()*.28, ph: Math.random(), vx: 0, vy: 0 });
}
function stepWild(dt){
  const sp = reduce ? .2 : 1;
  for (const f of wild){
    f.ang += (Math.random()-.5)*0.3*dt;
    f.vx = f.vx*0.97 + Math.cos(f.ang)*0.012*dt*sp; f.vy = f.vy*0.97 + Math.sin(f.ang)*0.012*dt*sp;
    f.x += f.vx*dt; f.y += f.vy*dt;
    if (f.x < -10) f.x = W + 10; if (f.x > W + 10) f.x = -10;
    if (f.y < jar.hz - 60) f.ang = Math.PI/2; if (f.y > H*0.82) f.ang = -Math.PI/2;
    if (f.x > jar.x - 40 && f.x < jar.x + jar.w + 40 && f.y > jar.y - 20 && f.y < jar.bottom + 10){ f.ang = f.x < jar.cx ? Math.PI : 0; f.x += f.x < jar.cx ? -1.5 : 1.5; }
  }
}
function initMist(){
  mists = [];
  for (let i = 0; i < 4; i++) mists.push({ x: Math.random()*W, y: jar.hz + (jar.pb - jar.hz)*(.1 + Math.random()*.7), w: W*(.7 + Math.random()*.6), h: 46 + Math.random()*40, v: (.1 + Math.random()*.15) * (Math.random() < .5 ? -1 : 1), a: .35 + Math.random()*.3 });
}
function addRipple(x, y, big){ ripples.push({ x, y, t0: performance.now(), life: big ? 3200 : 2400 + Math.random()*1200, R: big ? 54 : 18 + Math.random()*22, a: big ? .5 : .28 }); if (ripples.length > 14) ripples.shift(); }
let nextRip = 0;

/* ---------- полёты и искры ---------- */
const flights = [], sparks = [];
function fly(opt){
  return new Promise(res => {
    const f = Object.assign({ t0: performance.now(), dur: 900, size: 1.3, wob: 0 }, opt, { res });
    if (reduce) f.dur = Math.min(f.dur, 250);
    flights.push(f);
  });
}
function burst(x, y, n, spd){
  if (reduce) n = Math.min(n, 4);
  for (let i = 0; i < n; i++){ const a = Math.random()*6.28, v = (.3 + Math.random())*spd;
    sparks.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - spd*.3, t0: performance.now(), life: 900 + Math.random()*900, s: .4 + Math.random()*.6 }); }
}
function bez(a, c1, c2, b, t){ const u = 1 - t; return u*u*u*a + 3*u*u*t*c1 + 3*u*t*t*c2 + t*t*t*b; }
function ease(t){ return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2; }
let lid = 0;

/* ---------- кадр ---------- */
let last = performance.now(), running = true;
function frame(now){
  if (!running) return;
  const dt = Math.min(3, (now - last) / 16.67); last = now;
  const t = now / 1000;
  stepSprites(dt); stepWild(dt);
  wobV += -wob*0.06*dt; wobV *= Math.pow(.93, dt); wob += wobV*dt;
  const wantLid = flights.some(f => f.jar) ? 1 : 0;
  lid += (wantLid - lid) * Math.min(1, 0.12 * dt);
  if (now > nextRip){ addRipple(W*(.1 + Math.random()*.8), jar.hz + (jar.pb - jar.hz)*(.15 + Math.random()*.75)); nextRip = now + 1600 + Math.random()*3200; }
  drawScene(t, dt);
  drawFx(now, t);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ running = false; }
  else if (!running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
});

function drawScene(t, dt){
  const c = sctx, j = jar;
  c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.drawImage(bg, 0, 0);
  c.setTransform(DPR,0,0,DPR,0,0);
  const n = notes.length;
  const lightA = Math.min(0.7, 0.2 + n * 0.02);
  c.fillStyle = '#f6efe4';
  for (const s of stars){ c.globalAlpha = 0.3 + 0.5*(0.5 + 0.5*Math.sin(t*s.sp + s.ph)) * (reduce ? .6 : 1); c.fillRect(s.x, s.y, s.r, s.r); }
  c.globalAlpha = 1;
  const m = j.moon;
  c.lineCap = 'round';
  for (let i = 0; i < 9; i++){
    const y = j.hz + 4 + i * (j.pb - j.hz - 8) / 9, w = 5 + i*3.4 + Math.sin(t*1.2 + i*1.7)*3;
    c.globalAlpha = (0.5 - i*0.045) * (.75 + .25*Math.sin(t*1.5 + i*2));
    c.strokeStyle = 'rgba(244,236,214,.55)'; c.lineWidth = 1.2 + i*.12;
    const sx = Math.sin(t*.8 + i)*2.2;
    c.beginPath(); c.moveTo(m.x - w + sx, y); c.lineTo(m.x + w + sx, y); c.stroke();
  }
  c.globalAlpha = 1;
  for (const s of sparkles){ const a = Math.pow(Math.max(0, Math.sin(t*s.sp + s.ph)), 6); if (a < .05) continue; c.globalAlpha = a*.55; c.fillStyle = '#e9f3ee'; c.fillRect(s.x, s.y, 1.6, 1); }
  c.globalAlpha = 1;
  { const gl = c.createRadialGradient(j.cx, j.pb, 0, j.cx, j.pb, j.w*1.3);
    gl.addColorStop(0, `rgba(233,196,106,${lightA*.3})`); gl.addColorStop(1, 'rgba(233,196,106,0)');
    c.save(); c.translate(0, j.pb); c.scale(1, .22); c.translate(0, -j.pb); c.fillStyle = gl; c.fillRect(j.cx - j.w*1.4, j.pb - j.w*1.4, j.w*2.8, j.w*2.8); c.restore(); }
  const nowp = performance.now();
  c.lineWidth = 1;
  for (let i = ripples.length - 1; i >= 0; i--){
    const r = ripples[i], k = (nowp - r.t0) / r.life;
    if (k >= 1){ ripples.splice(i, 1); continue; }
    const e = 1 - Math.pow(1 - k, 2), R = r.R * e;
    c.strokeStyle = `rgba(210,232,230,${r.a * (1 - k)})`;
    c.beginPath(); c.ellipse(r.x, r.y, R, R*.34, 0, 0, 7); c.stroke();
    if (k > .15){ c.strokeStyle = `rgba(210,232,230,${r.a * (1 - k) * .5})`; c.beginPath(); c.ellipse(r.x, r.y, R*.62, R*.21, 0, 0, 7); c.stroke(); }
  }
  for (const ms of mists){
    ms.x += ms.v * dt * .12; if (ms.x > W + ms.w*.5) ms.x = -ms.w*.5; if (ms.x < -ms.w*.5) ms.x = W + ms.w*.5;
    c.globalAlpha = ms.a * .55; c.drawImage(mistSp, ms.x - ms.w/2, ms.y - ms.h/2, ms.w, ms.h);
  }
  c.globalAlpha = 1;
  for (const r of reeds){

function drawFx(now, t){
  const c = fctx;
  c.setTransform(1,0,0,1,0,0); c.clearRect(0, 0, fx.width, fx.height);
  if (!flights.length && !sparks.length) return;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.globalCompositeOperation = 'lighter';
  for (let i = flights.length - 1; i >= 0; i--){
    const f = flights[i];
    const k = Math.min(1, (now - f.t0) / f.dur), e = f.linear ? k : ease(k);
    const pts = typeof f.path === 'function' ? f.path() : f.path;
    for (let tr = 6; tr >= 0; tr--){
      const ee = Math.max(0, e - tr*0.016);
      let x = bez(pts[0].x, pts[1].x, pts[2].x, pts[3].x, ee), y = bez(pts[0].y, pts[1].y, pts[2].y, pts[3].y, ee);
      if (f.wob){ x += Math.sin(ee*18) * f.wob * (1 - ee); y += Math.cos(ee*13) * f.wob * 0.6 * (1 - ee); }
      const b = tr ? 0.22*(1 - tr/8) : 0.8 + 0.2*Math.sin(t*9);
      const R = (tr ? 9 : 18) * f.size * (f.fade ? (1 - k) : 1);
      c.globalAlpha = b * (f.fade ? 1 - k*0.8 : 1);
      c.drawImage(glow, x - R, y - R, R*2, R*2);
      if (!tr && Math.random() < .35 && !reduce) sparks.push({ x, y, vx: (Math.random()-.5)*.3, vy: .1 + Math.random()*.2, t0: now, life: 500 + Math.random()*500, s: .35 });
    }
    if (k >= 1){ flights.splice(i, 1); f.res(); }
  }
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i], k = (now - s.t0) / s.life;
    if (k >= 1){ sparks.splice(i, 1); continue; }
    const tt = (now - s.t0) / 16.67;
    const x = s.x + s.vx*tt, y = s.y + s.vy*tt + .004*tt*tt, R = 7*s.s*(1 - k);
    c.globalAlpha = (1 - k) * .9; c.drawImage(glow, x - R, y - R, R*2, R*2);
  }
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

/* ---------- интерфейс ---------- */
function renderCount(){
  const n = notes.length;
  $('title').textContent = n ? `В банке ${n} ${plural(n,'светлячок','светлячка','светлячков')}` : 'Банка светлячков';
}
function centerOf(el){ const r = el.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

let openSheetId = null, cardOn = false;
function openSheet(id){
  if (openSheetId && openSheetId !== id) $(openSheetId).classList.remove('on');
  openSheetId = id; $(id).classList.add('on'); $('scrim').classList.add('on');
}
function closeSheet(){
  if (openSheetId) $(openSheetId).classList.remove('on'); openSheetId = null;
  if (!cardOn) $('scrim').classList.remove('on');
}
$('scrim').addEventListener('click', () => { if (cardOn) cardBack(); else closeSheet(); });
const anyOpen = () => !!openSheetId || cardOn;

function autosize(){ const ta = $('note'); ta.style.height = '52px'; ta.style.height = Math.min(104, Math.max(52, ta.scrollHeight)) + 'px'; }
$('note').addEventListener('input', autosize);

async function addNote(text, from, start, extra){
  text = String(text || '').trim().slice(0, 280);
  if (!text) return null;
  const n = Object.assign({ id: uid(), text, date: todayKey(), ts: Date.now() }, extra || {});
  if (from) n.from = String(from).slice(0, 30);
  notes.push(n); save('notes', notes);
  hidden.add(n.id);
  renderCount();
  chime(from ? 'gift' : 'in'); vib(10);
  await flyIntoJar(start);
  hidden.delete(n.id);
  const s = mkSprite(0.5, 0.02); s.vv = 0.004; sprites.set(n.id, s);
  wobV += .012; burst(jar.mouth.x, jar.mouth.y + jar.h*.1, 9, .9);
  return n;
}
function flyIntoJar(start){
  const mo = jar.mouth, s = start || { x: W/2, y: H*0.8 };
  return fly({ jar: true, dur: 1300, path: () => [ s, { x: s.x + (mo.x - s.x)*0.2, y: Math.min(s.y, mo.y) - 120 },
    { x: mo.x + 30, y: mo.y - 90 }, { x: mo.x, y: mo.y + jar.h*0.12 } ] });
}
$('addBtn').addEventListener('click', async () => {
  const ta = $('note'), v = ta.value.trim();
  if (!v){ toast('Напиши хоть пару слов. Можно совсем маленькое'); ta.focus(); return; }
  const start = centerOf($('addBtn'));
  ta.value = ''; autosize(); ta.blur();
  const q = currentPrompt !== DEFAULT_PROMPT ? currentPrompt : undefined;
  setPrompt(DEFAULT_PROMPT);
  await addNote(v, null, start, q ? { q } : null);
  toast('Светлячок в банке');
});
$('note').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); $('addBtn').click(); } });

function setPrompt(p){
  currentPrompt = p; const el = $('promptLine');
  if (reduce){ el.textContent = p; return; }
  el.style.opacity = 0; setTimeout(() => { el.textContent = p; el.style.opacity = 1; }, 200);
}
$('hintBtn').addEventListener('click', () => {
  if (!promptBag.length){ promptBag = PROMPTS.map((_, i) => i); for (let i = promptBag.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [promptBag[i], promptBag[j]] = [promptBag[j], promptBag[i]]; } }
  setPrompt(PROMPTS[promptBag.pop()]); chime('tap'); vib(6);
});

let cardMode = '', shown = null, pendingGift = null, subSure = false;
function showCard(mode, d){
  cardMode = mode; subSure = false;
  const g = mode === 'gift';
  $('cTitle').hidden = !g; $('cTitle').textContent = g ? 'Тебе прилетел светлячок' : '';
  $('cQ').hidden = g || !d.q; $('cQ').textContent = d.q || '';
  $('cDate').textContent = g ? 'записка от ' + human(d.date).replace(/^сегодня, /, '') : human(d.date);
  $('cText').textContent = d.text;
  $('cFrom').textContent = d.from ? '— ' + d.from : '';
  $('cMain').textContent = g ? 'Положить в банку' : 'Вернуть в банку';
  $('cSub').textContent = g ? 'Не сейчас' : 'Отпустить насовсем';
  $('card').classList.add('on'); cardOn = true; $('scrim').classList.add('on');
  $('cMain').focus({ preventScroll: true });
}
function hideCard(){ $('card').classList.remove('on'); cardOn = false; if (!openSheetId) $('scrim').classList.remove('on'); }

let busy = false;
function pickNote(){
  const pool = notes.filter(n => !recent.includes(n.id));
  const src = pool.length ? pool : notes;
  return src[Math.floor(Math.random() * src.length)];
}
async function pull(){
  if (busy || anyOpen()) return;
  if (!notes.length){ toast('Банка пока пустая. Начни с чего-то маленького'); wobV += .02; vib(6); return; }
  busy = true;
  const n = pickNote();
  recent = [n.id].concat(recent.filter(x => x !== n.id)).slice(0, Math.min(5, Math.max(0, notes.length - 1)));
  save('recent', recent);
  const s = sprites.get(n.id);
  const p = s ? spritePx(s) : { x: jar.cx, y: jar.inner.y + jar.inner.h/2 };
  sprites.delete(n.id); hidden.add(n.id);
  chime('out'); vib(12); wobV += .015;
  const mo = jar.mouth;
  await fly({ jar: true, dur: 650, size: 1.2, path: [ p, { x: p.x, y: p.y - 40 }, { x: mo.x, y: mo.y + 40 }, { x: mo.x, y: mo.y - 20 } ] });
  const dest = { x: W/2, y: H*0.4 };
  await fly({ dur: 800, size: 1.6, path: [ { x: mo.x, y: mo.y - 20 }, { x: mo.x - 60, y: mo.y - 120 }, { x: dest.x + 70, y: dest.y - 60 }, dest ] });
  burst(dest.x, dest.y, 16, 1.1);
  shown = n; showCard('note', n);
  busy = false;
}
async function cardBack(){ if (cardMode === 'note') await returnShown(); else await laterGift(); }
async function returnShown(){
  if (!shown) return;
  const n = shown; shown = null; hideCard();
  await flyIntoJar({ x: W/2, y: H*0.4 });
  hidden.delete(n.id);
  if (notes.some(x => x.id === n.id)){ const s = mkSprite(0.5, 0.02); s.vv = 0.004; sprites.set(n.id, s); }
}
async function releaseShown(){
  const n = shown; shown = null; hideCard();
  notes = notes.filter(x => x.id !== n.id); save('notes', notes);
  hidden.delete(n.id); renderCount(); vib(8);
  await fly({ dur: 1800, fade: true, path: [ { x: W/2, y: H*0.4 }, { x: W*0.2, y: H*0.3 }, { x: W*0.9, y: H*0.15 }, { x: W*0.7, y: -30 } ] });
}
async function acceptGift(){
  if (!pendingGift) return;
  const g = pendingGift; pendingGift = null;
  accepted.push(g.gid); save('gifts', accepted);
  hideCard(); clearHash();
  await addNote(g.text, g.from || 'тот, кто тебя любит', { x: W/2, y: H*0.4 }, { gift: true, sent: g.date });
  toast('Светлячок теперь в твоей банке');
}
async function laterGift(){
  pendingGift = null; hideCard(); clearHash();
  await fly({ dur: 1500, fade: true, path: [ { x: W/2, y: H*0.4 }, { x: W*0.1, y: H*0.3 }, { x: W*0.6, y: H*0.1 }, { x: W + 30, y: H*0.05 } ] });
}
$('cMain').addEventListener('click', () => { if (cardMode === 'gift') acceptGift(); else returnShown(); });
$('cSub').addEventListener('click', () => {
  if (cardMode === 'gift'){ laterGift(); return; }
  if (!subSure){ subSure = true; $('cSub').textContent = 'Точно отпустить? Нажми ещё раз'; return; }
  releaseShown();
});
$('card').addEventListener('click', e => { if (e.target.id === 'card') cardBack(); });

function slotTap(e){
  if (e.clientX > jar.x && e.clientX < jar.x + jar.w && e.clientY > jar.y && e.clientY < jar.bottom) pull();
  else if (e.clientY > jar.hz && e.clientY < jar.pb){ addRipple(e.clientX, e.clientY, true); chime('tap'); vib(5); }
}
$('jarSlot').addEventListener('click', slotTap);
$('jarSlot').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pull(); } });
$('pullBtn').addEventListener('click', pull);

/* ---------- дни ---------- */
function streakInfo(){
  const days = new Set(notes.map(n => n.date));
  let streak = 0; const d = parseKey(todayKey());
  if (!days.has(dkey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dkey(d))){ streak++; d.setDate(d.getDate() - 1); }
  return { days: days.size, streak };
}
function renderStats(){
  const n = notes.length, si = streakInfo();
  $('stats').innerHTML = `<div><b>${n}</b><span class="z-cap">${plural(n,'светлячок','светлячка','светлячков')}</span></div>` +
    `<div><b>${si.days}</b><span class="z-cap">${plural(si.days,'день','дня','дней')} с записями</span></div>` +
    (si.streak > 1 ? `<div><b>${si.streak}</b><span class="z-cap">подряд</span></div>` : '');
}
let selDay = todayKey();
function renderCal(){
  const byDay = {}; notes.forEach(n => { byDay[n.date] = (byDay[n.date] || 0) + 1; });
  const today = parseKey(todayKey());
  const first = notes.reduce((a, n) => n.date < a ? n.date : a, todayKey());
  let start = parseKey(first); const min = new Date(today); min.setDate(min.getDate() - 27);
  if (min < start) start = min;
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const cal = $('cal'); cal.innerHTML = '';
  let lastMon = -1;
  for (const d = new Date(start); d <= today || ((d.getDay() + 6) % 7) !== 0; d.setDate(d.getDate() + 1)){
    const dow = (d.getDay() + 6) % 7;
    const k = dkey(d), cnt = byDay[k] || 0, b = document.createElement('button');
    if (d > today){ b.className = 'cal-d void'; b.tabIndex = -1; cal.appendChild(b); continue; }
    b.className = 'cal-d' + (cnt ? ' has' : '') + (k === selDay ? ' sel' : '') + (k === todayKey() ? ' today' : '');
    b.setAttribute('aria-label', human(k) + ': ' + (cnt ? cnt + ' ' + plural(cnt,'запись','записи','записей') : 'нет записей'));
    let dots = ''; for (let q = 0; q < Math.min(3, cnt); q++) dots += '<i></i>'; if (cnt > 3) dots += '<b>+' + (cnt - 3) + '</b>';
    b.innerHTML = `<span>${d.getDate()}</span><span class="dts">${dots}</span>`;
    b.addEventListener('click', () => { selDay = k; vib(4); renderCal(); renderDay(); });
    cal.appendChild(b);
  }
}
function renderDay(){
  const k = selDay, list = notes.filter(n => n.date === k).sort((a, b) => a.ts - b.ts);
  const box = $('dayBox'); box.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = human(k).replace(/^./, s => s.toUpperCase()); box.appendChild(h);
  const ul = document.createElement('ul'); ul.className = 'daylist';
  if (!list.length){ const li = document.createElement('li'); li.className = 'none';
    li.textContent = k === todayKey() ? 'Сегодня пока пусто. Может, вспомнится что-то маленькое?' : 'В этот день записей нет. Так бывает.'; ul.appendChild(li); }
  list.forEach(n => { const li = document.createElement('li'); li.textContent = n.text;
    if (n.from || n.q){ const sm = document.createElement('small'); sm.textContent = n.from ? 'записка от: ' + n.from : n.q; li.appendChild(sm); }
    ul.appendChild(li); });
  box.appendChild(ul);
}
$('menuBtn').addEventListener('click', () => {
  if (busy) return;
  selDay = todayKey(); renderStats(); renderCal(); renderDay(); openSheet('menuSheet');
  requestAnimationFrame(() => { const b = $('calBox'); b.scrollTop = b.scrollHeight; });
});

/* ---------- встряхивание ---------- */
let lastShake = 0, prevG = null, shakeOn = false;
function onMotion(e){
  let mag = 0; const a = e.acceleration;
  if (a && a.x != null){ mag = Math.hypot(a.x, a.y, a.z); }
  else if (e.accelerationIncludingGravity){
    const g = e.accelerationIncludingGravity;
    if (prevG) mag = Math.hypot(g.x - prevG.x, g.y - prevG.y, g.z - prevG.z) * 0.8;
    prevG = { x: g.x, y: g.y, z: g.z };
  }
  const now = Date.now();
  if (mag > 14 && now - lastShake > 2200){ lastShake = now; pull(); }
}
function enableShake(){ if (shakeOn) return; shakeOn = true; addEventListener('devicemotion', onMotion); }
const DME = window.DeviceMotionEvent;
if (DME && typeof DME.requestPermission === 'function'){
  $('shakeBtn').hidden = false;
  $('shakeBtn').addEventListener('click', async () => {
    try{
      const r = await DME.requestPermission();
      if (r === 'granted'){ enableShake(); $('shakeBtn').hidden = true; toast('Теперь можно встряхнуть телефон, и выпадет светлячок'); }
      else toast('Без разрешения встряхивание не работает, но кнопка «Достать» всегда есть');
    }catch(e){ toast('Не получилось включить встряхивание'); }
  });
} else if (DME && matchMedia('(pointer:coarse)').matches){
  enableShake(); $('shakeNote').hidden = false;
}

/* ---------- записки для мамы (формат ссылки как в v1) ---------- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
  const bin = atob(s); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function hashStr(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 ^ s.charCodeAt(i)) >>> 0; return 'g' + h.toString(36); }
function makeGiftLink(text, from){
  const payload = { t: String(text).trim().slice(0, 200), d: todayKey(), n: Math.random().toString(36).slice(2, 6) };
  if (from && from.trim()) payload.f = from.trim().slice(0, 30);
  return location.href.split('#')[0] + '#gift=' + b64enc(JSON.stringify(payload));
}
window.__jar = { makeGiftLink, notes: () => notes, pull, b64dec };

$('giftBtn').addEventListener('click', () => { $('linkBox').classList.remove('show'); openSheet('giftSheet'); });
$('giftClose').addEventListener('click', closeSheet);
$('giftText').addEventListener('input', () => { $('giftCount').textContent = $('giftText').value.length + ' / 200'; $('linkBox').classList.remove('show'); });
$('giftFrom').addEventListener('input', () => $('linkBox').classList.remove('show'));
$('makeLink').addEventListener('click', () => {
  const t = $('giftText').value.trim();
  if (!t){ toast('Сначала напиши записку'); $('giftText').focus(); return; }
  $('linkOut').value = makeGiftLink(t, $('giftFrom').value);
  $('linkBox').classList.add('show');
  $('shareLink').style.display = navigator.share ? '' : 'none';
  chime('soft'); vib(8);
});
$('copyLink').addEventListener('click', async () => {
  const v = $('linkOut').value; let ok = false;
  try{ if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(v); ok = true; } }catch(e){}
  if (!ok){ try{ const i = $('linkOut'); i.focus(); i.select(); i.setSelectionRange(0, v.length); ok = document.execCommand('copy'); }catch(e){} }
  toast(ok ? 'Ссылка скопирована. Отправь её маме' : 'Выдели ссылку и скопируй вручную');
});
$('shareLink').addEventListener('click', async () => {
  try{ await navigator.share({ title: 'Светлячок для тебя', text: 'Тебе прилетел светлячок', url: $('linkOut').value }); }catch(e){}
});

function clearHash(){ try{ history.replaceState(null, '', location.href.split('#')[0]); }catch(e){ location.hash = ''; } }
async function handleHash(){
  const m = location.hash.match(/^#gift=([A-Za-z0-9_\-]+)/);
  if (!m) return;
  let data;
  try{ data = JSON.parse(b64dec(m[1])); if (!data || typeof data.t !== 'string' || !data.t.trim()) throw 0; }
  catch(e){ clearHash(); toast('Ссылка повреждена, светлячок не долетел'); return; }
  const gid = hashStr(m[1]);
  if (accepted.includes(gid)){ clearHash(); toast('Этот светлячок уже живёт в твоей банке'); return; }
  pendingGift = { gid, text: data.t.slice(0, 200), from: (data.f || '').slice(0, 30), date: /^\d{4}-\d\d-\d\d$/.test(data.d || '') ? data.d : todayKey() };
  const dest = { x: W/2, y: H*0.4 };
  await fly({ dur: 2600, size: 1.6, wob: 40, path: [ { x: -30, y: H*0.15 }, { x: W*0.9, y: H*0.05 }, { x: W*0.05, y: H*0.6 }, dest ] });
  burst(dest.x, dest.y, 18, 1.1);
  showCard('gift', pendingGift);
}
addEventListener('hashchange', handleHash);

addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (cardOn) cardBack(); else closeSheet();
});

/* ---------- старт ---------- */
let rzT = 0;
function relayout(){ clearTimeout(rzT); rzT = setTimeout(layout, 60); }
addEventListener('resize', relayout);
if ('ResizeObserver' in window) new ResizeObserver(relayout).observe($('jarSlot'));
renderSound(); renderCount();
layout(); syncSprites();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
if (!seen){
  setTimeout(() => {
    const h = $('hint');
    h.textContent = notes.length ? 'Банка стала светлее.\nВсе твои светлячки на месте.' : 'Напиши что-то хорошее, и оно станет светлячком.';
    h.classList.add('on'); save('v2_seen', true);
    setTimeout(() => h.classList.remove('on'), 6500);
  }, 1200);
}
handleHash();
})();
